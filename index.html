      <${Field} label="Reason">
        <select className="input" value=${form.reason} onChange=${set('reason')}>
          ${['Medical appointment', 'Illness', 'Family emergency', 'Travel', 'Other'].map(function (r) { return html`<option key=${r}>${r}</option>`; })}
        </select>
      <//>
      <${Field} label="Additional note (optional)"><textarea className="input" value=${form.note} onInput=${set('note')} placeholder="Anything the teacher should know"></textarea><//>
      <button className="btn btn-primary" onClick=${function () {
        if (!form.learnerId) { toast('Please select a learner', 'err'); return; }
        var l = learnerById(s, form.learnerId);
        mutate(function (n) {
          var x = n.learners.find(function (y) { return y.id === form.learnerId; });
          if (form.date === new Date().toISOString().slice(0, 10)) { x.status = 'absent'; addEvent(n, x.id, 'absent', 'Parent report', form.reason); }
          addNotification(n, { audience: 'admin', title: 'Absence reported by parent', body: l.name + ' — ' + form.reason + ' on ' + form.date + '.', category: 'attendance', learnerId: x.id });
          addNotification(n, { audience: 'parent', guardianId: guardian.id, title: 'Absence report received', body: 'We have recorded ' + l.name + ' absence for ' + form.date + '.', category: 'attendance', learnerId: x.id });
        });
        setDone(true);
        toast('Absence reported to the school office');
      }}>Submit absence report</button>
    </div>
  </div>`;
}

function ParentEmergency() {
  var s = useStore();
  var sel = useSelectedChild();
  var guardian = sel.guardian, child = sel.child;
  return html`<div className="stack">
    <div className="card card-p stack" style=${{ gap: '10px' }}>
      <h3>School emergency contacts</h3>
      <div className="kv"><span>School office</span><span className="bold">${s.emergency.office}</span></div>
      <div className="kv"><span>Safeguarding / safety line</span><span className="bold">${s.emergency.safetyLine}</span></div>
      <div className="kv"><span>School email</span><span>${s.school.email}</span></div>
      <div className="kv"><span>Address</span><span>${s.school.address}</span></div>
    </div>
    <div className="card card-p">
      <h3 style=${{ marginBottom: '8px' }}>Emergency instructions</h3>
      <p className="sm">${s.emergency.procedure}</p>
    </div>
    <div className="card card-p">
      <h3 style=${{ marginBottom: '8px' }}>Your registered details</h3>
      <div className="kv"><span>Name</span><span>${guardian.name}</span></div>
      <div className="kv"><span>Relationship</span><span>${guardian.relationship}</span></div>
      <div className="kv"><span>Phone</span><span>${guardian.phone}</span></div>
      <div className="kv"><span>Linked learner</span><span>${child ? child.name : '—'}</span></div>
    </div>
    <div className="alert alert-amber"><${Icon} name="info" size=${16} /><div>To change the number we call in an emergency, please contact the school office directly. Changes cannot be made from this demo portal.</div></div>
  </div>`;
}

/* ---------- Landing ---------- */
function Landing() {
  var cards = [
    ['/admin/overview', 'School Administration Dashboard', 'Attendance, learners, pickup oversight, safety centre and reports.', 'chart'],
    ['/teacher/overview', 'Teacher Workspace', 'Class registers, learner records, announcements and incident reporting.', 'cap'],
    ['/gate/pickup', 'Gate & Handover Interface', 'Fast arrival check-in and authorized pickup verification at the gate.', 'shield'],
    ['/parent/home', 'Parent & Guardian Portal', 'Child status, pickup permissions, messages and home-arrival confirmation.', 'heart']
  ];
  return html`<div className="landing">
    <div className="landing-inner">
      <span className="demo-badge"><${Icon} name="info" size=${12} /> Frontend prototype · demo data only</span>
      <h1 className="mt16">Little Steps Kindergarten<br />Communication & Learner Safety System</h1>
      <p className="lede">One connected platform for learner attendance, gate handovers, authorized pickup verification, home-arrival confirmation, parent communication and safeguarding incidents. Everything you see runs entirely in your browser with realistic mock data.</p>

      <div className="role-cards">
        ${cards.map(function (c) {
          var path = c[0], title = c[1], desc = c[2], icon = c[3];
          return html`<button key=${path} className="role-card" onClick=${function () {
            var role = path.split('/')[1];
            mutate(function (n) { n.session.role = role; });
            go(path);
          }}>
            <div className="role-ico"><${Icon} name=${icon} size=${20} /><//>
            <h3>${title}</h3>
            <p>${desc}</p>
          </button>`;
        })}
      </div>

      <div className="walkthrough">
        <h3 style=${{ color: '#fff' }}>Suggested 3-minute walkthrough</h3>
        <ol>
          <li>Open the <strong>Gate & Handover Interface</strong> → <strong>Pickup Verification</strong> and search for <strong>Jabari Omondi</strong> (L-1008).</li>
          <li>Select <strong>Grace Omondi (Mother)</strong>, enter demo PIN <strong>3302</strong> and record the handover — then check the dashboard updates.</li>
          <li>Switch to the <strong>Parent Portal</strong> (Grace Omondi) and <strong>confirm home arrival</strong>.</li>
          <li>Try an unauthorized collector — pick <strong>Esther Mutua</strong> for Kito Mutua and watch the release being blocked.</li>
          <li>Open the <strong>Safety Centre</strong> and run the <strong>missing learner</strong> workflow, then resolve it.</li>
          <li>Go to <strong>School Communication</strong>, publish an announcement and see it appear in the parent portal.</li>
        </ol>
      </div>

      <div className="walkthrough" style=${{ marginTop: '16px' }}>
        <h3 style=${{ color: '#fff' }}>Important demo limitations</h3>
        <ul style=${{ margin: '10px 0 0', paddingLeft: '20px', color: '#a8bccb', fontSize: '13.5px', lineHeight: 1.9 }}>
          <li>No backend, database, authentication server, SMS gateway or payment integration.</li>
          <li>No real GPS tracking, no emergency-service calls and no identity verification.</li>
          <li>Demo data is stored in your browser localStorage and is not shared between viewers.</li>
          <li>Role switching is a demonstration feature, not secure authentication.</li>
        </ul>
      </div>

      <div style=${{ marginTop: '26px' }}>
        <button className="btn btn-primary" style=${{ background: '#0d9488', borderColor: '#0d9488' }} onClick=${function () { go('/admin/overview'); }}>
          <${Icon} name="play" size=${15} /> Enter the administrator dashboard
        </button>
      </div>
    </div>
  </div>`;
}

/* ---------- Admin shell ---------- */
function AdminShell(props) {
  var s = useStore();
  var st = useState(false);
  var open = st[0], setOpen = st[1];
  var role = props.role, page = props.page;
  var items = NAV[role] || NAV.admin;
  var stt = stats(s);
  var titles = {
    overview: ['Overview', 'Live snapshot of today attendance, handovers and safety'],
    learners: ['Learners', 'Directory of enrolled learners and their guardians'],
    classes: ['Classes', 'Class lists, teachers and staff accounts'],
    parents: ['Parents & Guardians', 'Accounts, verification and pickup permissions'],
    attendance: ['Attendance', 'Daily register and attendance states'],
    movement: ['Arrival & Departure', 'Movement events recorded at the gate'],
    pickup: ['Pickup Verification', 'Authorized collector verification and handover'],
    home: ['Home Arrival', 'Confirmations that learners reached home safely'],
    communication: ['School Communication', 'Announcements, templates and delivery history'],
    safety: ['Safety Centre', 'Incidents, missing-learner response and escalation'],
    reports: ['Reports & Analytics', 'Attendance, pickup, communication and safety reporting'],
    settings: ['Settings', 'School profile, policy, roles and demo data']
  };
  var pair = titles[page] || ['Little Steps Kindergarten', ''];
  var t = pair[0], sub = pair[1];

  return html`<div className="app">
    ${open ? html`<div className="scrim" style=${{ padding: 0, zIndex: 45, background: 'rgba(15,23,42,.4)' }} onClick=${function () { setOpen(false); }}></div>` : null}
    <aside className=${cls('sidebar', open ? 'open' : '')} aria-label="Main navigation">
      <div className="brand">
        <div className="brand-mark">LS</div>
        <div className="brand-txt"><strong>${s.school.name}</strong><span>Safety & communication</span></div>
      </div>
      <nav className="nav">
        ${items.map(function (it, i) {
          if (it.sec) return html`<div className="nav-sec" key=${'sec' + i}>${it.sec}</div>`;
          var safetyBadge = it.id === 'safety' && stt.incidents > 0 ? html`<span className="badge b-red" style=${{ marginLeft: 'auto', padding: '1px 7px' }}>${stt.incidents}</span>` : null;
          var homeBadge = it.id === 'home' && stt.awaitingHome > 0 ? html`<span className="badge b-amber" style=${{ marginLeft: 'auto', padding: '1px 7px' }}>${stt.awaitingHome}</span>` : null;
          return html`<a key=${it.id} href=${'#' + it.path} className=${page === it.id ? 'active' : ''} onClick=${function () { setOpen(false); }}>
            <${Icon} name=${it.icon} size=${17} />
            <span>${it.label}</span>
            ${safetyBadge}
            ${homeBadge}
          </a>`;
        })}
      </nav>
      <div className="side-foot">
        <div className="row" style=${{ gap: '8px', marginBottom: '6px' }}><span className="demo-badge"><${Icon} name="info" size=${11} /> Demo</span></div>
        Simulated data in your browser only. No messages, calls or tracking are real.
      </div>
    </aside>
    <div className="main">
      <${Topbar} title=${t} subtitle=${sub} onMenu=${function () { setOpen(!open); }} />
      <main className="content">${props.children}</main>
    </div>
  </div>`;
}

/* ---------- App ---------- */
function App() {
  var s = useStore();
  var toasts = useToasts();
  var path = useHashRoute();
  var info = routeInfo(path);
  var role = info.role, page = info.page;

  useEffect(function () {
    if (!role) return;
    if (state.session.role !== role) mutate(function (n) { n.session.role = role; });
  }, [role]);

  var content;
  if (!role) {
    content = html`<${Landing} />`;
  } else if (role === 'parent') {
    var parentPage;
    if (page === 'home') parentPage = html`<${ParentHome} />`;
    else if (page === 'child') parentPage = html`<${ParentChild} />`;
    else if (page === 'pickup') parentPage = html`<${ParentPickup} />`;
    else if (page === 'messages') parentPage = html`<${ParentMessages} />`;
    else if (page === 'alerts') parentPage = html`<${ParentAlerts} />`;
    else if (page === 'home-arrival') parentPage = html`<${ParentHomeArrival} />`;
    else if (page === 'absence') parentPage = html`<${ParentAbsence} />`;
    else if (page === 'emergency') parentPage = html`<${ParentEmergency} />`;
    else parentPage = html`<${Empty} icon="info" title="Page not found" message=${'The route ' + path + ' does not exist in this prototype.'} />`;
    content = html`<${ParentShell} page=${page}>${parentPage}<//>`;
  } else {
    var adminPage;
    if (page === 'overview') adminPage = html`<${PageOverview} role=${role} />`;
    else if (page === 'learners') adminPage = html`<${PageLearners} role=${role} />`;
    else if (page === 'classes') adminPage = html`<${PageClasses} />`;
    else if (page === 'attendance') adminPage = html`<${PageAttendance} role=${role} />`;
    else if (page === 'movement') adminPage = html`<${PageMovement} role=${role} />`;
    else if (page === 'pickup') adminPage = html`<${PagePickup} role=${role} />`;
    else if (page === 'home') adminPage = html`<${PageHomeArrival} />`;
    else if (page === 'parents') adminPage = html`<${PageParents} />`;
    else if (page === 'communication') adminPage = html`<${PageCommunication} />`;
    else if (page === 'safety') adminPage = html`<${PageSafety} />`;
    else if (page === 'reports') adminPage = html`<${PageReports} />`;
    else if (page === 'settings') adminPage = html`<${PageSettings} />`;
    else adminPage = html`<div className="card card-p"><${Empty} icon="info" title="Page not found" message=${'The route ' + path + ' does not exist in this prototype.'} action=${html`<button className="btn btn-primary" onClick=${function () { go('/' + role + '/overview'); }}>Back to overview</button>`} /></div>`;
    content = html`<${AdminShell} role=${role} page=${page}>${adminPage}<//>`;
  }

  return html`<${Fragment}>
    ${content}
    <div className="toasts" aria-live="polite">
      ${toasts.map(function (t) {
        var icon = t.tone === 'err' ? 'alert' : t.tone === 'warn' ? 'info' : 'check';
        return html`<div key=${t.id} className=${cls('toast', t.tone)}>
          <${Icon} name=${icon} size=${16} />
          <span>${t.msg}</span>
        </div>`;
      })}
    </div>
  <//>`;
}

try {
  createRoot(document.getElementById('root')).render(html`<${App} />`);
  window.__appMounted = true;
} catch (err) {
  window.__showFatal(err);
}
</script>
</body>
</html>
