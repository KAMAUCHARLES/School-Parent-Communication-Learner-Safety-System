<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Little Steps Kindergarten — Communication &amp; Learner Safety System</title>
<meta name="description" content="Demo prototype: kindergarten school–parent communication, attendance and learner safety system." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%230d9488'/><stop offset='1' stop-color='%230891b2'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><text x='16' y='22' font-size='17' font-family='Inter,sans-serif' font-weight='800' text-anchor='middle' fill='white'>LS</text></svg>" />
<style>
:root{
  --navy:#0a1f2c; --navy-2:#0e2a3a; --navy-3:#153c52; --navy-4:#1d4d68;
  --teal:#14b8a6; --teal-d:#0d9488; --teal-dd:#0f766e; --teal-l:#ccfbf1;
  --bg:#eef2f7; --card:#ffffff; --bd:#e2e8f0; --tx:#0f172a; --mut:#64748b;
  --green:#16a34a; --green-l:#dcfce7;
  --amber:#d97706; --amber-l:#fef3c7;
  --red:#dc2626; --red-l:#fee2e2;
  --blue:#2563eb; --blue-l:#dbeafe;
  --purple:#7c3aed; --purple-l:#ede9fe;
  --r:18px; --r-sm:12px; --r-xs:9px;
  --sh-1:0 1px 2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.08);
  --sh-2:0 4px 12px rgba(15,23,42,.08), 0 2px 4px rgba(15,23,42,.04);
  --sh-3:0 12px 32px rgba(15,23,42,.12), 0 4px 8px rgba(15,23,42,.06);
  --sh-4:0 24px 60px rgba(15,23,42,.18), 0 8px 20px rgba(15,23,42,.10);
  --glass:rgba(255,255,255,.72);
  --glass-bd:rgba(255,255,255,.55);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--tx);
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  background-image:
    radial-gradient(1200px 800px at 10% -10%, rgba(20,184,166,.10), transparent 60%),
    radial-gradient(900px 700px at 110% 10%, rgba(37,99,235,.08), transparent 55%),
    radial-gradient(700px 600px at 50% 120%, rgba(124,58,237,.06), transparent 60%);
  background-attachment:fixed;
}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.02em}
h1{font-size:22px}h2{font-size:17px}h3{font-size:15px}h4{font-size:13px}
p{margin:0}
a{color:var(--teal-dd);text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:8px}
.mut{color:var(--mut)}.sm{font-size:12.5px}.xs{font-size:11.5px}
.bold{font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.right{text-align:right}
.nowrap{white-space:nowrap}
.hr{height:1px;background:var(--bd);margin:14px 0}

/* ============ Boot / Fatal ============ */
.boot{min-height:100vh;display:grid;place-items:center;text-align:center;color:var(--mut);padding:40px 20px}
.boot-inner{max-width:420px}
.boot-spinner{width:44px;height:44px;border-radius:50%;border:3px solid var(--bd);border-top-color:var(--teal);animation:spin .8s linear infinite;margin:0 auto 18px}
.boot-title{font-size:16px;font-weight:700;color:var(--tx);margin-bottom:6px}
.boot-msg{font-size:13px}
@keyframes spin{to{transform:rotate(360deg)}}
.fatal{max-width:680px;margin:60px auto;padding:24px;border:1px solid #fecaca;background:#fef2f2;border-radius:16px;color:#7f1d1d;font-family:Inter,sans-serif}
.fatal-title{font-weight:800;font-size:16px;margin-bottom:8px}
.fatal-msg{font-size:13px;line-height:1.6;font-family:ui-monospace,Menlo,Consolas,monospace;background:rgba(0,0,0,.04);padding:10px;border-radius:8px;margin:8px 0}
.fatal-hint{font-size:13px;margin-top:14px;line-height:1.6}

/* ============ LOGIN ============ */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
.login-bg-orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;pointer-events:none;z-index:0}
.login-bg-orb.o1{width:520px;height:520px;background:radial-gradient(circle,#14b8a6,transparent 70%);top:-160px;left:-140px}
.login-bg-orb.o2{width:460px;height:460px;background:radial-gradient(circle,#7c3aed,transparent 70%);bottom:-160px;right:-140px}
.login-bg-orb.o3{width:360px;height:360px;background:radial-gradient(circle,#2563eb,transparent 70%);top:40%;left:60%}
.login-card{
  position:relative;z-index:1;width:100%;max-width:920px;
  display:grid;grid-template-columns:1.05fr .95fr;
  background:var(--glass);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--glass-bd);
  border-radius:26px;
  box-shadow:var(--sh-4);
  overflow:hidden;
}
@media (max-width:820px){.login-card{grid-template-columns:1fr}.login-left{display:none!important}}
.login-left{
  background:linear-gradient(160deg,#0a1f2c 0%,#0e2a3a 55%,#153c52 100%);
  padding:44px 38px;color:#dbeafe;position:relative;overflow:hidden;
}
.login-left::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(500px 300px at 20% 20%, rgba(20,184,166,.20), transparent 60%),
    radial-gradient(400px 300px at 90% 100%, rgba(37,99,235,.18), transparent 60%);
  pointer-events:none;
}
.login-logo{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.login-logo-mark{
  width:46px;height:46px;border-radius:14px;
  background:linear-gradient(140deg,var(--teal),#0891b2);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;
  box-shadow:0 8px 24px rgba(20,184,166,.45), inset 0 1px 0 rgba(255,255,255,.4);
  transform:perspective(200px) rotateX(6deg);
}
.login-logo-txt strong{display:block;color:#fff;font-size:15px;letter-spacing:-.01em}
.login-logo-txt span{font-size:11.5px;color:#7d97a8}
.login-headline{font-size:26px;font-weight:800;color:#fff;line-height:1.2;margin-top:38px;letter-spacing:-.03em;position:relative;z-index:1}
.login-sub{color:#a8bccb;font-size:13.5px;margin-top:12px;line-height:1.65;position:relative;z-index:1}
.login-points{margin-top:26px;position:relative;z-index:1;display:flex;flex-direction:column;gap:10px}
.login-point{display:flex;align-items:center;gap:10px;font-size:13px;color:#c7d5df}
.login-point-ico{
  width:26px;height:26px;border-radius:8px;flex:none;
  background:rgba(20,184,166,.18);color:#5eead4;
  display:grid;place-items:center;
  border:1px solid rgba(94,234,212,.2);
}
.login-right{padding:40px 38px;display:flex;flex-direction:column;gap:18px;background:rgba(255,255,255,.6)}
.login-title{font-size:22px;font-weight:800;letter-spacing:-.02em}
.login-note{color:var(--mut);font-size:13px}
.user-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:4px;max-height:340px;overflow-y:auto;padding-right:4px}
.user-tile{
  display:flex;align-items:center;gap:12px;
  padding:11px 12px;border-radius:14px;
  border:1px solid var(--bd);background:#fff;
  cursor:pointer;text-align:left;width:100%;
  box-shadow:var(--sh-1);
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
}
.user-tile:hover{transform:translateY(-2px);box-shadow:var(--sh-3);border-color:rgba(20,184,166,.5)}
.user-tile.selected{border-color:var(--teal);box-shadow:0 0 0 3px rgba(20,184,166,.18),var(--sh-2)}
.user-avatar-wrap{position:relative;flex:none}
.user-online{position:absolute;bottom:-1px;right:-1px;width:12px;height:12px;border-radius:50%;background:#22c55e;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.04)}
.user-tile-body{flex:1;min-width:0}
.user-tile-name{font-weight:700;font-size:13.5px;color:var(--tx);display:block}
.user-tile-role{font-size:11.5px;color:var(--mut);margin-top:1px}
.user-tile-arrow{color:#94a3b8;flex:none}
.login-input{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;font-size:14px;font-family:inherit;background:#fff;transition:border-color .15s,box-shadow .15s}
.login-input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(20,184,166,.14)}
.login-btn{
  width:100%;padding:13px;border-radius:12px;border:none;
  background:linear-gradient(135deg,var(--teal-d),#0891b2);
  color:#fff;font-weight:700;font-size:14px;cursor:pointer;
  box-shadow:0 8px 20px rgba(13,148,136,.35), inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .14s,box-shadow .14s;
}
.login-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 26px rgba(13,148,136,.42), inset 0 1px 0 rgba(255,255,255,.25)}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-hint{font-size:11.5px;color:var(--mut);text-align:center;line-height:1.6}
.login-error{background:#fef2f2;border:1px solid #fecaca;color:#7f1d1d;font-size:12.5px;padding:10px 12px;border-radius:10px}

/* ============ APP SHELL ============ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:256px;
  background:linear-gradient(180deg,#0a1f2c 0%,#0e2a3a 60%,#0f2c3e 100%);
  color:#c7d5df;display:flex;flex-direction:column;
  position:fixed;top:0;bottom:0;left:0;z-index:50;
  transition:transform .24s cubic-bezier(.2,.8,.2,1);
  box-shadow:4px 0 32px rgba(15,23,42,.08);
}
.sidebar::before{content:'';position:absolute;top:0;left:0;right:0;height:220px;background:radial-gradient(300px 200px at 0% 0%, rgba(20,184,166,.15), transparent 70%);pointer-events:none}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 16px;position:relative;z-index:1}
.brand-mark{
  width:38px;height:38px;border-radius:12px;
  background:linear-gradient(140deg,var(--teal),#0891b2);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none;
  box-shadow:0 6px 18px rgba(20,184,166,.45), inset 0 1px 0 rgba(255,255,255,.35);
}
.brand-txt strong{display:block;color:#fff;font-size:13.5px;line-height:1.2;font-weight:700}
.brand-txt span{font-size:11px;color:#7d97a8}
.nav{flex:1;overflow-y:auto;padding:6px 10px 20px;position:relative;z-index:1}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
.nav-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#688499;padding:16px 10px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:#c7d5df;font-size:13.5px;font-weight:500;margin-bottom:1px;transition:background .14s,color .14s}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.active{background:linear-gradient(135deg,var(--teal-dd),var(--teal-d));color:#fff;box-shadow:0 4px 14px rgba(13,148,136,.35), inset 0 1px 0 rgba(255,255,255,.18)}
.side-foot{padding:14px 12px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#7d97a8;position:relative;z-index:1}
.main{flex:1;margin-left:256px;display:flex;flex-direction:column;min-width:0}
@media (max-width:1020px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:8px 0 40px rgba(15,23,42,.35)}
  .main{margin-left:0}
}
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--glass);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--glass-bd);
  min-height:64px;display:flex;align-items:center;gap:10px;padding:10px 18px;
  box-shadow:0 1px 3px rgba(15,23,42,.04);
}
.content{padding:22px;width:100%;max-width:1440px;margin:0 auto}
@media (max-width:1020px){.content{padding:16px}}
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .16s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ============ CARDS (3D) ============ */
.card{
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:var(--r);
  box-shadow:var(--sh-2);
  transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;
}
.card:hover{transform:translateY(-1px);box-shadow:var(--sh-3)}
.card-p{padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-bottom:1px solid var(--bd)}
.card-h h3{font-size:14px}
.grid{display:grid;gap:15px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g-2-1{grid-template-columns:2fr 1fr}
@media (max-width:1100px){.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-2-1{grid-template-columns:1fr}.g-3{grid-template-columns:1fr}}
@media (max-width:720px){.g-2,.g-4{grid-template-columns:1fr}}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 14px;border-radius:11px;border:1px solid var(--bd);
  background:#fff;color:var(--tx);font-size:13px;font-weight:600;cursor:pointer;
  transition:transform .12s ease,background .14s,border-color .14s,box-shadow .14s;
  box-shadow:var(--sh-1);
}
.btn:hover{background:#f8fafc;border-color:#cbd5e1;transform:translateY(-1px);box-shadow:var(--sh-2)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{
  background:linear-gradient(135deg,var(--teal-d),#0891b2);
  border-color:transparent;color:#fff;
  box-shadow:0 4px 14px rgba(13,148,136,.32), inset 0 1px 0 rgba(255,255,255,.22);
}
.btn-primary:hover{box-shadow:0 8px 20px rgba(13,148,136,.4), inset 0 1px 0 rgba(255,255,255,.22);background:linear-gradient(135deg,var(--teal-dd),#0d7fa0)}
.btn-danger{background:linear-gradient(135deg,#dc2626,#e11d48);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(220,38,38,.3), inset 0 1px 0 rgba(255,255,255,.2)}
.btn-danger:hover{box-shadow:0 8px 20px rgba(220,38,38,.4)}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn-ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn-ghost:hover{background:#f1f5f9;box-shadow:none;transform:none}
.icon-btn{
  display:inline-grid;place-items:center;width:38px;height:38px;border-radius:11px;
  border:1px solid transparent;background:transparent;color:var(--mut);cursor:pointer;
  transition:background .14s,color .14s,transform .14s;
}
.icon-btn:hover{background:#f1f5f9;color:var(--tx);transform:translateY(-1px)}

/* ============ FIELDS ============ */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:#334155;letter-spacing:.01em}
.input,select.input,textarea.input{
  width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:11px;
  font-size:13.5px;background:#fff;color:var(--tx);font-family:inherit;
  transition:border-color .14s,box-shadow .14s;
}
.input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(20,184,166,.14)}
textarea.input{min-height:100px;resize:vertical}
.input-search{position:relative;flex:1;max-width:340px}
.input-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.input-search input{padding-left:36px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--teal-d)}

/* ============ BADGES ============ */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:999px;
  font-size:11.5px;font-weight:700;white-space:nowrap;
  border:1px solid transparent;letter-spacing:.005em;
}
.b-green{background:var(--green-l);color:#15803d}
.b-amber{background:var(--amber-l);color:#92400e}
.b-red{background:var(--red-l);color:#991b1b}
.b-blue{background:var(--blue-l);color:#1e40af}
.b-teal{background:var(--teal-l);color:var(--teal-dd)}
.b-purple{background:var(--purple-l);color:#5b21b6}
.b-muted{background:#f1f5f9;color:#475569}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

/* ============ TABLE ============ */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--mut);padding:12px 16px;border-bottom:1px solid var(--bd);
  background:#fafbfc;font-weight:700;white-space:nowrap;
}
table.tbl td{padding:12px 16px;border-bottom:1px solid #eef2f6;vertical-align:middle}
table.tbl tbody tr{transition:background .12s}
table.tbl tbody tr:hover{background:#f8fbfd}
table.tbl tbody tr.clickable{cursor:pointer}
.tbl-wrap{overflow-x:auto}

/* ============ AVATAR ============ */
.avatar{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-weight:700;color:#fff;flex:none;letter-spacing:.02em;
  box-shadow:0 2px 6px rgba(15,23,42,.12), inset 0 1px 0 rgba(255,255,255,.35);
  border:1.5px solid rgba(255,255,255,.9);
}
.avatar.lg{width:58px;height:58px;font-size:19px}
.avatar.sm{width:30px;height:30px;font-size:11.5px;border-width:1px}

/* ============ STAT CARD (3D) ============ */
.stat{
  display:flex;flex-direction:column;gap:8px;
  padding:16px 18px;background:#fff;
  border:1px solid var(--bd);border-radius:var(--r);
  box-shadow:var(--sh-2);
  position:relative;overflow:hidden;
  transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;
}
.stat::after{
  content:'';position:absolute;right:-30px;top:-30px;
  width:100px;height:100px;border-radius:50%;
  background:radial-gradient(circle,rgba(20,184,166,.08),transparent 70%);
  pointer-events:none;
}
.stat:hover{transform:translateY(-3px);box-shadow:var(--sh-3)}
.stat-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.stat-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.stat-val{font-size:26px;font-weight:800;letter-spacing:-.03em;position:relative;z-index:1}
.stat-lbl{font-size:12px;color:var(--mut);font-weight:600;position:relative;z-index:1}

/* ============ CHARTS ============ */
.chart{display:flex;align-items:flex-end;gap:8px;height:100%;padding:8px 0}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;min-width:0}
.chart-bar{
  width:100%;max-width:46px;
  border-radius:8px 8px 4px 4px;
  background:linear-gradient(180deg,var(--teal),var(--teal-d));
  transition:height .4s cubic-bezier(.2,.8,.2,1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 2px 6px rgba(13,148,136,.25);
}
.chart-val{font-size:11px;font-weight:700;color:#475569}
.chart-lbl{font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bar-line{display:flex;align-items:center;gap:10px;font-size:12.5px}
.bar-track{flex:1;height:9px;border-radius:999px;background:#eef2f6;overflow:hidden;box-shadow:inset 0 1px 2px rgba(15,23,42,.06)}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--teal-d));transition:width .4s cubic-bezier(.2,.8,.2,1)}

/* ============ TIMELINE ============ */
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:12px;padding-bottom:16px;position:relative}
.tl-item:not(:last-child)::before{content:'';position:absolute;left:12px;top:28px;bottom:0;width:2px;background:linear-gradient(180deg,#eef2f6,#e2e8f0)}
.tl-ico{
  width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;flex:none;z-index:1;
  background:#f1f5f9;color:#475569;
  box-shadow:0 0 0 3px #fff;
}
.tl-body{flex:1;min-width:0;padding-top:2px}
.tl-title{font-size:13px;font-weight:600}
.tl-meta{font-size:11.5px;color:var(--mut);margin-top:2px}

/* ============ ALERTS ============ */
.alert{display:flex;gap:12px;padding:13px 15px;border-radius:var(--r-sm);border:1px solid;font-size:13px;align-items:flex-start;box-shadow:var(--sh-1)}
.alert-red{background:linear-gradient(135deg,#fef2f2,#fee2e2);border-color:#fecaca;color:#7f1d1d}
.alert-amber{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:#fde68a;color:#78350f}
.alert-green{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border-color:#bbf7d0;color:#14532d}
.alert-blue{background:linear-gradient(135deg,#eff6ff,#dbeafe);border-color:#bfdbfe;color:#1e3a8a}
.alert strong{display:block;margin-bottom:3px;font-weight:700}

/* ============ MODAL ============ */
.modal{
  background:#fff;border-radius:20px;
  box-shadow:var(--sh-4);
  width:100%;max-width:520px;max-height:90vh;
  display:flex;flex-direction:column;overflow:hidden;
  animation:modalIn .22s cubic-bezier(.2,.8,.2,1);
}
@keyframes modalIn{from{transform:scale(.96) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal-lg{max-width:860px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bd);background:linear-gradient(180deg,#fff,#fafbfc)}
.modal-b{padding:20px;overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:15px 20px;border-top:1px solid var(--bd);background:#fafbfc}

/* ============ TOASTS ============ */
.toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:360px}
.toast{
  background:#0f172a;color:#fff;padding:12px 15px;border-radius:13px;font-size:13px;
  box-shadow:var(--sh-4);display:flex;gap:10px;align-items:flex-start;
  animation:toastIn .24s cubic-bezier(.2,.8,.2,1);
  border:1px solid rgba(255,255,255,.08);
}
.toast.ok{background:linear-gradient(135deg,#0f766e,#0d9488)}
.toast.warn{background:linear-gradient(135deg,#b45309,#d97706)}
.toast.err{background:linear-gradient(135deg,#991b1b,#dc2626)}
@keyframes toastIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}

/* ============ EMPTY ============ */
.empty{padding:42px 20px;text-align:center;color:var(--mut)}
.empty-ico{width:48px;height:48px;border-radius:50%;background:#f1f5f9;display:grid;place-items:center;margin:0 auto 12px;color:#94a3b8}

/* ============ TABS ============ */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);overflow-x:auto;padding:0 8px}
.tab{padding:11px 14px;border:none;background:none;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .14s,border-color .14s;font-family:inherit}
.tab.active{color:var(--teal-dd);border-bottom-color:var(--teal-dd)}
.tab:hover{color:var(--tx)}

/* ============ DRAWER ============ */
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);
  background:#fff;z-index:70;
  box-shadow:var(--sh-4);
  display:flex;flex-direction:column;
  animation:drawerIn .26s cubic-bezier(.2,.8,.2,1);
}
@keyframes drawerIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bd);background:linear-gradient(180deg,#fff,#fafbfc)}
.drawer-b{flex:1;overflow-y:auto;padding:20px}

/* ============ KEY-VALUE ============ */
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed #eef2f6;font-size:13px}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--mut)}

/* ============ PIN / QR ============ */
.pin-box{display:flex;gap:8px}
.pin-input{
  width:100%;padding:14px;border:2px solid var(--bd);border-radius:13px;
  font-size:24px;letter-spacing:.4em;text-align:center;font-weight:800;font-family:inherit;
  transition:border-color .14s,box-shadow .14s;
}
.pin-input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 5px rgba(20,184,166,.14)}
.qr-box{
  width:160px;height:160px;border-radius:14px;border:2px dashed #cbd5e1;
  display:grid;place-items:center;
  background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 8px,#f1f5f9 8px,#f1f5f9 16px);
  color:#64748b;margin:0 auto;
}

/* ============ BADGES ============ */
.demo-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,#fef3c7,#fde68a);
  color:#92400e;border:1px solid #fbbf24;
  padding:4px 10px;border-radius:999px;
  font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  box-shadow:0 2px 6px rgba(251,191,36,.25);
}
.role-pill{
  display:inline-flex;align-items:center;gap:8px;
  background:#fff;border:1px solid var(--bd);
  border-radius:999px;padding:5px 8px 5px 12px;
  font-size:12px;font-weight:700;cursor:pointer;
  box-shadow:var(--sh-1);transition:box-shadow .14s,transform .14s;
  color:var(--tx);font-family:inherit;
}
.role-pill:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}

/* ============ LANDING ============ */
.landing{
  min-height:100vh;
  background:radial-gradient(1200px 700px at 15% -10%,#0f3b4d 0%,var(--navy) 55%,#061621 100%);
  color:#e2e8f0;padding:44px 22px 70px;
  position:relative;overflow:hidden;
}
.landing::before{
  content:'';position:absolute;top:-200px;right:-160px;
  width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle,rgba(20,184,166,.14),transparent 70%);
  pointer-events:none;
}
.landing::after{
  content:'';position:absolute;bottom:-240px;left:-160px;
  width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle,rgba(124,58,237,.12),transparent 70%);
  pointer-events:none;
}
.landing-inner{max-width:1120px;margin:0 auto;position:relative;z-index:1}
.landing h1{font-size:clamp(28px,4.4vw,44px);color:#fff;line-height:1.15;letter-spacing:-.03em;font-weight:800}
.landing .lede{color:#a8bccb;font-size:15.5px;max-width:680px;margin-top:16px;line-height:1.7}
.role-cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:30px}
.role-card{
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.13);
  border-radius:20px;padding:22px;cursor:pointer;text-align:left;color:#e2e8f0;
  transition:transform .2s cubic-bezier(.2,.8,.2,1),background .2s,border-color .2s,box-shadow .2s;
  box-shadow:0 6px 20px rgba(0,0,0,.14);
  font-family:inherit;
}
.role-card:hover{
  background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.06));
  border-color:rgba(94,234,212,.45);
  transform:translateY(-4px);
  box-shadow:0 18px 40px rgba(0,0,0,.24), 0 0 0 1px rgba(94,234,212,.1);
}
.role-card h3{color:#fff;font-size:16px;margin-bottom:6px}
.role-card p{font-size:12.5px;color:#9db2c1;line-height:1.55}
.role-ico{
  width:44px;height:44px;border-radius:13px;
  display:grid;place-items:center;margin-bottom:14px;
  background:linear-gradient(140deg,rgba(20,184,166,.28),rgba(8,145,178,.24));
  color:#5eead4;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15);
}
.walkthrough{
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;padding:24px;margin-top:24px;
  box-shadow:0 6px 20px rgba(0,0,0,.12);
}
.walkthrough ol{margin:12px 0 0;padding-left:22px;color:#a8bccb;font-size:13.5px;line-height:2}
.walkthrough ol strong{color:#fff}
.walkthrough h3{color:#fff;font-size:15px}

/* ============ PARENT PORTAL ============ */
.parent-shell{min-height:100vh;background:#f6f9fb;display:flex;flex-direction:column;background-image:radial-gradient(700px 400px at 100% 0%,rgba(20,184,166,.08),transparent 60%)}
.parent-top{
  background:linear-gradient(160deg,#153c52,#0e2a3a 60%,#0a1f2c);color:#fff;
  padding:16px 18px 22px;border-radius:0 0 26px 26px;
  box-shadow:0 8px 24px rgba(15,23,42,.14);
  position:relative;overflow:hidden;
}
.parent-top::before{content:'';position:absolute;top:-80px;right:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(20,184,166,.18),transparent 70%);pointer-events:none}
.parent-body{flex:1;padding:16px;max-width:840px;width:100%;margin:0 auto;padding-bottom:100px}
.parent-nav{
  position:fixed;bottom:0;left:0;right:0;background:var(--glass);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--glass-bd);
  display:flex;justify-content:space-around;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  z-index:50;box-shadow:0 -4px 20px rgba(15,23,42,.06);
}
.parent-nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;font-size:10.5px;color:var(--mut);
  cursor:pointer;padding:6px 2px;border-radius:11px;font-weight:600;position:relative;
  transition:color .14s,background .14s;font-family:inherit;
}
.parent-nav button.active{color:var(--teal-dd);background:rgba(20,184,166,.08)}
.child-card{
  background:#fff;border:1px solid var(--bd);border-radius:20px;padding:20px;
  box-shadow:var(--sh-2);
  background-image:radial-gradient(400px 200px at 100% 0%,rgba(20,184,166,.06),transparent 60%);
}
.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.quick-btn{
  background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px;
  display:flex;flex-direction:column;gap:10px;align-items:flex-start;cursor:pointer;text-align:left;
  font-size:13px;font-weight:700;color:var(--tx);box-shadow:var(--sh-1);
  transition:transform .18s cubic-bezier(.2,.8,.2,1),border-color .16s,box-shadow .18s;
  font-family:inherit;
}
.quick-btn:hover{transform:translateY(-3px);border-color:var(--teal);box-shadow:var(--sh-3)}
.quick-ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.notice-card{
  background:#fff;border:1px solid var(--bd);border-left:4px solid var(--teal);
  border-radius:14px;padding:14px 16px;box-shadow:var(--sh-1);
  transition:transform .16s,box-shadow .16s;
}
.notice-card:hover{transform:translateX(2px);box-shadow:var(--sh-2)}
.notice-card.high{border-left-color:var(--red)}
.notice-card.med{border-left-color:var(--amber)}
.hide-sm{display:initial}
@media (max-width:720px){.hide-sm{display:none}}
.hide-lg{display:none}
@media (max-width:1020px){.hide-lg{display:inline-grid!important}}

function Icon(props) {
  const size = props.size || 18;
  const strokeWidth = props.strokeWidth || 1.8;
  const name = props.name || 'info';
  const els = ICONS[name] || ICONS.info;
  const children = [];
  for (let i = 0; i < els.length; i++) {
    const tag = els[i][0];
    const attrs = Object.assign({ key: 'p' + i }, els[i][1]);
    children.push(e(tag, attrs));
  }
  return e('svg', {
    xmlns:'http://www.w3.org/2000/svg', width:size, height:size, viewBox:'0 0 24 24',
    fill:'none', stroke:'currentColor', strokeWidth:strokeWidth,
    strokeLinecap:'round', strokeLinejoin:'round', 'aria-hidden':'true'
  }, children);
}

const AV_COLORS = ['#0d9488','#2563eb','#7c3aed','#db2777','#ea580c','#0891b2','#65a30d','#9333ea','#c2410c','#0369a1'];
const avColor = (s) => { let sum = 0; for (let i = 0; i < s.length; i++) sum += s.charCodeAt(i); return AV_COLORS[Math.abs(sum) % AV_COLORS.length]; };
const fmtTime = (iso) => iso ? new Date(iso).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }) : '—';
const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString([], { day:'2-digit', month:'short', year:'numeric' }) : '—';
const fmtDT = (iso) => iso ? fmtDate(iso) + ' · ' + fmtTime(iso) : '—';
const isToday = (iso) => iso && new Date(iso).toDateString() === new Date().toDateString();
const relTime = (iso) => {
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  if (m < 1440) return Math.floor(m / 60) + ' hr ago';
  return Math.floor(m / 1440) + ' d ago';
};
function exportCSV(filename, rows) {
  const csv = rows.map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* ============================================================
   Store
   ============================================================ */
const STORAGE_KEY = 'little-steps-demo-v2';
const clone = (o) => JSON.parse(JSON.stringify(o));
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return seed();
    const parsed = JSON.parse(raw);
    if (!parsed || parsed.version !== 2 || !parsed.learners || !parsed.users) return seed();
    return parsed;
  } catch (e) { return seed(); }
}
function saveState(s) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) {} }
let state = loadState();
const listeners = new Set();
function setState(updater) {
  state = typeof updater === 'function' ? updater(state) : Object.assign({}, state, updater);
  saveState(state);
  listeners.forEach(l => l());
}
function mutate(fn) { setState(s => { const n = clone(s); fn(n); return n; }); }
function useStore() {
  const [, force] = useState(0);
  useEffect(() => {
    const l = () => force(x => x + 1);
    listeners.add(l);
    return () => listeners.delete(l);
  }, []);
  return state;
}
function resetDemo() {
  localStorage.removeItem(STORAGE_KEY);
  state = seed();
  saveState(state);
  listeners.forEach(l => l());
}
let toastList = [];
const toastListeners = new Set();
function toast(msg, tone) {
  const id = uid('T');
  toastList = toastList.concat([{ id, msg, tone: tone || 'ok' }]);
  toastListeners.forEach(l => l());
  setTimeout(() => {
    toastList = toastList.filter(t => t.id !== id);
    toastListeners.forEach(l => l());
  }, 3600);
}
function useToasts() {
  const [, f] = useState(0);
  useEffect(() => {
    const l = () => f(x => x + 1);
    toastListeners.add(l);
    return () => toastListeners.delete(l);
  }, []);
  return toastList;
}

const isPresent = (l) => ['present','late','released','home_confirmed'].includes(l.status);
const awaitingHome = (l) => l.status === 'released' && !l.homeConfirmedAt;
const learnerById = (s, id) => s.learners.find(l => l.id === id);
const classById = (s, id) => s.classes.find(c => c.id === id);
const collectorsFor = (s, learnerId) => s.collectors.filter(c => c.learnerId === learnerId);
const guardianById = (s, id) => s.guardians.find(g => g.id === id);
function effectiveCollectorStatus(c) {
  if (c.status === 'revoked' || c.status === 'pending') return c.status;
  if (c.expiresAt && new Date(c.expiresAt).getTime() < Date.now()) return 'expired';
  return 'approved';
}
const isCollectorUsable = (c) => effectiveCollectorStatus(c) === 'approved';
function stats(s) {
  const active = s.learners.filter(l => !l.archived);
  return {
    total:active.length,
    present:active.filter(isPresent).length,
    notArrived:active.filter(l => l.status === 'not_arrived').length,
    atSchool:active.filter(l => l.status === 'present' || l.status === 'late').length,
    collected:active.filter(l => l.status === 'released' || l.status === 'home_confirmed').length,
    pendingVerification:s.collectors.filter(c => c.status === 'pending').length,
    awaitingHome:active.filter(awaitingHome).length,
    incidents:s.incidents.filter(i => i.status !== 'resolved').length,
    absent:active.filter(l => l.status === 'absent').length,
    late:active.filter(l => l.status === 'late').length
  };
}
const staffName = (s, id) => (s.staff.find(x => x.id === id) || { name:'Staff' }).name;

function addEvent(s, learnerId, type, staff, detail) {
  s.events.unshift({ id:uid('EV'), learnerId, type, ts:new Date().toISOString(), staff, detail: detail || '' });
}
function addNotification(s, n) {
  s.notifications.unshift(Object.assign({ id:uid('NT'), ts:new Date().toISOString(), read:false, guardianId:null, learnerId:null }, n));
}

function actionRecordArrival(learnerId, staffId) {
  const s = state;
  const l = learnerById(s, learnerId);
  if (!l) return;
  const late = new Date().toTimeString().slice(0, 5) > s.school.lateCutoff;
  const staff = staffName(s, staffId);
  mutate(n => {
    const le = n.learners.find(x => x.id === learnerId);
    le.status = late ? 'late' : 'present';
    le.arrivalAt = new Date().toISOString();
    addEvent(n, learnerId, 'arrival', staff, late ? 'Recorded as late arrival' : 'Checked in at main gate');
    addNotification(n, { audience:'admin', title:(late ? 'Late arrival':'Arrival') + ' recorded', body:le.name + (late ? ' arrived late':' arrived') + ' at ' + fmtTime(le.arrivalAt) + '.', category:'attendance', learnerId });
    addNotification(n, { audience:'teacher', title:le.name + ' checked in', body:'Recorded by ' + staff + '.', category:'attendance', learnerId });
    le.guardianIds.forEach(gid => addNotification(n, { audience:'parent', guardianId:gid, title:le.name + ' arrived at school', body:le.name + ' was checked in at ' + fmtTime(le.arrivalAt) + '.', category:'arrival', learnerId }));
  });
  toast('Arrival recorded for ' + l.name + (late ? ' (late)' : ''));
}

function actionRecordDeparture(learnerId, collectorId, staffId) {
  const s = state;
  const c = s.collectors.find(x => x.id === collectorId);
  const le = learnerById(s, learnerId);
  if (!c || !le) return;
  if (!isCollectorUsable(c)) { toast('Blocked: collector is not authorized', 'err'); return; }
  const staff = staffName(s, staffId);
  mutate(n => {
    const l2 = n.learners.find(x => x.id === learnerId);
    l2.status = 'released'; l2.departureAt = new Date().toISOString(); l2.collectorId = collectorId; l2.homeConfirmedAt = null;
    addEvent(n, learnerId, 'departure', staff, 'Released to ' + c.name + ' (' + c.relationship + ')');
    addNotification(n, { audience:'admin', title:'Learner released', body:l2.name + ' released to ' + c.name + ' (' + c.relationship + ') at ' + fmtTime(l2.departureAt) + '.', category:'pickup', learnerId });
    addNotification(n, { audience:'gate', title:'Handover recorded', body:l2.name + ' to ' + c.name + '.', category:'pickup', learnerId });
    l2.guardianIds.forEach(gid => addNotification(n, { audience:'parent', guardianId:gid, title:l2.name + ' has been collected', body:l2.name + ' was released to ' + c.name + ' (' + c.relationship + ') at ' + fmtTime(l2.departureAt) + '. Please confirm home arrival.', category:'pickup', learnerId }));
  });
  toast('Handover recorded — ' + le.name + ' released to ' + c.name);
}

function actionConfirmHome(learnerId, guardianId, method) {
  method = method || 'Parent confirmation';
  mutate(n => {
    const le = n.learners.find(x => x.id === learnerId);
    le.homeConfirmedAt = new Date().toISOString();
    le.status = 'home_confirmed';
    addEvent(n, learnerId, 'home_arrival', method, method === 'Parent confirmation' ? 'Confirmed by authorized guardian' : 'Confirmed via simulated school transport workflow');
    addNotification(n, { audience:'admin', title:'Home arrival confirmed', body:le.name + ' confirmed home at ' + fmtTime(le.homeConfirmedAt) + '.', category:'home', learnerId });
    addNotification(n, { audience:'teacher', title:'Home arrival confirmed', body:le.name + ' is safely home.', category:'home', learnerId });
    if (guardianId) addNotification(n, { audience:'parent', guardianId, title:'Home arrival confirmed', body:'Thank you — ' + le.name + '’s home arrival was confirmed at ' + fmtTime(le.homeConfirmedAt) + '.', category:'home', learnerId });
  });
  toast('Home arrival confirmed');
}

function handleLogin(userId, password) {
  const s = state;
  const user = s.users.find(u => u.id === userId);
  if (!user) return { ok:false, error:'Account not found.' };
  if (user.password !== password) return { ok:false, error:'Incorrect password. Try the demo password shown below the field.' };
  mutate(n => {
    n.session.userId = user.id;
    n.session.role = user.role;
    n.session.staffId = user.staffId;
    n.session.guardianId = user.guardianId;
  });
  return { ok:true, user };
}
function handleLogout() {
  mutate(n => {
    n.session.userId = null;
    n.session.role = null;
    n.session.staffId = null;
    n.session.guardianId = null;
  });
}

  const list = s.notifications.filter(n => n.audience === role && (role !== 'parent' || n.guardianId === gid));
  const unread = list.filter(n => !n.read).length;

  const button = e('button', {
    className:'icon-btn',
    onClick:() => setOpen(true),
    'aria-label':'Notifications',
    style:{ position:'relative' }
  },
    e(Icon, { name:'bell' }),
    unread > 0 ? e('span', {
      style:{ position:'absolute', top:'3px', right:'3px', background:'var(--red)', color:'#fff', fontSize:'9.5px', fontWeight:700, borderRadius:'999px', minWidth:'16px', height:'16px', display:'grid', placeItems:'center', padding:'0 3px', boxShadow:'0 2px 6px rgba(220,38,38,.4)' }
    }, unread) : null
  );

  if (!open) return button;

  const footer = e(Fragment, null,
    e('button', { className:'btn', onClick:() => setOpen(false) }, 'Close'),
    e('button', {
      className:'btn btn-primary',
      disabled:!unread,
      onClick:() => {
        mutate(n => n.notifications.forEach(x => { if (x.audience === role && (role !== 'parent' || x.guardianId === gid)) x.read = true; }));
        toast('All notifications marked as read');
      }
    }, 'Mark all as read')
  );

  const body = list.length === 0
    ? e(Empty, { icon:'bell', title:'No notifications', message:'You are all caught up.' })
    : e('div', { className:'stack', style:{ gap:'9px' } },
        list.slice(0, 30).map(n => e('div', {
          key:n.id,
          style:{ border:'1px solid var(--bd)', borderRadius:'13px', padding:'13px', background:n.read ? '#fff' : 'linear-gradient(135deg,#f0fdfa,#e6fffa)', boxShadow:'var(--sh-1)' }
        },
          e('div', { className:'between' },
            e('div', { className:'row', style:{ gap:'8px' } },
              n.read ? null : e('span', { className:'dot', style:{ color:'var(--teal)' } }),
              e('span', { className:'bold sm' }, n.title)
            ),
            e('span', { className:'xs mut nowrap' }, relTime(n.ts))
          ),
          e('div', { className:'sm mut mt8' }, n.body),
          e('div', { className:'mt8 row', style:{ gap:'8px' } },
            e(Badge, { tone:'muted' }, n.category),
            n.read ? null : e('button', {
              className:'btn btn-sm btn-ghost',
              onClick:() => mutate(st => { const t = st.notifications.find(x => x.id === n.id); if (t) t.read = true; })
            }, 'Mark as read')
          )
        ))
      );

  const modal = e(Modal, { title:'Notification centre', onClose:() => setOpen(false), wide:true, footer },
    e('div', { className:'alert alert-blue', style:{ marginBottom:'14px' } },
      e(Icon, { name:'info', size:17 }),
      e('div', null, e('strong', null, 'Simulated notification engine'), 'These notifications are generated in your browser only. No SMS, email, WhatsApp or push messages are actually sent.')
    ),
    body
  );

  return e(Fragment, null, button, modal);
}

  const todayChart = s.history.map(h => ({ label:new Date(h.date).toLocaleDateString([], { weekday:'short' }), value:h.present }))
    .concat([{ label:'Today', value:st.present, color:'var(--teal-dd)' }]);

  const arrivals = s.events.filter(ev => ev.type === 'arrival' && isToday(ev.ts));
  const departures = s.events.filter(ev => ev.type === 'departure' && isToday(ev.ts));

  const depByHour = hours.map(h => ({ label:h, value:0 }));
  const idx = hr => hr <= 7 ? 0 : hr === 8 ? 1 : hr === 9 ? 2 : hr === 10 ? 3 : hr === 13 ? 4 : hr === 14 ? 5 : 6;
  arrivals.forEach(ev => arrByHour[idx(new Date(ev.ts).getHours())].value++);
  departures.forEach(ev => depByHour[idx(new Date(ev.ts).getHours())].value++);

function AddLearnerModal(props) {
  const s = useStore();
  const [form, setForm] = useState({ name:'', classId:s.classes[0].id, guardianName:'', relationship:'Mother', phone:'', notes:'' });
  const [err, setErr] = useState({});
  const set = k => ev => { const next = Object.assign({}, form); next[k] = ev.target.value; setForm(next); };
  function submit(ev) {
    ev.preventDefault();
    const errs = {};
    if (form.name.trim().length < 3) errs.name = 'Please enter the learner’s full name.';
    if (!form.guardianName.trim()) errs.guardianName = 'A parent or guardian contact is required.';
    if (!/^[+\d][\d\s-]{6,}$/.test(form.phone.trim())) errs.phone = 'Enter a fictional demo phone number.';
    setErr(errs);
    if (Object.keys(errs).length) return;
    const newId = 'L-' + (1000 + s.learners.length + 1);
    const gId = 'G-' + String(s.guardians.length + 1).padStart(2, '0');
    mutate(n => {
      n.guardians.push({ id:gId, name:form.guardianName, relationship:form.relationship, phone:form.phone, email:'demo@example.com', learnerIds:[newId], verified:false, notify:{ arrival:true, departure:true, home:true, announcements:true, safety:true } });
      n.learners.push({ id:newId, name:form.name, classId:form.classId, guardianIds:[gId], dob:'2021-01-01', gender:'—', status:'not_arrived', arrivalAt:null, departureAt:null, collectorId:null, homeConfirmedAt:null, archived:false, notes:form.notes, allergies:'None recorded' });
      n.collectors.push({ id:uid('K'), learnerId:newId, name:form.guardianName, relationship:form.relationship, type:'Parent', status:'approved', demoPin:String(1000 + Math.floor(Math.random() * 8999)), expiresAt:null, phone:form.phone });
    });
    toast(form.name + ' registered as ' + newId);
    props.onClose();
  }
  const footer = e(Fragment, null,
    e('button', { className:'btn', onClick:props.onClose }, 'Cancel'),
    e('button', { className:'btn btn-primary', form:'addLearner', type:'submit' }, 'Register learner')
  );
  const body = e('form', { id:'addLearner', onSubmit:submit, className:'stack', style:{ gap:'13px' } },
    e('div', { className:'alert alert-amber' }, e(Icon, { name:'alert', size:16 }), e('div', null, 'Use fictional details only. This prototype stores data in your browser.')),
    e(Field, { label:'Learner full name', hint:err.name }, e('input', { className:'input', value:form.name, onInput:set('name'), placeholder:'e.g. Amani Wekesa' })),
    e(Field, { label:'Class' },
      e('select', { className:'input', value:form.classId, onChange:set('classId') },
        s.classes.map(c => e('option', { key:c.id, value:c.id }, c.name + ' · ' + c.level))
      )
    ),
    e('div', { className:'grid g-2' },
      e(Field, { label:'Parent / guardian name', hint:err.guardianName }, e('input', { className:'input', value:form.guardianName, onInput:set('guardianName'), placeholder:'e.g. Grace Omondi' })),
      e(Field, { label:'Relationship' },
        e('select', { className:'input', value:form.relationship, onChange:set('relationship') },
          ['Mother','Father','Guardian','Grandparent','Nanny','Other'].map(r => e('option', { key:r, value:r }, r))
        )
      )
    ),
    e(Field, { label:'Contact phone (fictional)', hint:err.phone }, e('input', { className:'input', value:form.phone, onInput:set('phone'), placeholder:'+254 700 000 123' })),
    e(Field, { label:'Notes (optional)' }, e('textarea', { className:'input', value:form.notes, onInput:set('notes'), placeholder:'Allergies, medical notes or safeguarding remarks' }))
  );
  return e(Modal, { title:'Register a new learner', onClose:props.onClose, footer }, body);

/* ============================================================
   Page: Pickup verification
   ============================================================ */
function PagePickup(props) {
  const s = useStore();
  const [step, setStep] = useState(1);
  const [q, setQ] = useState('');
  const [learnerId, setLearnerId] = useState(null);
  const [collectorId, setCollectorId] = useState(null);
  const [pin, setPin] = useState('');
  const [result, setResult] = useState(null);
  const [staffId, setStaffId] = useState(s.session.staffId || s.staff[6].id);
  const [confirmOpen, setConfirmOpen] = useState(false);

  const candidates = s.learners.filter(l =>
    !l.archived && (l.name.toLowerCase().includes(q.toLowerCase()) || l.id.toLowerCase().includes(q.toLowerCase()))
  );
  const learner = learnerId ? learnerById(s, learnerId) : null;
  const collectors = learner ? collectorsFor(s, learner.id) : [];
  const collector = collectorId ? s.collectors.find(c => c.id === collectorId) : null;

  function reset() { setStep(1); setLearnerId(null); setCollectorId(null); setPin(''); setResult(null); setQ(''); }
  function verify() {
    if (!collector) return;
    const stt = effectiveCollectorStatus(collector);
    if (stt !== 'approved') {
      const reason = stt === 'pending' ? 'This collector’s authorization is still pending school approval.' : stt === 'revoked' ? 'This collector’s permission has been revoked by the school.' : 'This collector’s temporary authorization has expired.';
      setResult({ ok:false, reason });
      return;
    }
    if (s.settings.requirePin && pin.trim() !== collector.demoPin) {
      setResult({ ok:false, reason:'The demo PIN entered does not match the PIN on record for this collector.' });
      return;
    }
    setResult({ ok:true });
  }
  function simulateQr() {
    if (!collector) return;
    if (effectiveCollectorStatus(collector) !== 'approved') { verify(); return; }
    setPin(collector.demoPin);
    setResult({ ok:true });
    toast('Demo QR scan simulated — this is not real identity verification', 'warn');
  }
  function recordHandover() { actionRecordDeparture(learner.id, collector.id, staffId); reset(); }

  const stepChips = [1,2,3].map(n => e('span', { key:n, className:'badge ' + (step >= n ? 'b-teal' : 'b-muted') }, 'Step ' + n));

  const step1 = e('div', null,
    e(Field, { label:'1 · Search for the learner' },
      e('input', { className:'input', autoFocus:true, placeholder:'Type a learner name or learner ID…', value:q, onInput:ev => setQ(ev.target.value), 'aria-label':'Search learner for pickup' })
    ),
    e('div', { className:'mt16 stack', style:{ gap:'8px', maxHeight:'360px', overflowY:'auto' } },
      candidates.length === 0
        ? e(Empty, { icon:'search', title:'No learners found', message:'Check the spelling or search using the learner ID.' })
        : candidates.map(l => e('button', {
            key:l.id,
            className:'btn',
            style:{ justifyContent:'flex-start', width:'100%', padding:'11px' },
            onClick:() => { setLearnerId(l.id); setStep(2); }
          },
            e(Avatar, { name:l.name, size:'sm' }),
            e('span', { style:{ flex:1, textAlign:'left' } },
              e('span', { className:'bold', style:{ display:'block' } }, l.name),
              e('span', { className:'xs mut' }, l.id + ' · ' + (classById(s, l.classId) || {}).name)
            ),
            e(StatusBadge, { status:l.status }),
            e(Icon, { name:'chevR', size:15 })
          ))
    )
  );

  const step2 = e('div', null,
    e(Field, { label:'2 · Select the person collecting this learner' },
      e('div', { className:'stack mt8', style:{ gap:'8px' } },
        collectors.map(k => {
          const stt = effectiveCollectorStatus(k);
          return e('button', {
            key:k.id,
            className:'btn',
            style:{ justifyContent:'flex-start', width:'100%', padding:'11px', borderColor: stt === 'approved' ? 'var(--bd)' : '#fecaca' },
            onClick:() => { setCollectorId(k.id); setStep(3); setResult(null); setPin(''); }
          },
            e(Avatar, { name:k.name, size:'sm' }),
            e('span', { style:{ flex:1, textAlign:'left' } },
              e('span', { className:'bold', style:{ display:'block' } }, k.name),
              e('span', { className:'xs mut' }, k.relationship + ' · ' + k.type + (k.expiresAt ? ' · expires ' + fmtDate(k.expiresAt) : ''))
            ),
            e(CollectorBadge, { c:k }),
            e(Icon, { name:'chevR', size:15 })
          );
        })
      )
    )
  );

  const learnerHeader = learner ? e('div', { className:'card card-p', style:{ background:'linear-gradient(135deg,#f8fafc,#eef2f7)' } },
    e('div', { className:'row' },
      e(Avatar, { name:learner.name, size:'lg' }),
      e('div', { style:{ flex:1 } },
        e('h3', null, learner.name),

function InviteParentModal(props) {
  const s = useStore();
  const [form, setForm] = useState({ name:'', relationship:'Mother', phone:'', email:'', learnerId:s.learners[0].id });
  const [err, setErr] = useState({});
  const set = k => ev => { const next = Object.assign({}, form); next[k] = ev.target.value; setForm(next); };
  function submit(ev) {
    ev.preventDefault();
    const errs = {};
    if (form.name.trim().length < 3) errs.name = 'Enter the guardian’s full name.';
    if (!/^[+\d][\d\s-]{6,}$/.test(form.phone)) errs.phone = 'Enter a fictional phone number.';
    if (!/^\S+@\S+\.\S+$/.test(form.email)) errs.email = 'Enter a valid demo email address.';
    setErr(errs);
    if (Object.keys(errs).length) return;
    mutate(n => {
      const newGId = 'G-' + String(n.guardians.length + 1).padStart(2, '0');
      n.guardians.push({ id:newGId, name:form.name, relationship:form.relationship, phone:form.phone, email:form.email, learnerIds:[form.learnerId], verified:false, notify:{ arrival:true, departure:true, home:true, announcements:true, safety:true } });
      const l = n.learners.find(x => x.id === form.learnerId);
      if (l) l.guardianIds.push(newGId);
    });
    toast('Invitation prepared for ' + form.name + ' (simulated — no email is sent)', 'warn');
    props.onClose();
  }
  const footer = e(Fragment, null,
    e('button', { className:'btn', onClick:props.onClose }, 'Cancel'),
    e('button', { className:'btn btn-primary', type:'submit', form:'inviteForm' }, 'Send invitation')
  );
  const body = e('form', { id:'inviteForm', onSubmit:submit, className:'stack', style:{ gap:'13px' } },
    e('div', { className:'alert alert-amber' }, e(Icon, { name:'info', size:16 }), e('div', null, 'No real email or SMS is sent. This records a demo invitation in your browser only.')),
    e(Field, { label:'Guardian name', hint:err.name }, e('input', { className:'input', value:form.name, onInput:set('name'), placeholder:'e.g. Grace Omondi' })),
    e('div', { className:'grid g-2' },
      e(Field, { label:'Relationship' },
        e('select', { className:'input', value:form.relationship, onChange:set('relationship') },
          ['Mother','Father','Guardian','Grandparent','Nanny','Other'].map(r => e('option', { key:r, value:r }, r))
        )
      ),
      e(Field, { label:'Linked learner' },
        e('select', { className:'input', value:form.learnerId, onChange:set('learnerId') },
          s.learners.filter(l => !l.archived).map(l => e('option', { key:l.id, value:l.id }, l.name))
        )
      )
    ),
    e(Field, { label:'Phone', hint:err.phone }, e('input', { className:'input', value:form.phone, onInput:set('phone'), placeholder:'+254 700 000 123' })),
    e(Field, { label:'Email', hint:err.email }, e('input', { className:'input', value:form.email, onInput:set('email'), placeholder:'parent@example.com' }))
  );
  return e(Modal, { title:'Invite a parent or guardian', onClose:props.onClose, footer }, body);
}

    const snap = { subject:form.subject, body:form.body, audience:form.audience, priority:form.priority };
    mutate(n => {
      n.announcements.unshift({ id, subject:snap.subject, body:snap.body, audience:snap.audience, priority:snap.priority, status, createdAt:new Date().toISOString(), publishAt: status === 'published' ? new Date().toISOString() : null, readBy:[], ackBy:[] });
      if (status === 'published') {
        const targets = snap.audience === 'All school families' ? n.guardians : n.guardians.filter(g =>
          g.learnerIds.some(lid => {
            const l = n.learners.find(x => x.id === lid);
            if (!l) return false;
            const c = n.classes.find(cc => cc.id === l.classId);
            return c && snap.audience.includes(c.name);
          })
        );
        targets.forEach(g => addNotification(n, { audience:'parent', guardianId:g.id, title:snap.subject, body: snap.body.length > 130 ? snap.body.slice(0, 130) + '…' : snap.body, category:'announcement' }));
      }
    });
    toast(status === 'published' ? 'Announcement published to ' + snap.audience : 'Draft saved');
    setForm({ subject:'', body:'', audience:'All school families', priority:'normal' });
  }

  const compose = e('div', { className:'card-p stack', style:{ gap:'14px' } },
    e('div', { className:'grid g-3' },
      e(Field, { label:'Audience' },
        e('select', { className:'input', value:form.audience, onChange:ev => setForm(Object.assign({}, form, { audience:ev.target.value })) },
          e('option', null, 'All school families'),
          s.classes.map(c => e('option', { key:c.id }, c.name + ' · ' + c.level))
        )
      ),
      e(Field, { label:'Priority' },
        e('select', { className:'input', value:form.priority, onChange:ev => setForm(Object.assign({}, form, { priority:ev.target.value })) },
          e('option', { value:'normal' }, 'Normal'),
          e('option', { value:'high' }, 'High — important'),
          e('option', { value:'urgent' }, 'Urgent — safety')
        )
      ),
      e(Field, { label:'Start from a template' },
        e('select', { className:'input', onChange:ev => {
          const t = TEMPLATES.find(x => x.id === ev.target.value);
          if (t) setForm(Object.assign({}, form, { subject:t.subject, body:t.body }));
        }},
          e('option', { value:'' }, 'Choose a template…'),
          TEMPLATES.map(t => e('option', { key:t.id, value:t.id }, t.name))
        )
      )
    ),
    e(Field, { label:'Subject' }, e('input', { className:'input', value:form.subject, onInput:ev => setForm(Object.assign({}, form, { subject:ev.target.value })), placeholder:'Announcement subject' })),
    e(Field, { label:'Message body' }, e('textarea', { className:'input', style:{ minHeight:'170px' }, value:form.body, onInput:ev => setForm(Object.assign({}, form, { body:ev.target.value })), placeholder:'Write your message to families…' })),
    e('div', { className:'row wrap', style:{ gap:'9px' } },
      e('button', { className:'btn btn-primary', onClick:() => publish('published') }, e(Icon, { name:'send', size:15 }), ' Publish now'),
      e('button', { className:'btn', onClick:() => publish('draft') }, 'Save as draft'),
      e('button', { className:'btn', onClick:() => { publish('scheduled'); toast('Message scheduled (simulated — no message will actually be sent)', 'warn'); } }, e(Icon, { name:'clock', size:15 }), ' Schedule (simulated)'),
      e('div', { className:'spacer' }),
      e('span', { className:'xs mut' }, 'Simulated delivery only')
    )
  );

  const published = e('div', { className:'tbl-wrap' },
    e('table', { className:'tbl' },
      e('thead', null, e('tr', null,
        e('th', null, 'Subject'), e('th', null, 'Audience'), e('th', null, 'Priority'),
        e('th', null, 'Status'), e('th', null, 'Read'), e('th', null, 'Acknowledged'), e('th', null, 'Created')
      )),
      e('tbody', null,
        s.announcements.map(a => e('tr', { key:a.id },
          e('td', { className:'bold' }, a.subject),
          e('td', { className:'mut' }, a.audience),
          e('td', null, e(Badge, { tone:a.priority === 'urgent' ? 'red' : a.priority === 'high' ? 'amber' : 'muted' }, a.priority)),
          e('td', null, e(Badge, { tone:a.status === 'published' ? 'green' : a.status === 'scheduled' ? 'blue' : 'muted', dot:true }, a.status)),
          e('td', null, a.readBy.length),
          e('td', null, a.ackBy.length),
          e('td', { className:'mut xs' }, fmtDT(a.createdAt))
        ))
      )
    )
  );

  const historyItems = s.notifications.filter(n => n.category === 'announcement');
  const history = e('div', { className:'card-p stack', style:{ gap:'8px', maxHeight:'520px', overflowY:'auto' } },
    historyItems.length === 0
      ? e(Empty, { icon:'megaphone', title:'No announcements delivered yet' })
      : historyItems.map(n => {
          const g = guardianById(s, n.guardianId);
          return e('div', { key:n.id, style:{ border:'1px solid var(--bd)', borderRadius:'13px', padding:'12px 14px', background:'#fff', boxShadow:'var(--sh-1)' } },
            e('div', { className:'between' },
              e('span', { className:'bold sm' }, n.title),
              e(Badge, { tone:n.read ? 'green' : 'amber' }, n.read ? 'Read' : 'Unread')
            ),
            e('div', { className:'xs mut mt8' }, 'To ' + (g ? g.name : 'guardian') + ' · ' + relTime(n.ts) + ' · simulated delivery')

  return e('div', { className:'stack' },
    e('div', { className:'alert alert-blue' },
      e(Icon, { name:'info', size:18 }),
      e('div', null, e('strong', null, 'Delivery is simulated'), 'Published announcements appear immediately in the demo parent portal and notification centre. No SMS, WhatsApp, email or push messages are actually sent.')
    ),

        )
      ),
      tab === 'compose' ? compose : null,
      tab === 'published' ? published : null,
      tab === 'history' ? history : null
    )
  );
}

function ReportIncidentModal(props) {

  const set = k => ev => { const next = Object.assign({}, form); next[k] = ev.target.value; setForm(next); };
  const footer = e(Fragment, null,
    e('button', { className:'btn', onClick:props.onClose }, 'Cancel'),
    e('button', { className:'btn btn-primary', form:'incForm', type:'submit' }, 'Create incident')
  );

      const l = n.learners.find(x => x.id === form.learnerId);
      addNotification(n, { audience:'admin', title:'New safety incident', body:form.type + ' involving ' + (l ? l.name : '') + '.', category:'safety', learnerId:form.learnerId });
    });
    toast('Incident created and logged');

      e('select', { className:'input', value:form.learnerId, onChange:set('learnerId') },
        s.learners.filter(l => !l.archived).map(l => e('option', { key:l.id, value:l.id }, l.name + ' — ' + l.id))

          ['low','medium','high'].map(t => e('option', { key:t, value:t }, t))

    ),
    e(Field, { label:'What happened?' }, e('textarea', { className:'input', value:form.summary, onInput:set('summary'), placeholder:'Describe what happened, who was involved and what action was taken.' }))
  );
  return e(Modal, { title:'Report a safety incident', onClose:props.onClose, footer }, body);

function PageReports() {
  const s = useStore();
  const [type, setType] = useState('attendance');
  const [clsF, setClsF] = useState('all');
  const active = s.learners.filter(l => !l.archived).filter(l => clsF === 'all' || l.classId === clsF);

  const rows = useMemo(() => {
    switch (type) {
      case 'attendance': return active.map(l => [l.id, l.name, (classById(s, l.classId) || {}).name, LEARNER_STATUS[l.status].label, fmtTime(l.arrivalAt), fmtTime(l.departureAt)]);
      case 'late': return active.filter(l => l.status === 'late').map(l => [l.id, l.name, (classById(s, l.classId) || {}).name, fmtTime(l.arrivalAt), 'After ' + s.school.lateCutoff]);
      case 'absences': return active.filter(l => l.status === 'absent').map(l => [l.id, l.name, (classById(s, l.classId) || {}).name, 'Absent today', (guardianById(s, l.guardianIds[0]) || {}).name]);
      case 'early': return s.events.filter(ev => ev.type === 'departure' && new Date(ev.ts).getHours() < 15).map(ev => {
        const l = learnerById(s, ev.learnerId) || {};
        return [l.id, l.name, fmtTime(ev.ts), ev.staff];
      });
      case 'pickup': return s.events.filter(ev => ev.type === 'departure').map(ev => {
        const l = learnerById(s, ev.learnerId) || {};
        const k = s.collectors.find(x => x.id === l.collectorId) || {};
        return [l.id, l.name, k.name || '—', k.relationship || '—', fmtTime(ev.ts), ev.staff];
      });
      case 'unauthorised': return s.incidents.filter(i => i.type === 'Unauthorized pickup attempt').map(i => [i.ref, (learnerById(s, i.learnerId) || {}).name, fmtDT(i.openedAt), i.status, i.assignedTo]);
      case 'home': return active.filter(l => l.departureAt).map(l => [l.id, l.name, fmtTime(l.departureAt), l.homeConfirmedAt ? fmtTime(l.homeConfirmedAt) : 'Not confirmed', l.homeConfirmedAt ? 'Confirmed' : 'Awaiting']);

      default: return [];
    }
  }, [type, clsF, s]);

  const headers = REPORT_HEADERS[type];
  const trend = s.history.map(h => ({ label:new Date(h.date).toLocaleDateString([], { weekday:'short' }), value:h.present }))

  return e('div', { className:'stack' },

          e('div', { className:'hr' }),

          e('div', { className:'kv' }, e('span', null, 'Absences'), e('span', { className:'bold' }, stats(s).absent)),

    onClick:() => setOpen(false)
  }) : null;

  const navItems = items.map((it, i) => {
    if (it.sec) return e('div', { key:'sec' + i, className:'nav-sec' }, it.sec);
    return e('a', {
      key:it.id,
      href:'#' + it.path,
      className:page === it.id ? 'active' : '',
      onClick:() => setOpen(false)
    },
      e(Icon, { name:it.icon, size:17 }),
      e('span', null, it.label),
      it.id === 'safety' && stt.incidents > 0 ? e('span', { className:'badge b-red', style:{ marginLeft:'auto', padding:'1px 7px' } }, stt.incidents) : null,
      it.id === 'home' && stt.awaitingHome > 0 ? e('span', { className:'badge b-amber', style:{ marginLeft:'auto', padding:'1px 7px' } }, stt.awaitingHome) : null
    );
  });

  const sidebar = e('aside', { className:'sidebar' + (open ? ' open' : ''), 'aria-label':'Main navigation' },
    e('div', { className:'brand' },
      e('div', { className:'brand-mark' }, 'LS'),
      e('div', { className:'brand-txt' }, e('strong', null, s.school.name), e('span', null, 'Safety & communication'))
    ),
    e('nav', { className:'nav' }, navItems),
    e('div', { className:'side-foot' },
      e('div', { className:'row', style:{ gap:'8px', marginBottom:'6px' } }, e('span', { className:'demo-badge' }, e(Icon, { name:'info', size:11 }), ' Demo')),
      'Simulated data in your browser only. No messages, calls or tracking are real.'
    )
  );

  return e('div', { className:'app' },
    scrim,
    sidebar,
    e('div', { className:'main' },
      e(Topbar, { title:t, subtitle:sub, onMenu:() => setOpen(!open) }),
      e('main', { className:'content' }, props.children)
    )
  );
}

/* ============================================================
   App
   ============================================================ */
function App() {
  const s = useStore();
  const toasts = useToasts();
  const path = useHashRoute();
  const { role, page } = routeInfo(path);

  useEffect(() => {
    if (!role) return;
    if (state.session.role !== role) {
      // Only allow navigation to a role that matches the signed-in user
      if (state.session.role && state.session.role !== role) {
        go('/' + state.session.role + (state.session.role === 'parent' ? '/home' : '/overview'));
      } else if (!state.session.role) {
        mutate(n => { n.session.role = role; });
      }
    }
  }, [role]);

  let content;
  if (!s.session.userId) {
    content = e(LoginPage);
  } else if (role !== s.session.role) {
    // Signed-in user navigating to a route for a different role — redirect
    const target = '/' + s.session.role + (s.session.role === 'parent' ? '/home' : '/overview');
    if (path !== target) go(target);
    content = e('div', { className:'boot' }, e('div', { className:'boot-inner' }, e('div', { className:'boot-spinner' }), e('div', { className:'boot-title' }, 'Redirecting…')));
  } else if (role === 'parent') {
    let parentPage;
    if (page === 'home') parentPage = e(ParentHome);
    else if (page === 'child') parentPage = e(ParentChild);
    else if (page === 'pickup') parentPage = e(ParentPickup);
    else if (page === 'messages') parentPage = e(ParentMessages);
    else if (page === 'alerts') parentPage = e(ParentAlerts);
    else if (page === 'home-arrival') parentPage = e(ParentHomeArrival);
    else if (page === 'absence') parentPage = e(ParentAbsence);
    else if (page === 'emergency') parentPage = e(ParentEmergency);
    else parentPage = e(Empty, { icon:'info', title:'Page not found', message:'The route ' + path + ' does not exist in this prototype.' });
    content = e(ParentShell, { page }, parentPage);
  } else {
    let adminPage;
    if (page === 'overview') adminPage = e(PageOverview, { role });
    else if (page === 'learners') adminPage = e(PageLearners, { role });
    else if (page === 'classes') adminPage = e(PageClasses);
    else if (page === 'attendance') adminPage = e(PageAttendance, { role });
    else if (page === 'movement') adminPage = e(PageMovement, { role });
    else if (page === 'pickup') adminPage = e(PagePickup, { role });
    else if (page === 'home') adminPage = e(PageHomeArrival);
    else if (page === 'parents') adminPage = e(PageParents);
    else if (page === 'communication') adminPage = e(PageCommunication);
    else if (page === 'safety') adminPage = e(PageSafety);
    else if (page === 'reports') adminPage = e(PageReports);
    else if (page === 'settings') adminPage = e(PageSettings);
    else adminPage = e('div', { className:'card card-p' }, e(Empty, {
      icon:'info', title:'Page not found',
      message:'The route ' + path + ' does not exist in this prototype.',
      action:e('button', { className:'btn btn-primary', onClick:() => go('/' + role + '/overview') }, 'Back to overview')
    }));
    content = e(AdminShell, { role, page }, adminPage);
  }

  return e(Fragment, null,
    content,
    e('div', { className:'toasts', 'aria-live':'polite' },
      toasts.map(t => e('div', { key:t.id, className:cls('toast', t.tone) },
        e(Icon, { name:t.tone === 'err' ? 'alert' : t.tone === 'warn' ? 'info' : 'check', size:16 }),
        e('span', null, t.msg)
      ))
    )
  );
}

try {
  createRoot(document.getElementById('root')).render(e(App));
  window.__appMounted = true;
} catch (err) {
  window.__showFatal(err);
}
</script>
</body>
</html>
