<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Little Steps Kindergarten — Communication &amp; Learner Safety System</title>
<meta name="description" content="Demo prototype: kindergarten school–parent communication, attendance and learner safety system." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --navy:#0e2a3a; --navy2:#153c52;
  --teal:#0d9488; --teal-d:#0f766e; --teal-l:#ccfbf1;
  --bg:#f5f7f9; --card:#fff; --bd:#e4e9ef; --tx:#0f172a; --mut:#64748b;
  --green:#15803d; --green-l:#dcfce7;
  --amber:#b45309; --amber-l:#fef3c7;
  --red:#b91c1c; --red-l:#fee2e2;
  --blue:#1d4ed8; --blue-l:#dbeafe;
  --purple:#6d28d9; --purple-l:#ede9fe;
  --r:14px; --r-sm:9px;
  --sh:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.08);
  --sh-lg:0 10px 30px rgba(16,24,40,.14);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:17px}h3{font-size:15px}h4{font-size:13px}
p{margin:0}
a{color:var(--teal-d);text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
.mut{color:var(--mut)}.sm{font-size:12.5px}.xs{font-size:11.5px}
.bold{font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.right{text-align:right}
.nowrap{white-space:nowrap}
.hr{height:1px;background:var(--bd);margin:14px 0}
.app{display:flex;min-height:100vh}
.sidebar{width:248px;background:var(--navy);color:#c7d5df;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:50;transition:transform .22s ease}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(140deg,var(--teal),#0891b2);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:none}
.brand-txt strong{display:block;color:#fff;font-size:13.5px;line-height:1.2}
.brand-txt span{font-size:11px;color:#7d97a8}
.nav{flex:1;overflow-y:auto;padding:6px 10px 20px}
.nav-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#688499;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:#c7d5df;font-size:13.5px;font-weight:500;margin-bottom:1px}
.nav a:hover{background:var(--navy2);color:#fff}
.nav a.active{background:var(--teal-d);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.side-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7d97a8}
.main{flex:1;margin-left:248px;display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--bd);min-height:62px;display:flex;align-items:center;gap:10px;padding:8px 16px}
.content{padding:20px;width:100%;max-width:1440px;margin:0 auto}
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
@media (max-width:1020px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}.main{margin-left:0}.content{padding:14px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.card-p{padding:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--bd)}
.card-h h3{font-size:14px}
.grid{display:grid;gap:14px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
.g-2-1{grid-template-columns:2fr 1fr}
@media (max-width:1100px){.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-2-1{grid-template-columns:1fr}.g-3{grid-template-columns:1fr}}
@media (max-width:720px){.g-2,.g-4{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 13px;border-radius:9px;border:1px solid var(--bd);background:#fff;color:var(--tx);font-size:13px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:#f8fafc;border-color:#cbd5e1}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--teal-d);border-color:var(--teal-d);color:#fff}
.btn-primary:hover{background:#0b5f59;border-color:#0b5f59}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-danger:hover{background:#991b1b;border-color:#991b1b}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:#f1f5f9}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--mut);cursor:pointer}
.icon-btn:hover{background:#f1f5f9;color:var(--tx)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:#334155}
.input,select.input,textarea.input{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:9px;font-size:13.5px;background:#fff;color:var(--tx);font-family:inherit}
.input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,148,136,.14)}
textarea.input{min-height:96px;resize:vertical}
.input-search{position:relative;flex:1;max-width:340px}
.input-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mut)}
.input-search input{padding-left:34px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2.5px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.b-green{background:var(--green-l);color:var(--green)}
.b-amber{background:var(--amber-l);color:var(--amber)}
.b-red{background:var(--red-l);color:var(--red)}
.b-blue{background:var(--blue-l);color:var(--blue)}
.b-teal{background:var(--teal-l);color:var(--teal-d)}
.b-purple{background:var(--purple-l);color:var(--purple)}
.b-muted{background:#f1f5f9;color:#475569}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:10px 14px;border-bottom:1px solid var(--bd);background:#fafbfc;font-weight:600;white-space:nowrap}
table.tbl td{padding:11px 14px;border-bottom:1px solid #eef2f6;vertical-align:middle}
table.tbl tbody tr:hover{background:#fafcfd}
table.tbl tbody tr.clickable{cursor:pointer}
.tbl-wrap{overflow-x:auto}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:#fff;flex:none;letter-spacing:.02em}
.avatar.lg{width:56px;height:56px;font-size:18px}
.avatar.sm{width:28px;height:28px;font-size:11px}
.stat{display:flex;flex-direction:column;gap:6px;padding:14px 16px;background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.stat-top{display:flex;align-items:center;justify-content:space-between}
.stat-ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.stat-val{font-size:24px;font-weight:700;letter-spacing:-.02em}
.stat-lbl{font-size:12px;color:var(--mut);font-weight:500}
.chart{display:flex;align-items:flex-end;gap:8px;height:100%;padding:6px 0}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;min-width:0}
.chart-bar{width:100%;max-width:46px;border-radius:7px 7px 3px 3px;background:var(--teal);transition:height .3s}
.chart-val{font-size:11px;font-weight:600;color:#475569}
.chart-lbl{font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bar-line{display:flex;align-items:center;gap:10px;font-size:12.5px}
.bar-track{flex:1;height:8px;border-radius:999px;background:#eef2f6;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--teal)}
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:11px;padding-bottom:14px;position:relative}
.tl-item:not(:last-child)::before{content:'';position:absolute;left:11px;top:26px;bottom:0;width:2px;background:#eef2f6}
.tl-ico{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;z-index:1;background:#f1f5f9;color:#475569}
.tl-body{flex:1;min-width:0;padding-top:1px}
.tl-title{font-size:13px;font-weight:500}
.tl-meta{font-size:11.5px;color:var(--mut);margin-top:1px}
.alert{display:flex;gap:11px;padding:12px 13px;border-radius:var(--r-sm);border:1px solid;font-size:13px;align-items:flex-start}
.alert-red{background:#fef2f2;border-color:#fecaca;color:#7f1d1d}
.alert-amber{background:#fffbeb;border-color:#fde68a;color:#78350f}
.alert-green{background:#f0fdf4;border-color:#bbf7d0;color:#14532d}
.alert-blue{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a}
.alert strong{display:block;margin-bottom:2px}
.modal{background:#fff;border-radius:16px;box-shadow:var(--sh-lg);width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal-lg{max-width:840px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--bd)}
.modal-b{padding:18px;overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:9px;padding:14px 18px;border-top:1px solid var(--bd);background:#fafbfc}
.toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:340px}
.toast{background:#0f172a;color:#fff;padding:11px 14px;border-radius:11px;font-size:13px;box-shadow:var(--sh-lg);display:flex;gap:9px;align-items:flex-start}
.toast.ok{background:#0f766e}.toast.warn{background:#b45309}.toast.err{background:#b91c1c}
.empty{padding:38px 18px;text-align:center;color:var(--mut)}
.empty-ico{width:44px;height:44px;border-radius:50%;background:#f1f5f9;display:grid;place-items:center;margin:0 auto 10px;color:#94a3b8}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);overflow-x:auto}
.tab{padding:9px 13px;border:none;background:none;font-size:13px;font-weight:500;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--teal-d);border-bottom-color:var(--teal-d)}
.tab:hover{color:var(--tx)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:70;box-shadow:var(--sh-lg);display:flex;flex-direction:column}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--bd)}
.drawer-b{flex:1;overflow-y:auto;padding:18px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px dashed #eef2f6;font-size:13px}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--mut)}
.pin-box{display:flex;gap:8px}
.pin-input{width:100%;padding:13px;border:2px solid var(--bd);border-radius:11px;font-size:22px;letter-spacing:.4em;text-align:center;font-weight:700;font-family:inherit}
.pin-input:focus{outline:none;border-color:var(--teal)}
.qr-box{width:150px;height:150px;border-radius:12px;border:2px dashed #cbd5e1;display:grid;place-items:center;background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 8px,#f1f5f9 8px,#f1f5f9 16px);color:#64748b;margin:0 auto}
.demo-badge{display:inline-flex;align-items:center;gap:6px;background:#fef3c7;color:#92400e;border:1px solid #fde68a;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.role-pill{display:inline-flex;align-items:center;gap:7px;background:#f1f5f9;border:1px solid var(--bd);border-radius:999px;padding:4px 6px 4px 11px;font-size:12px;font-weight:600}
.landing{min-height:100vh;background:radial-gradient(1100px 520px at 12% -10%,#0f3b4d 0%,var(--navy) 55%,#0a1f2c 100%);color:#e2e8f0;padding:38px 20px 60px}
.landing-inner{max-width:1120px;margin:0 auto}
.landing h1{font-size:clamp(26px,4.4vw,42px);color:#fff;line-height:1.15;letter-spacing:-.025em}
.landing .lede{color:#a8bccb;font-size:15.5px;max-width:660px;margin-top:14px}
.role-cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));margin-top:26px}
.role-card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.13);border-radius:16px;padding:18px;cursor:pointer;text-align:left;color:#e2e8f0;transition:transform .16s,background .16s,border-color .16s}
.role-card:hover{background:rgba(255,255,255,.1);border-color:rgba(45,212,191,.5);transform:translateY(-2px)}
.role-card h3{color:#fff;font-size:15.5px;margin-bottom:6px}
.role-card p{font-size:12.5px;color:#9db2c1;line-height:1.5}
.role-ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;margin-bottom:12px;background:rgba(13,148,136,.22);color:#5eead4}
.walkthrough{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;margin-top:22px}
.walkthrough ol{margin:10px 0 0;padding-left:20px;color:#a8bccb;font-size:13.5px;line-height:1.9}
.walkthrough ol strong{color:#fff}
.parent-shell{min-height:100vh;background:#f6f9fb;display:flex;flex-direction:column}
.parent-top{background:linear-gradient(150deg,var(--navy2),var(--navy));color:#fff;padding:14px 16px 18px;border-radius:0 0 22px 22px}
.parent-body{flex:1;padding:16px;max-width:820px;width:100%;margin:0 auto;padding-bottom:96px}
.parent-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:50}
.parent-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;font-size:10.5px;color:var(--mut);cursor:pointer;padding:5px 2px;border-radius:9px;font-weight:500;position:relative}
.parent-nav button.active{color:var(--teal-d)}
.child-card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px}
.quick-btn{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;cursor:pointer;text-align:left;font-size:13px;font-weight:600;color:var(--tx);box-shadow:var(--sh);transition:transform .15s,border-color .15s}
.quick-btn:hover{transform:translateY(-2px);border-color:var(--teal)}
.quick-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.notice-card{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--teal);border-radius:12px;padding:13px 15px}
.notice-card.high{border-left-color:var(--red)}
.notice-card.med{border-left-color:var(--amber)}
.hide-sm{display:initial}
@media (max-width:720px){.hide-sm{display:none}}
</style>
</head>

function fmtDate(iso) { return iso ? new Date(iso).toLocaleDateString([], { day: '2-digit', month: 'short', year: 'numeric' }) : '—'; }
function fmtDT(iso) { return iso ? fmtDate(iso) + ' · ' + fmtTime(iso) : '—'; }

  var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);

  if (m < 1440) return Math.floor(m / 60) + ' hr ago';
  return Math.floor(m / 1440) + ' d ago';
}

function exportCSV(filename, rows) {
  var csv = rows.map(function (r) {

  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');

}

/* ---------- Store ---------- */
const STORAGE_KEY = 'little-steps-demo-v1';
function clone(o) { return JSON.parse(JSON.stringify(o)); }

function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return seed();
    var parsed = JSON.parse(raw);
    if (!parsed || parsed.version !== 1 || !parsed.learners) return seed();
    return parsed;
  } catch (e) { return seed(); }
}
function saveState(s) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) {} }

let state = loadState();
const listeners = new Set();
function setState(updater) {
  state = typeof updater === 'function' ? updater(state) : Object.assign({}, state, updater);
  saveState(state);
  listeners.forEach(function (l) { l(); });
}
function mutate(fn) { setState(function (s) { var n = clone(s); fn(n); return n; }); }
function useStore() {
  const [, force] = useState(0);
  useEffect(function () {
    function l() { force(function (x) { return x + 1; }); }
    listeners.add(l);
    return function () { listeners.delete(l); };
  }, []);
  return state;
}
function resetDemo() { localStorage.removeItem(STORAGE_KEY); state = seed(); saveState(state); listeners.forEach(function (l) { l(); }); }

let toastList = [];
const toastListeners = new Set();
function toast(msg, tone) {
  var id = uid('T');
  toastList = toastList.concat([{ id: id, msg: msg, tone: tone || 'ok' }]);
  toastListeners.forEach(function (l) { l(); });
  setTimeout(function () {
    toastList = toastList.filter(function (t) { return t.id !== id; });
    toastListeners.forEach(function (l) { l(); });
  }, 3600);
}
function useToasts() {
  const [, f] = useState(0);
  useEffect(function () {
    function l() { f(function (x) { return x + 1; }); }
    toastListeners.add(l);
    return function () { toastListeners.delete(l); };
  }, []);
  return toastList;
}

/* ---------- Derived ---------- */
function isPresent(l) { return ['present', 'late', 'released', 'home_confirmed'].indexOf(l.status) >= 0; }
function awaitingHome(l) { return l.status === 'released' && !l.homeConfirmedAt; }
function learnerById(s, id) { return s.learners.find(function (l) { return l.id === id; }); }
function classById(s, id) { return s.classes.find(function (c) { return c.id === id; }); }
function collectorsFor(s, learnerId) { return s.collectors.filter(function (c) { return c.learnerId === learnerId; }); }
function guardianById(s, id) { return s.guardians.find(function (g) { return g.id === id; }); }
function effectiveCollectorStatus(c) {
  if (c.status === 'revoked' || c.status === 'pending') return c.status;
  if (c.expiresAt && new Date(c.expiresAt).getTime() < Date.now()) return 'expired';
  return 'approved';
}
function isCollectorUsable(c) { return effectiveCollectorStatus(c) === 'approved'; }
function stats(s) {
  var active = s.learners.filter(function (l) { return !l.archived; });
  return {
    total: active.length,
    present: active.filter(isPresent).length,
    notArrived: active.filter(function (l) { return l.status === 'not_arrived'; }).length,
    atSchool: active.filter(function (l) { return l.status === 'present' || l.status === 'late'; }).length,
    collected: active.filter(function (l) { return l.status === 'released' || l.status === 'home_confirmed'; }).length,
    pendingVerification: s.collectors.filter(function (c) { return c.status === 'pending'; }).length,
    awaitingHome: active.filter(awaitingHome).length,
    incidents: s.incidents.filter(function (i) { return i.status !== 'resolved'; }).length,
    absent: active.filter(function (l) { return l.status === 'absent'; }).length,
    late: active.filter(function (l) { return l.status === 'late'; }).length
  };
}
function staffName(s, id) { var f = s.staff.find(function (x) { return x.id === id; }); return f ? f.name : 'Staff'; }

function addEvent(s, learnerId, type, staff, detail) {
  s.events.unshift({ id: uid('EV'), learnerId: learnerId, type: type, ts: new Date().toISOString(), staff: staff, detail: detail || '' });
}
function addNotification(s, n) {
  s.notifications.unshift(Object.assign({ id: uid('NT'), ts: new Date().toISOString(), read: false, guardianId: null, learnerId: null }, n));
}

function actionRecordArrival(learnerId, staffId) {
  var s = state; var l = learnerById(s, learnerId); if (!l) return;
  var late = new Date().toTimeString().slice(0, 5) > s.school.lateCutoff;
  var staff = staffName(s, staffId);
  mutate(function (n) {
    var le = n.learners.find(function (x) { return x.id === learnerId; });
    le.status = late ? 'late' : 'present';
    le.arrivalAt = new Date().toISOString();
    addEvent(n, learnerId, 'arrival', staff, late ? 'Recorded as late arrival' : 'Checked in at main gate');
    addNotification(n, { audience: 'admin', title: (late ? 'Late arrival' : 'Arrival') + ' recorded', body: le.name + (late ? ' arrived late' : ' arrived') + ' at ' + fmtTime(le.arrivalAt) + '.', category: 'attendance', learnerId: learnerId });
    addNotification(n, { audience: 'teacher', title: le.name + ' checked in', body: 'Recorded by ' + staff + '.', category: 'attendance', learnerId: learnerId });
    le.guardianIds.forEach(function (gid) {
      addNotification(n, { audience: 'parent', guardianId: gid, title: le.name + ' arrived at school', body: le.name + ' was checked in at ' + fmtTime(le.arrivalAt) + '.', category: 'arrival', learnerId: learnerId });
    });
  });
  toast('Arrival recorded for ' + l.name + (late ? ' (late)' : ''));
}

function actionRecordDeparture(learnerId, collectorId, staffId) {
  var s = state;
  var c = s.collectors.find(function (x) { return x.id === collectorId; });
  var le = learnerById(s, learnerId);
  if (!c || !le) return;
  if (!isCollectorUsable(c)) { toast('Blocked: collector is not authorized', 'err'); return; }
  var staff = staffName(s, staffId);
  mutate(function (n) {
    var l2 = n.learners.find(function (x) { return x.id === learnerId; });
    l2.status = 'released'; l2.departureAt = new Date().toISOString(); l2.collectorId = collectorId; l2.homeConfirmedAt = null;
    addEvent(n, learnerId, 'departure', staff, 'Released to ' + c.name + ' (' + c.relationship + ')');
    addNotification(n, { audience: 'admin', title: 'Learner released', body: l2.name + ' released to ' + c.name + ' (' + c.relationship + ') at ' + fmtTime(l2.departureAt) + '.', category: 'pickup', learnerId: learnerId });
    addNotification(n, { audience: 'gate', title: 'Handover recorded', body: l2.name + ' to ' + c.name + '.', category: 'pickup', learnerId: learnerId });
    l2.guardianIds.forEach(function (gid) {
      addNotification(n, { audience: 'parent', guardianId: gid, title: l2.name + ' has been collected', body: l2.name + ' was released to ' + c.name + ' (' + c.relationship + ') at ' + fmtTime(l2.departureAt) + '. Please confirm home arrival.', category: 'pickup', learnerId: learnerId });
    });
  });
  toast('Handover recorded — ' + le.name + ' released to ' + c.name);
}

function actionConfirmHome(learnerId, guardianId, method) {
  method = method || 'Parent confirmation';
  mutate(function (n) {
    var le = n.learners.find(function (x) { return x.id === learnerId; });
    le.homeConfirmedAt = new Date().toISOString();
    le.status = 'home_confirmed';
    addEvent(n, learnerId, 'home_arrival', method, method === 'Parent confirmation' ? 'Confirmed by authorized guardian' : 'Confirmed via simulated school transport workflow');
    addNotification(n, { audience: 'admin', title: 'Home arrival confirmed', body: le.name + ' confirmed home at ' + fmtTime(le.homeConfirmedAt) + '.', category: 'home', learnerId: learnerId });
    addNotification(n, { audience: 'teacher', title: 'Home arrival confirmed', body: le.name + ' is safely home.', category: 'home', learnerId: learnerId });
    if (guardianId) addNotification(n, { audience: 'parent', guardianId: guardianId, title: 'Home arrival confirmed', body: 'Thank you — ' + le.name + ' home arrival was confirmed at ' + fmtTime(le.homeConfirmedAt) + '.', category: 'home', learnerId: learnerId });
  });
  toast('Home arrival confirmed');
}

          if (x.audience === role && (role !== 'parent' || x.guardianId === gid)) x.read = true;
        });
      });
      toast('All notifications marked as read');
    }}>Mark all as read</button>`;

  var emptyBlock = html`<${Empty} icon="bell" title="No notifications" message="You are all caught up." />`;
  var listBlock = html`<div className="stack" style=${{ gap: '9px' }}>
    ${list.slice(0, 30).map(function (n) {
      var cardStyle = { border: '1px solid var(--bd)', borderRadius: '11px', padding: '12px', background: n.read ? '#fff' : '#f0fdfa' };
      var markRead = function () { mutate(function (st) { var t = st.notifications.find(function (x) { return x.id === n.id; }); if (t) t.read = true; }); };
      var dotEl = n.read ? null : html`<span className="dot" style=${{ color: 'var(--teal)' }}></span>`;
      var readBtn = n.read ? null : html`<button className="btn btn-sm btn-ghost" onClick=${markRead}>Mark as read</button>`;
      return html`<div key=${n.id} style=${cardStyle}>
        <div className="between">
          <div className="row" style=${{ gap: '8px' }}>${dotEl}<span className="bold sm">${n.title}</span></div>
          <span className="xs mut nowrap">${relTime(n.ts)}</span>
        </div>
        <div className="sm mut mt8">${n.body}</div>
        <div className="mt8 row" style=${{ gap: '8px' }}>
          <${Badge} tone="muted">${n.category}<//>
          ${readBtn}
        </div>
      </div>`;
    })}
  </div>`;

  return html`<${Fragment}>
    <button className="icon-btn" onClick=${function () { setOpen(true); }} aria-label="Notifications" style=${{ position: 'relative' }}>
      <${Icon} name="bell" />
      ${unread > 0 ? html`<span style=${badgeStyle}>${unread}</span>` : null}
    <//>
    ${open ? html`<${Modal} title="Notification centre" onClose=${function () { setOpen(false); }} wide=${true} footer=${footer}>
      <div className="alert alert-blue" style=${alertBlueStyle}>
        <${Icon} name="info" size=${17} />
        <div><strong>Simulated notification engine</strong>These notifications are generated in your browser only. No SMS, email, WhatsApp or push messages are actually sent.</div>
      </div>
      ${list.length === 0 ? emptyBlock : listBlock}
    <//>` : null}
  <//>`;
}

/* ---------- Page: Overview ---------- */
function PageOverview(props) {
  var s = useStore();
  var st1 = useState(null);
  var drawer = st1[0], setDrawer = st1[1];
  var st2 = useState(null);
  var quick = st2[0], setQuick = st2[1];
  var role = props.role;
  var st = stats(s);
  var active = s.learners.filter(function (l) { return !l.archived; });

  var todayChart = s.history.map(function (h) {
    return { label: new Date(h.date).toLocaleDateString([], { weekday: 'short' }), value: h.present };
  }).concat([{ label: 'Today', value: st.present, color: 'var(--teal-d)' }]);

  var arrivals = s.events.filter(function (e) { return e.type === 'arrival' && isToday(e.ts); });
  var departures = s.events.filter(function (e) { return e.type === 'departure' && isToday(e.ts); });
  var hours = ['7a', '8a', '9a', '10a', '1p', '2p', '3p'];
  var arrByHour = hours.map(function (h) { return { label: h, value: 0 }; });
  var depByHour = hours.map(function (h) { return { label: h, value: 0 }; });
  function idx(hr) { return hr <= 7 ? 0 : hr === 8 ? 1 : hr === 9 ? 2 : hr === 10 ? 3 : hr === 13 ? 4 : hr === 14 ? 5 : 6; }
  arrivals.forEach(function (e) { arrByHour[idx(new Date(e.ts).getHours())].value++; });
  departures.forEach(function (e) { depByHour[idx(new Date(e.ts).getHours())].value++; });

  var recentEvents = s.events.slice(0, 8);
  var recentPickups = s.events.filter(function (e) { return e.type === 'departure'; }).slice(0, 5);
  var attention = active.filter(function (l) { return l.status === 'not_arrived' || awaitingHome(l) || l.status === 'late'; });
  var openIncidents = s.incidents.filter(function (i) { return i.status !== 'resolved'; });
  var eventIcon = { arrival: 'login', departure: 'logout', home_arrival: 'houseCheck', absent: 'x' };
  var eventText = { arrival: 'Arrived at school', departure: 'Released to collector', home_arrival: 'Home arrival confirmed', absent: 'Marked absent' };

  var incidentsBanner = openIncidents.length > 0 ? html`<div className="alert alert-red">
    <${Icon} name="alert" size=${18} />

      ${openIncidents.map(function (i) {
        var l = learnerById(s, i.learnerId);
        return html`<div key=${i.id} className="sm">${i.ref} · ${i.type} · ${l ? l.name : ''}</div>`;
      })}
    </div>
  </div>` : null;

  return html`<div className="stack">
    ${incidentsBanner}
    <div className="grid g-auto">
      <${StatCard} label="Active learners" value=${st.total} icon="users" tone="blue" hint="Enrolled and not archived" />
      <${StatCard} label="Present today" value=${st.present} icon="check" tone="green" hint=${Math.round((st.present / st.total) * 100) + '% attendance'} />
      <${StatCard} label="Not yet arrived" value=${st.notArrived} icon="clock" tone="amber" hint="No arrival recorded" />
      <${StatCard} label="Still at school" value=${st.atSchool} icon="cap" tone="purple" hint="Present, not yet released" />
      <${StatCard} label="Collected" value=${st.collected} icon="logout" tone="teal" hint="Handed over to a collector" />
      <${StatCard} label="Pending pickups" value=${st.pendingVerification} icon="shield" tone="amber" hint="Permissions awaiting review" />
      <${StatCard} label="Unconfirmed home" value=${st.awaitingHome} icon="houseCheck" tone="amber" hint="Released, not confirmed home" />

    </div>

    <div className="card">
      <div className="card-h"><h3>Quick actions</h3><span className="xs mut">Demo actions update all connected pages</span></div>
      <div className="card-p row wrap" style=${{ gap: '9px' }}>
        <button className="btn btn-primary" onClick=${function () { setQuick('arrival'); }}><${Icon} name="login" size=${15} /> Record arrival</button>
        <button className="btn" onClick=${function () { go('/' + role + '/pickup'); }}><${Icon} name="shield" size=${15} /> Verify pickup</button>
        <button className="btn" onClick=${function () { go('/' + role + '/learners'); }}><${Icon} name="userPlus" size=${15} /> Register learner</button>
        <button className="btn" onClick=${function () { go('/' + role + '/communication'); }}><${Icon} name="megaphone" size=${15} /> Send announcement</button>
        <button className="btn" onClick=${function () { go('/' + role + '/safety'); }}><${Icon} name="alert" size=${15} /> Report incident</button>
      </div>
    </div>

    <div className="grid g-2">
      <div className="card">
        <div className="card-h"><h3>Daily attendance — last 7 days</h3><${Badge} tone="teal">Present<//></div>
        <div className="card-p"><${BarChart} data=${todayChart} /></div>
      </div>
      <div className="card">
        <div className="card-h"><h3>Arrivals vs departures today</h3></div>
        <div className="card-p row" style=${{ gap: '14px' }}>
          <div style=${{ flex: 1 }}><${BarChart} data=${arrByHour} color="var(--teal)" height=${130} /></div>
          <div style=${{ flex: 1 }}><${BarChart} data=${depByHour} color="var(--blue)" height=${130} /></div>
        </div>

    <div className="grid g-2-1">

function PagePickup(props) {
  var s = useStore();

  var st2 = useState('');
  var q = st2[0], setQ = st2[1];

  var st4 = useState(null);
  var collectorId = st4[0], setCollectorId = st4[1];
  var st5 = useState('');
  var pin = st5[0], setPin = st5[1];
  var st6 = useState(null);
  var result = st6[0], setResult = st6[1];
  var st7 = useState(s.staff[6].id);
  var staffId = st7[0], setStaffId = st7[1];
  var st8 = useState(false);
  var confirmOpen = st8[0], setConfirmOpen = st8[1];

  var candidates = s.learners.filter(function (l) {
    return !l.archived && (l.name.toLowerCase().indexOf(q.toLowerCase()) >= 0 || l.id.toLowerCase().indexOf(q.toLowerCase()) >= 0);
  });
  var learner = learnerId ? learnerById(s, learnerId) : null;
  var collectors = learner ? collectorsFor(s, learner.id) : [];
  var collector = collectorId ? s.collectors.find(function (c) { return c.id === collectorId; }) : null;

  function reset() { setStep(1); setLearnerId(null); setCollectorId(null); setPin(''); setResult(null); setQ(''); }
  function verify() {
    if (!collector) return;
    var stt = effectiveCollectorStatus(collector);
    if (stt !== 'approved') {
      var reason = stt === 'pending' ? 'This collector authorization is still pending school approval.' : stt === 'revoked' ? 'This collector permission has been revoked by the school.' : 'This temporary authorization has expired.';
      setResult({ ok: false, reason: reason });
      return;
    }
    if (s.settings.requirePin && pin.trim() !== collector.demoPin) {
      setResult({ ok: false, reason: 'The demo PIN entered does not match the PIN on record for this collector.' });
      return;
    }
    setResult({ ok: true });
  }
  function simulateQr() {
    if (!collector) return;
    if (effectiveCollectorStatus(collector) !== 'approved') { verify(); return; }
    setPin(collector.demoPin);
    setResult({ ok: true });
    toast('Demo QR scan simulated — this is not real identity verification', 'warn');
  }

  var stepChips = [1, 2, 3].map(function (n) {
    return html`<span key=${n} className=${cls('badge', step >= n ? 'b-teal' : 'b-muted')}>Step ${n}</span>`;
  });

  var step1 = html`<div>
    <${Field} label="1 · Search for the learner">
      <input className="input" autoFocus=${true} placeholder="Type a learner name or learner ID…" value=${q} onInput=${function (e) { setQ(e.target.value); }} aria-label="Search learner for pickup" />
    <//>
    <div className="mt16 stack" style=${{ gap: '8px', maxHeight: '360px', overflowY: 'auto' }}>
      ${candidates.length === 0 ? html`<${Empty} icon="search" title="No learners found" message="Check the spelling or search using the learner ID." />` : candidates.map(function (l) {
        var c = classById(s, l.classId);
        return html`<button key=${l.id} className="btn" style=${{ justifyContent: 'flex-start', width: '100%', padding: '11px' }} onClick=${function () { setLearnerId(l.id); setStep(2); }}>
          <${Avatar} name=${l.name} size="sm" />
          <span style=${{ flex: 1, textAlign: 'left' }}>
            <span className="bold" style=${{ display: 'block' }}>${l.name}</span>
            <span className="xs mut">${l.id} · ${c ? c.name : ''}</span>
          </span>
          <${StatusBadge} status=${l.status} />
          <${Icon} name="chevR" size=${15} />
        </button>`;
      })}
    </div>
  </div>`;

  var step2 = html`<div>
    <${Field} label="2 · Select the person collecting this learner">
      <div className="stack mt8" style=${{ gap: '8px' }}>
        ${collectors.map(function (k) {
          var stt = effectiveCollectorStatus(k);
          return html`<button key=${k.id} className="btn" style=${{ justifyContent: 'flex-start', width: '100%', padding: '11px', borderColor: stt === 'approved' ? 'var(--bd)' : '#fecaca' }} onClick=${function () { setCollectorId(k.id); setStep(3); setResult(null); setPin(''); }}>
            <${Avatar} name=${k.name} size="sm" />
            <span style=${{ flex: 1, textAlign: 'left' }}>
              <span className="bold" style=${{ display: 'block' }}>${k.name}</span>
              <span className="xs mut">${k.relationship} · ${k.type}${k.expiresAt ? ' · expires ' + fmtDate(k.expiresAt) : ''}</span>
            </span>
            <${CollectorBadge} c=${k} />
            <${Icon} name="chevR" size=${15} />
          </button>`;
        })}
      </div>
    <//>
  </div>`;

  var learnerHeader = learner ? html`<div className="card card-p" style=${{ background: '#f8fafc' }}>
    <div className="row">
      <${Avatar} name=${learner.name} size="lg" />
      <div style=${{ flex: 1 }}>
        <h3>${learner.name}</h3>
        <div className="sm mut">${learner.id} · ${(classById(s, learner.classId) || {}).name} · ${(classById(s, learner.classId) || {}).level}</div>
        <div className="mt8"><${StatusBadge} status=${learner.status} /></div>
      </div>
    </div>
  </div>` : null;

  var collectorCard = collector ? html`<div className="card card-p">
    <div className="between">
      <div className="row">
        <${Avatar} name=${collector.name} />
        <div><div className="bold">${collector.name}</div><div className="xs mut">${collector.relationship} · ${collector.phone}</div></div>
      </div>
      <${CollectorBadge} c=${collector} />
    </div>
    <div className="hr"></div>
    <div className="grid g-2">
      <div className="kv"><span>Authorization type</span><span>${collector.type}</span></div>
      <div className="kv"><span>Permission expires</span><span>${collector.expiresAt ? fmtDate(collector.expiresAt) : 'No expiry'}</span></div>
    </div>
  </div>` : null;

  var blockedBlock = null;
  if (collector && effectiveCollectorStatus(collector) !== 'approved') {
    var stt = effectiveCollectorStatus(collector);
    var reason = stt === 'pending' ? 'This person collector request is still awaiting school approval.' : stt === 'revoked' ? 'This person pickup permission has been revoked by the school.' : 'This temporary pickup authorization expired on ' + fmtDate(collector.expiresAt) + '.';
    blockedBlock = html`<div className="alert alert-red">
      <${Icon} name="alert" size=${20} />
      <div>
        <strong>Release blocked — collector not authorized</strong>
        ${reason}
        <div className="mt8"><strong>Do not release the learner.</strong> Ask the adult to contact the school office and verify the registered parent or guardian by phone.</div>
        <div className="mt8"><button className="btn btn-sm" onClick=${reset}>Start a new verification</button></div>
      </div>
    </div>`;
  }

  var approvedBlock = null;
  if (collector && effectiveCollectorStatus(collector) === 'approved') {
    approvedBlock = html`<div className="grid g-2">
      <div className="card card-p">
        <h4 style=${{ marginBottom: '10px' }}>3 · Demo PIN verification</h4>
        <div className="pin-box">
          <input className="pin-input" value=${pin} maxLength="4" inputMode="numeric" placeholder="••••" aria-label="Enter 4-digit demo PIN" onInput=${function (e) { setPin(e.target.value.replace(/\D/g, '')); }} />
        </div>
        <div className="xs mut mt8">Demo mode: the PIN on record for ${collector.name} is <strong>${collector.demoPin}</strong>. In a real deployment this would never be displayed.</div>
        <button className="btn btn-primary mt12" style=${{ width: '100%' }} onClick=${verify}><${Icon} name="key" size=${15} /> Verify collector</button>
      </div>
      <div className="card card-p">
        <h4 style=${{ marginBottom: '10px' }}>Or simulated QR scan</h4>
        <div className="qr-box"><${Icon} name="qr" size=${40} /><//>
        <button className="btn mt12" style=${{ width: '100%' }} onClick=${simulateQr}><${Icon} name="play" size=${14} /> Simulate QR scan</button>
        <div className="xs mut mt8">This is a demonstration scan only. It does not perform real identity verification.</div>
      </div>
    </div>`;
  }

  var resultBlock = null;
  if (result && result.ok && collector && learner) {
    resultBlock = html`<div className="alert alert-green">
      <${Icon} name="check" size=${20} />
      <div style=${{ flex: 1 }}>
        <strong>Approved — collector matches school records</strong>
        ${collector.name} (${collector.relationship}) is an authorized collector for ${learner.name}. Demo verification passed.
        <div className="mt12 row wrap" style=${{ gap: '10px' }}>
          <div style=${{ minWidth: '220px', flex: 1 }}>
            <label className="xs bold" style=${{ display: 'block', marginBottom: '4px' }}>Staff member recording handover</label>
            <select className="input" value=${staffId} onChange=${function (e) { setStaffId(e.target.value); }}>
              ${s.staff.map(function (x) { return html`<option key=${x.id} value=${x.id}>${x.name} — ${x.title}</option>`; })}
            </select>
          </div>
          <button className="btn btn-primary" style=${{ alignSelf: 'flex-end' }} onClick=${function () { setConfirmOpen(true); }}><${Icon} name="logout" size=${15} /> Record handover</button>
        </div>
      </div>
    </div>`;
  } else if (result && !result.ok) {
    resultBlock = html`<div className="alert alert-red">
      <${Icon} name="alert" size=${20} />
      <div><strong>Verification failed — do not release</strong>${result.reason}<div className="mt8">Keep the learner in class and contact the school office immediately.</div></div>
    </div>`;
  }

  var pendingRequests = s.collectors.filter(function (c) { return c.status === 'pending'; });

  return html`<div className="stack">
    <div className="alert alert-blue">
      <${Icon} name="shield" size=${18} />
      <div><strong>Gate verification workflow — simulated</strong>A learner is never released just because someone knows their name. Every handover requires a registered authorized collector and a matching demo PIN or simulated QR scan.</div>
    </div>

    <div className="card">
      <div className="card-h">
        <h3>Pickup verification</h3>
        <div className="row xs" style=${{ gap: '6px' }}>
          ${stepChips}
          <button className="btn btn-sm btn-ghost" onClick=${reset}><${Icon} name="refresh" size=${13} /> Reset</button>
        </div>
      </div>
      <div className="card-p">
        ${step === 1 ? step1 : null}
        ${step >= 2 && learner ? html`<div className="stack" style=${{ gap: '16px' }}>
          ${learnerHeader}
          ${step === 2 ? step2 : null}
          ${step >= 3 && collector ? html`<div className="stack" style=${{ gap: '14px' }}>
            ${collectorCard}
            ${blockedBlock}
            ${approvedBlock}
            ${resultBlock}
          </div>` : null}
        </div>` : null}
      </div>
    </div>

    <div className="card">
      <div className="card-h"><h3>Pending pickup permission requests</h3><${Badge} tone="amber">${pendingRequests.length}<//></div>
      <div className="tbl-wrap"><table className="tbl">
        <thead><tr><th>Learner</th><th>Proposed collector</th><th>Relationship</th><th>Requested expiry</th><th className="right">Decision</th></tr></thead>
        <tbody>
          ${pendingRequests.length === 0 ? html`<tr><td colSpan="5"><${Empty} icon="check" title="No pending requests" /></td></tr>` : pendingRequests.map(function (c) {
            var l = learnerById(s, c.learnerId);
            return html`<tr key=${c.id}>
              <td className="bold">${l ? l.name : '—'}</td>
              <td>${c.name}</td>
              <td>${c.relationship}</td>
              <td>${c.expiresAt ? fmtDate(c.expiresAt) : 'No expiry'}</td>
              <td className="right nowrap">
                <button className="btn btn-sm btn-primary" onClick=${function () { mutate(function (n) { var x = n.collectors.find(function (y) { return y.id === c.id; }); x.status = 'approved'; }); toast(c.name + ' approved as a collector'); }}>Approve</button>
                <button className="btn btn-sm" style=${{ marginLeft: '6px' }} onClick=${function () { mutate(function (n) { var x = n.collectors.find(function (y) { return y.id === c.id; }); x.status = 'revoked'; }); toast(c.name + ' rejected', 'warn'); }}>Reject</button>
              </td>
            </tr>`;
          })}
        </tbody>
      </table></div>
    </div>

    ${confirmOpen && learner && collector ? html`<${ConfirmDialog} title="Confirm learner handover"
      message=${'Record that ' + learner.name + ' is being released to ' + collector.name + ' (' + collector.relationship + ')? The learner home arrival must still be confirmed separately by a guardian.'}
      confirmLabel="Record handover"
      onConfirm=${function () { actionRecordDeparture(learner.id, collector.id, staffId); reset(); }}
      onClose=${function () { setConfirmOpen(false); }} />` : null}
  </div>`;
}

/* ---------- Page: Home arrival ---------- */
function PageHomeArrival() {
  var s = useStore();
  var active = s.learners.filter(function (l) { return !l.archived; });
  var pending = active.filter(awaitingHome);
  var confirmed = active.filter(function (l) { return l.homeConfirmedAt && isToday(l.homeConfirmedAt); });

  return html`<div className="stack">
    <div className="alert alert-amber">
      <${Icon} name="info" size=${18} />
      <div><strong>Departure is not proof of arrival</strong>A learner released at the gate is only marked home when an authorized parent or guardian confirms it — or through the clearly labelled simulated school transport workflow.</div>
    </div>

    <div className="grid g-3">
      <${StatCard} label="Awaiting confirmation" value=${pending.length} icon="clock" tone="amber" />
      <${StatCard} label="Confirmed home today" value=${confirmed.length} icon="houseCheck" tone="green" />
      <${StatCard} label="Still at school" value=${stats(s).atSchool} icon="cap" tone="blue" />
    </div>

    <div className="card">
      <div className="card-h"><h3>Awaiting home-arrival confirmation</h3><span className="xs mut">Released, not yet confirmed home</span></div>
      <div className="tbl-wrap">
        <table className="tbl">
          <thead><tr><th>Learner</th><th>Released at</th><th>Collector</th><th>Relationship</th><th className="right">Action</th></tr></thead>
          <tbody>
            ${pending.length === 0 ? html`<tr><td colSpan="5"><${Empty} icon="houseCheck" title="Nothing awaiting confirmation" message="All released learners have been confirmed home." /></td></tr>` : pending.map(function (l) {
              var c = classById(s, l.classId);
              var k = l.collectorId ? s.collectors.find(function (x) { return x.id === l.collectorId; }) : null;
              var guardianNames = l.guardianIds.map(function (g) { var gg = guardianById(s, g); return gg ? gg.name : ''; }).join(', ');
              var transportBtn = s.settings.confirmHome && k && k.type === 'Transport' ? html`<button className="btn btn-sm btn-primary" style=${{ marginLeft: '6px' }} onClick=${function () { actionConfirmHome(l.id, null, 'Simulated school transport confirmation'); }}>Transport confirm</button>` : null;
              return html`<tr key=${l.id}>
                <td><div className="row"><${Avatar} name=${l.name} size="sm" /><div><div className="bold">${l.name}</div><div className="xs mut">${c ? c.name : ''}</div></div></div></td>
                <td>${fmtTime(l.departureAt)}</td>
                <td>${k ? k.name : '—'}</td>
                <td>${k ? k.relationship : '—'}</td>
                <td className="right nowrap">
                  <button className="btn btn-sm" onClick=${function () { toast('Reminder sent to ' + guardianNames + ' (simulated)', 'warn'); }}>Send reminder</button>
                  ${transportBtn}
                </td>
              </tr>`;
            })}
          </tbody>
        </table>
      </div>
    </div>

    <div className="card">
      <div className="card-h"><h3>Confirmed home today</h3></div>
      <div className="tbl-wrap">
        <table className="tbl">
          <thead><tr><th>Learner</th><th>Confirmed at</th><th>Method</th><th>Collector</th></tr></thead>
          <tbody>
            ${confirmed.length === 0 ? html`<tr><td colSpan="4"><${Empty} icon="houseCheck" title="No confirmations yet" /></td></tr>` : confirmed.map(function (l) {
              var ev = s.events.find(function (e) { return e.learnerId === l.id && e.type === 'home_arrival'; });
              var k = l.collectorId ? s.collectors.find(function (x) { return x.id === l.collectorId; }) : null;
              return html`<tr key=${l.id}>
                <td className="bold">${l.name}</td>
                <td>${fmtTime(l.homeConfirmedAt)}</td>
                <td>${ev ? ev.staff : 'Parent confirmation'}</td>
                <td>${k ? k.name : '—'}</td>
              </tr>`;
            })}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;
}

/* ---------- Page: Parents ---------- */
function PageParents() {
  var s = useStore();
  var st1 = useState('');
  var q = st1[0], setQ = st1[1];
  var st2 = useState(null);
  var selected = st2[0], setSelected = st2[1];
  var st3 = useState(false);
  var invite = st3[0], setInvite = st3[1];
  var list = s.guardians.filter(function (g) { return g.name.toLowerCase().indexOf(q.toLowerCase()) >= 0 || g.phone.indexOf(q) >= 0; });
  var g = selected ? guardianById(s, selected) : null;

  var drawer = null;
  if (g) {
    var drawerStyle = { justifyContent: 'flex-end', padding: 0, alignItems: 'stretch' };
    var learnerRows = g.learnerIds.map(function (id) {
      var l = learnerById(s, id); if (!l) return null;
      var c = classById(s, l.classId);
      return html`<div key=${id} className="row" style=${{ padding: '9px 0', borderBottom: '1px dashed #eef2f6' }}>
        <${Avatar} name=${l.name} size="sm" />
        <div style=${{ flex: 1 }}><div className="sm bold">${l.name}</div><div className="xs mut">${c ? c.name : ''}</div></div>
        <${StatusBadge} status=${l.status} />
      </div>`;
    });
    var permissionRows = g.learnerIds.flatMap(function (id) { return collectorsFor(s, id); }).map(function (k) {
      var l = learnerById(s, k.learnerId);
      var revokeBtn = effectiveCollectorStatus(k) === 'approved' ? html`<button className="btn btn-sm" onClick=${function () { mutate(function (n) { var x = n.collectors.find(function (y) { return y.id === k.id; }); x.status = 'revoked'; }); toast(k.name + ' permission revoked', 'warn'); }}>Revoke</button>` : null;
      return html`<div key=${k.id} className="row" style=${{ padding: '9px 0', borderBottom: '1px dashed #eef2f6' }}>
        <${Avatar} name=${k.name} size="sm" />
        <div style=${{ flex: 1 }}><div className="sm bold">${k.name}</div><div className="xs mut">${k.relationship} · for ${l ? l.name : ''}</div></div>
        <${CollectorBadge} c=${k} />
        ${revokeBtn}
      </div>`;
    });
    var comms = s.notifications.filter(function (n) { return n.guardianId === g.id; }).slice(0, 5).map(function (n) {
      return html`<div key=${n.id} style=${{ padding: '8px 0', borderBottom: '1px dashed #eef2f6' }}>
        <div className="sm bold">${n.title}</div><div className="xs mut">${n.body} · ${relTime(n.ts)}</div>
      </div>`;
    });
    var verifyActions = !g.verified ? html`<${Fragment}>
      <button className="btn btn-sm btn-primary" onClick=${function () { mutate(function (n) { var x = n.guardians.find(function (y) { return y.id === g.id; }); x.verified = true; }); toast('Verification request approved (demo)'); }}>Approve</button>
      <button className="btn btn-sm" onClick=${function () { toast('Verification request rejected (demo)', 'warn'); }}>Reject</button>
    <//>` : null;

    drawer = html`<div className="scrim" style=${drawerStyle} onMouseDown=${function (e) { if (e.target === e.currentTarget) setSelected(null); }}>
      <div className="drawer" role="dialog" aria-modal="true" aria-label=${'Guardian profile: ' + g.name}>
        <div className="drawer-h">
          <div className="row"><${Avatar} name=${g.name} /><div><h3>${g.name}</h3><div className="xs mut">${g.relationship} · ${g.id}</div></div></div>
          <button className="icon-btn" onClick=${function () { setSelected(null); }} aria-label="Close"><${Icon} name="x" /><//></button>
        </div>
        <div className="drawer-b stack">
          <div className="row wrap" style=${{ gap: '8px' }}>
            <${Badge} tone=${g.verified ? 'green' : 'amber'} dot=${true}>${g.verified ? 'Account verified (simulated)' : 'Verification pending (simulated)'}<//>
            ${verifyActions}
          </div>
          <div>
            <div className="kv"><span>Phone</span><span>${g.phone}</span></div>
            <div className="kv"><span>Email</span><span>${g.email}</span></div>
          </div>
          <div><h4 className="mut" style=${{ marginBottom: '8px' }}>Linked learners</h4>${learnerRows}</div>
          <div><h4 className="mut" style=${{ marginBottom: '8px' }}>Registered pickup permissions</h4>${permissionRows}</div>
          <div><h4 className="mut" style=${{ marginBottom: '8px' }}>Recent communication</h4>${comms.length ? comms : html`<div className="sm mut">No messages yet.</div>`}</div>
        </div>
      </div>
    </div>`;
  }

  return html`<div className="stack">
    <div className="grid g-3">
      <${StatCard} label="Parent accounts" value=${s.guardians.length} icon="users" tone="blue" />
      <${StatCard} label="Verified accounts" value=${s.guardians.filter(function (x) { return x.verified; }).length} icon="userCheck" tone="green" hint="Simulated status" />
      <${StatCard} label="Awaiting verification" value=${s.guardians.filter(function (x) { return !x.verified; }).length} icon="clock" tone="amber" />
    </div>

    <div className="card">
      <div className="card-p row wrap" style=${{ gap: '10px' }}>
        <div className="input-search"><${Icon} name="search" size=${15} /><input className="input" placeholder="Search parents by name or phone…" value=${q} onInput=${function (e) { setQ(e.target.value); }} aria-label="Search parents" /></div>
        <div className="spacer"></div>
        <button className="btn btn-primary" onClick=${function () { setInvite(true); }}><${Icon} name="userPlus" size=${15} /> Invite parent</button>
      </div>
    </div>

    <div className="card">
      <div className="card-h"><h3>Parent & guardian directory</h3><span className="xs mut">All records are fictional</span></div>
      <div className="tbl-wrap"><table className="tbl">
        <thead><tr><th>Guardian</th><th>Linked learner(s)</th><th>Contact</th><th>Verification</th><th>Notification prefs</th><th className="right"></th></tr></thead>
        <tbody>
          ${list.length === 0 ? html`<tr><td colSpan="6"><${Empty} icon="search" title="No guardians match your search" /></td></tr>` : list.map(function (x) {
            var names = x.learnerIds.map(function (id) { var l = learnerById(s, id); return l ? l.name : ''; }).join(', ');
            var prefsCount = Object.keys(x.notify).filter(function (k) { return x.notify[k]; }).length;
            return html`<tr key=${x.id}>
              <td><div className="row"><${Avatar} name=${x.name} size="sm" /><div><div className="bold">${x.name}</div><div className="xs mut">${x.relationship}</div></div></div></td>
              <td>${names}</td>
              <td><div className="sm">${x.phone}</div><div className="xs mut">${x.email}</div></td>
              <td><${Badge} tone=${x.verified ? 'green' : 'amber'} dot=${true}>${x.verified ? 'Verified' : 'Pending review'}<//></td>
              <td className="xs mut">${prefsCount} of 5 enabled</td>
              <td className="right"><button className="btn btn-sm" onClick=${function () { setSelected(x.id); }}><${Icon} name="eye" size=${13} /> View</button></td>
            </tr>`;
          })}
        </tbody>
      </table></div>
    </div>

    ${drawer}
    ${invite ? html`<${InviteParentModal} onClose=${function () { setInvite(false); }} />` : null}
  </div>`;
}

function InviteParentModal(props) {
  var s = useStore();
  var st1 = useState({ name: '', relationship: 'Mother', phone: '', email: '', learnerId: s.learners[0].id });
  var form = st1[0], setForm = st1[1];
  var st2 = useState({});
  var err = st2[0], setErr = st2[1];
  function set(k) { return function (e) { var next = Object.assign({}, form); next[k] = e.target.value; setForm(next); }; }
  function submit(e) {
    e.preventDefault();
    var errs = {};
    if (form.name.trim().length < 3) errs.name = 'Enter the guardian full name.';
    if (!/^[+\d][\d\s-]{6,}$/.test(form.phone)) errs.phone = 'Enter a fictional phone number.';
    if (!/^\S+@\S+\.\S+$/.test(form.email)) errs.email = 'Enter a valid demo email address.';
    setErr(errs);
    if (Object.keys(errs).length) return;
    mutate(function (n) {
      var newGId = 'G-' + String(n.guardians.length + 1).padStart(2, '0');
      n.guardians.push({ id: newGId, name: form.name, relationship: form.relationship, phone: form.phone, email: form.email, learnerIds: [form.learnerId], verified: false, notify: { arrival: true, departure: true, home: true, announcements: true, safety: true } });
      var l = n.learners.find(function (x) { return x.id === form.learnerId; });
      if (l) l.guardianIds.push(newGId);
    });
    toast('Invitation prepared for ' + form.name + ' (simulated — no email is sent)', 'warn');
    props.onClose();
  }
  var footer = html`<button className="btn" onClick=${props.onClose}>Cancel</button><button className="btn btn-primary" type="submit" form="inviteForm">Send invitation</button>`;
  return html`<${Modal} title="Invite a parent or guardian" onClose=${props.onClose} footer=${footer}>
    <form id="inviteForm" onSubmit=${submit} className="stack" style=${{ gap: '13px' }}>
      <div className="alert alert-amber"><${Icon} name="info" size=${16} /><div>No real email or SMS is sent. This records a demo invitation in your browser only.</div></div>
      <${Field} label="Guardian name" hint=${err.name}><input className="input" value=${form.name} onInput=${set('name')} placeholder="e.g. Grace Omondi" /><//>
      <div className="grid g-2">
        <${Field} label="Relationship">
          <select className="input" value=${form.relationship} onChange=${set('relationship')}>
            ${['Mother', 'Father', 'Guardian', 'Grandparent', 'Nanny', 'Other'].map(function (r) { return html`<option key=${r} value=${r}>${r}</option>`; })}
          </select>
        <//>
        <${Field} label="Linked learner">
          <select className="input" value=${form.learnerId} onChange=${set('learnerId')}>
            ${s.learners.filter(function (l) { return !l.archived; }).map(function (l) { return html`<option key=${l.id} value=${l.id}>${l.name}</option>`; })}
          </select>
        <//>
      </div>
      <${Field} label="Phone" hint=${err.phone}><input className="input" value=${form.phone} onInput=${set('phone')} placeholder="+254 700 000 123" /><//>

function PageCommunication() {
  var s = useStore();
  var st1 = useState('compose');
  var tab = st1[0], setTab = st1[1];
  var st2 = useState({ subject: '', body: '', audience: 'All school families', priority: 'normal' });
  var form = st2[0], setForm = st2[1];

  function publish(status) {
    if (!form.subject.trim() || !form.body.trim()) { toast('Subject and message body are required', 'err'); return; }
    var id = uid('AN');
    var snapshot = { subject: form.subject, body: form.body, audience: form.audience, priority: form.priority };
    mutate(function (n) {
      n.announcements.unshift({ id: id, subject: snapshot.subject, body: snapshot.body, audience: snapshot.audience, priority: snapshot.priority, status: status, createdAt: new Date().toISOString(), publishAt: status === 'published' ? new Date().toISOString() : null, readBy: [], ackBy: [] });
      if (status === 'published') {
        var targets = snapshot.audience === 'All school families' ? n.guardians : n.guardians.filter(function (g) {
          return g.learnerIds.some(function (lid) {
            var l = n.learners.find(function (x) { return x.id === lid; });
            if (!l) return false;
            var c = n.classes.find(function (cc) { return cc.id === l.classId; });
            return c && snapshot.audience.indexOf(c.name) >= 0;
          });
        });
        targets.forEach(function (g) {
          var short = snapshot.body.length > 130 ? snapshot.body.slice(0, 130) + '…' : snapshot.body;
          addNotification(n, { audience: 'parent', guardianId: g.id, title: snapshot.subject, body: short, category: 'announcement' });
        });
      }
    });
    toast(status === 'published' ? 'Announcement published to ' + snapshot.audience : 'Draft saved');
    setForm({ subject: '', body: '', audience: 'All school families', priority: 'normal' });
  }

  var composeBlock = html`<div className="card-p stack" style=${{ gap: '14px' }}>
    <div className="grid g-3">
      <${Field} label="Audience">
        <select className="input" value=${form.audience} onChange=${function (e) { setForm(Object.assign({}, form, { audience: e.target.value })); }}>
          <option>All school families</option>
          ${s.classes.map(function (c) { return html`<option key=${c.id}>${c.name} · ${c.level}</option>`; })}
        </select>
      <//>
      <${Field} label="Priority">
        <select className="input" value=${form.priority} onChange=${function (e) { setForm(Object.assign({}, form, { priority: e.target.value })); }}>
          <option value="normal">Normal</option><option value="high">High — important</option><option value="urgent">Urgent — safety</option>
        </select>
      <//>
      <${Field} label="Start from a template">
        <select className="input" onChange=${function (e) {
          var t = TEMPLATES.find(function (x) { return x.id === e.target.value; });
          if (t) setForm(Object.assign({}, form, { subject: t.subject, body: t.body }));
        }}>
          <option value="">Choose a template…</option>
          ${TEMPLATES.map(function (t) { return html`<option key=${t.id} value=${t.id}>${t.name}</option>`; })}
        </select>
      <//>
    </div>
    <${Field} label="Subject"><input className="input" value=${form.subject} onInput=${function (e) { setForm(Object.assign({}, form, { subject: e.target.value })); }} placeholder="Announcement subject" /><//>
    <${Field} label="Message body"><textarea className="input" style=${{ minHeight: '170px' }} value=${form.body} onInput=${function (e) { setForm(Object.assign({}, form, { body: e.target.value })); }} placeholder="Write your message to families…"></textarea><//>
    <div className="row wrap" style=${{ gap: '9px' }}>
      <button className="btn btn-primary" onClick=${function () { publish('published'); }}><${Icon} name="send" size=${15} /> Publish now</button>
      <button className="btn" onClick=${function () { publish('draft'); }}>Save as draft</button>
      <button className="btn" onClick=${function () { publish('scheduled'); toast('Message scheduled (simulated — no message will actually be sent)', 'warn'); }}><${Icon} name="clock" size=${15} /> Schedule (simulated)</button>
      <div className="spacer"></div>
      <span className="xs mut">Simulated delivery only</span>
    </div>
  </div>`;

  var publishedBlock = html`<div className="tbl-wrap"><table className="tbl">
    <thead><tr><th>Subject</th><th>Audience</th><th>Priority</th><th>Status</th><th>Read</th><th>Acknowledged</th><th>Created</th></tr></thead>
    <tbody>
      ${s.announcements.map(function (a) {
        var priTone = a.priority === 'urgent' ? 'red' : a.priority === 'high' ? 'amber' : 'muted';
        var stTone = a.status === 'published' ? 'green' : a.status === 'scheduled' ? 'blue' : 'muted';
        return html`<tr key=${a.id}>
          <td className="bold">${a.subject}</td>
          <td className="mut">${a.audience}</td>
          <td><${Badge} tone=${priTone}>${a.priority}<//></td>
          <td><${Badge} tone=${stTone} dot=${true}>${a.status}<//></td>
          <td>${a.readBy.length}</td>
          <td>${a.ackBy.length}</td>
          <td className="mut xs">${fmtDT(a.createdAt)}</td>
        </tr>`;
      })}
    </tbody>
  </table></div>`;

  var historyItems = s.notifications.filter(function (n) { return n.category === 'announcement'; });
  var historyBlock = html`<div className="card-p stack" style=${{ gap: '8px', maxHeight: '520px', overflowY: 'auto' }}>
    ${historyItems.length === 0 ? html`<${Empty} icon="megaphone" title="No announcements delivered yet" />` : historyItems.map(function (n) {
      var g = guardianById(s, n.guardianId);
      return html`<div key=${n.id} style=${{ border: '1px solid var(--bd)', borderRadius: '11px', padding: '11px 13px' }}>
        <div className="between"><span className="bold sm">${n.title}</span><${Badge} tone=${n.read ? 'green' : 'amber'}>${n.read ? 'Read' : 'Unread'}<//></div>
        <div className="xs mut mt8">To ${g ? g.name : 'guardian'} · ${relTime(n.ts)} · simulated delivery</div>
      </div>`;
    })}
  </div>`;

  return html`<div className="stack">
    <div className="alert alert-blue">
      <${Icon} name="info" size=${18} />
      <div><strong>Delivery is simulated</strong>Published announcements appear immediately in the demo parent portal and notification centre. No SMS, WhatsApp, email or push messages are actually sent.</div>
    </div>
    <div className="card">
      <div className="tabs">
        ${[['compose', 'Compose'], ['published', 'Published & drafts'], ['history', 'Delivery history']].map(function (t) {
          return html`<button key=${t[0]} className=${cls('tab', tab === t[0] ? 'active' : '')} onClick=${function () { setTab(t[0]); }}>${t[1]}</button>`;
        })}
      </div>
      ${tab === 'compose' ? composeBlock : null}
      ${tab === 'published' ? publishedBlock : null}
      ${tab === 'history' ? historyBlock : null}
    </div>
  </div>`;
}

function PageSafety() {

    var resolvedBtn = inc.status !== 'resolved' ? html`<button className="btn btn-primary" onClick=${function () {

        if (!update.trim()) return;

    } else {

    modal = html`<${Modal} title=${inc.ref + ' — ' + inc.type} onClose=${function () { setSelected(null); }} wide=${true}

      <div className="stack" style=${{ gap: '14px' }}>

        <div className="kv"><span>Class</span><span>${incClass ? incClass.name : '—'}</span></div>
        <div className="kv"><span>Reported by</span><span>${inc.reportedBy}</span></div>
        <div className="kv"><span>Assigned lead</span><span>${inc.assignedTo || 'Unassigned'}</span></div>
        <div className="kv"><span>Opened</span><span>${fmtDT(inc.openedAt)}</span></div>
        ${inc.resolvedAt ? html`<div className="kv"><span>Resolved</span><span>${fmtDT(inc.resolvedAt)}</span></div>` : null}

        <div>

            ${inc.actions.map(function (a, i) {
              return html`<div className="tl-item" key=${i}>

      <div className="card-p" style=${{ paddingTop: 0 }}>
        <div className="alert alert-amber">

    ${missingOpen ? html`<${MissingLearnerModal} onClose=${function () { setMissingOpen(false); }} onCreated=${function (id) { setSelected(id); }} />` : null}
  </div>`;
}

function ReportIncidentModal(props) {
  var s = useStore();
  var st1 = useState({ learnerId: s.learners[0].id, type: 'Unauthorized pickup attempt', severity: 'medium', summary: '', assignedTo: s.staff[0].name });
  var form = st1[0], setForm = st1[1];
  function set(k) { return function (e) { var next = Object.assign({}, form); next[k] = e.target.value; setForm(next); }; }
  function submit(e) {
    e.preventDefault();
    if (form.summary.trim().length < 10) { toast('Please describe the incident in at least 10 characters', 'err'); return; }
    var ref = 'SAF-' + Math.floor(2100 + Math.random() * 800);
    mutate(function (n) {
      n.incidents.unshift({
        id: 'INC-' + Math.floor(2100 + Math.random() * 800), ref: ref, learnerId: form.learnerId, type: form.type,
        severity: form.severity, status: 'investigating', reportedBy: 'Demo staff member', assignedTo: form.assignedTo,
        openedAt: new Date().toISOString(), resolvedAt: null,
        locationInfo: 'No live location available — this prototype does not track learners by GPS.',
        summary: form.summary,
        actions: [{ ts: new Date().toISOString(), by: 'Demo staff member', text: 'Incident opened and logged in the safety register.' }]
      });
      var l = n.learners.find(function (x) { return x.id === form.learnerId; });
      addNotification(n, { audience: 'admin', title: 'New safety incident', body: form.type + ' involving ' + (l ? l.name : '') + '.', category: 'safety', learnerId: form.learnerId });
    });
    toast('Incident created and logged');
    props.onClose();
  }
  var footer = html`<button className="btn" onClick=${props.onClose}>Cancel</button><button className="btn btn-primary" form="incForm" type="submit">Create incident</button>`;
  return html`<${Modal} title="Report a safety incident" onClose=${props.onClose} footer=${footer}>
    <form id="incForm" className="stack" style=${{ gap: '13px' }} onSubmit=${submit}>
      <div className="alert alert-amber"><${Icon} name="alert" size=${16} /><div>Creating an incident does <strong>not</strong> contact emergency services. Follow your school safeguarding procedure.</div></div>
      <${Field} label="Learner">
        <select className="input" value=${form.learnerId} onChange=${set('learnerId')}>
          ${s.learners.filter(function (l) { return !l.archived; }).map(function (l) { return html`<option key=${l.id} value=${l.id}>${l.name} — ${l.id}</option>`; })}
        </select>
      <//>
      <div className="grid g-2">
        <${Field} label="Incident type">
          <select className="input" value=${form.type} onChange=${set('type')}>
            ${['Unauthorized pickup attempt', 'Missing learner', 'Late collection', 'Medical concern', 'Gate security concern', 'Other'].map(function (t) { return html`<option key=${t}>${t}</option>`; })}
          </select>
        <//>
        <${Field} label="Severity">
          <select className="input" value=${form.severity} onChange=${set('severity')}>
            ${['low', 'medium', 'high'].map(function (t) { return html`<option key=${t} value=${t}>${t}</option>`; })}
          </select>
        <//>
      </div>
      <${Field} label="Assigned incident lead">
        <select className="input" value=${form.assignedTo} onChange=${set('assignedTo')}>
          ${s.staff.map(function (x) { return html`<option key=${x.id} value=${x.name}>${x.name} — ${x.title}</option>`; })}
        </select>
      <//>
      <${Field} label="What happened?"><textarea className="input" value=${form.summary} onInput=${set('summary')} placeholder="Describe what happened, who was involved and what action was taken."></textarea><//>
    </form>
  <//>`;
}

function MissingLearnerModal(props) {

/* ---------- Page: Reports ---------- */
const REPORTS = {
  attendance: 'Daily attendance',
  late: 'Late arrivals',
  absences: 'Absences',
  early: 'Early departures',
  pickup: 'Pickup verification',
  unauthorised: 'Unauthorized pickup attempts',
  home: 'Home-arrival confirmation',
  notifications: 'Parent notification history',
  incidents: 'Safety incidents'
};
const REPORT_HEADERS = {
  attendance: ['Learner ID', 'Name', 'Class', 'Status', 'Arrival', 'Departure'],
  late: ['Learner ID', 'Name', 'Class', 'Arrival time', 'Note'],
  absences: ['Learner ID', 'Name', 'Class', 'Reason', 'Guardian'],
  early: ['Learner ID', 'Name', 'Departure time', 'Recorded by'],
  pickup: ['Learner ID', 'Name', 'Collector', 'Relationship', 'Time', 'Recorded by'],
  unauthorised: ['Reference', 'Learner', 'Date/time', 'Status', 'Assigned to'],
  home: ['Learner ID', 'Name', 'Released at', 'Confirmed at', 'Status'],
  notifications: ['When', 'Guardian', 'Message', 'Category', 'Read state'],
  incidents: ['Reference', 'Type', 'Learner', 'Severity', 'Status', 'Opened', 'Assigned to']
};

function PageReports() {
  var s = useStore();
  var st1 = useState('attendance');
  var type = st1[0], setType = st1[1];
  var st2 = useState('all');
  var clsF = st2[0], setClsF = st2[1];
  var active = s.learners.filter(function (l) { return !l.archived; }).filter(function (l) { return clsF === 'all' || l.classId === clsF; });

  var rows = useMemo(function () {
    switch (type) {
      case 'attendance':
        return active.map(function (l) { return [l.id, l.name, (classById(s, l.classId) || {}).name, LEARNER_STATUS[l.status].label, fmtTime(l.arrivalAt), fmtTime(l.departureAt)]; });
      case 'late':
        return active.filter(function (l) { return l.status === 'late'; }).map(function (l) { return [l.id, l.name, (classById(s, l.classId) || {}).name, fmtTime(l.arrivalAt), 'After ' + s.school.lateCutoff]; });
      case 'absences':
        return active.filter(function (l) { return l.status === 'absent'; }).map(function (l) { return [l.id, l.name, (classById(s, l.classId) || {}).name, 'Absent today', (guardianById(s, l.guardianIds[0]) || {}).name]; });
      case 'early':
        return s.events.filter(function (e) { return e.type === 'departure' && new Date(e.ts).getHours() < 15; }).map(function (e) {
          var l = learnerById(s, e.learnerId) || {};
          return [l.id, l.name, fmtTime(e.ts), e.staff];
        });
      case 'pickup':
        return s.events.filter(function (e) { return e.type === 'departure'; }).map(function (e) {
          var l = learnerById(s, e.learnerId) || {};
          var k = s.collectors.find(function (x) { return x.id === l.collectorId; }) || {};
          return [l.id, l.name, k.name || '—', k.relationship || '—', fmtTime(e.ts), e.staff];
        });
      case 'unauthorised':
        return s.incidents.filter(function (i) { return i.type === 'Unauthorized pickup attempt'; }).map(function (i) {
          return [i.ref, (learnerById(s, i.learnerId) || {}).name, fmtDT(i.openedAt), i.status, i.assignedTo];
        });
      case 'home':
        return active.filter(function (l) { return l.departureAt; }).map(function (l) {
          return [l.id, l.name, fmtTime(l.departureAt), l.homeConfirmedAt ? fmtTime(l.homeConfirmedAt) : 'Not confirmed', l.homeConfirmedAt ? 'Confirmed' : 'Awaiting'];
        });
      case 'notifications':
        return s.notifications.filter(function (n) { return n.audience === 'parent'; }).map(function (n) {
          return [relTime(n.ts), (guardianById(s, n.guardianId) || {}).name || '—', n.title, n.category, n.read ? 'Read' : 'Unread'];
        });
      case 'incidents':
        return s.incidents.map(function (i) {
          return [i.ref, i.type, (learnerById(s, i.learnerId) || {}).name, i.severity, i.status, fmtDT(i.openedAt), i.assignedTo || 'Unassigned'];
        });
      default: return [];
    }
  }, [type, clsF, s]);

  var headers = REPORT_HEADERS[type];

  var trend = s.history.map(function (h) {
    return { label: new Date(h.date).toLocaleDateString([], { weekday: 'short' }), value: h.present };
  }).concat([{ label: 'Today', value: stats(s).present, color: 'var(--teal-d)' }]);

  return html`<div className="stack">
    <div className="card">
      <div className="card-p row wrap" style=${{ gap: '10px' }}>
        <select className="input" style=${{ width: 'auto' }} value=${type} onChange=${function (e) { setType(e.target.value); }} aria-label="Select report">
          ${Object.keys(REPORTS).map(function (k) { return html`<option key=${k} value=${k}>${REPORTS[k]}</option>`; })}
        </select>
        <select className="input" style=${{ width: 'auto' }} value=${clsF} onChange=${function (e) { setClsF(e.target.value); }} aria-label="Filter by class">
          <option value="all">All classes</option>
          ${s.classes.map(function (c) { return html`<option key=${c.id} value=${c.id}>${c.name}</option>`; })}
        </select>
        <span className="xs mut">Showing today data · demo dataset</span>
        <div className="spacer"></div>
        <button className="btn btn-primary" onClick=${function () { exportCSV(type + '-report.csv', [headers].concat(rows)); }}>
          <${Icon} name="download" size=${15} /> Export CSV
        </button>
      </div>
    </div>

    <div className="grid g-2">
      <div className="card">
        <div className="card-h"><h3>Attendance trend — last 7 days</h3></div>
        <div className="card-p"><${BarChart} data=${trend} /></div>
      </div>
      <div className="card">
        <div className="card-h"><h3>Status distribution — today</h3></div>
        <div className="card-p">
          ${s.classes.map(function (c) {
            var m = active.filter(function (l) { return l.classId === c.id; });
            return html`<${ProgressRow} key=${c.id} label=${c.name} value=${m.filter(isPresent).length} total=${m.length} />`;
          })}
          <div className="hr"></div>
          <div className="kv"><span>Late arrivals</span><span className="bold">${stats(s).late}</span></div>
          <div className="kv"><span>Absences</span><span className="bold">${stats(s).absent}</span></div>
          <div className="kv"><span>Awaiting home confirmation</span><span className="bold">${stats(s).awaitingHome}</span></div>
        </div>
      </div>
    </div>

    <div className="card">
      <div className="card-h"><h3>${REPORTS[type]}</h3><span className="xs mut">${rows.length} row${rows.length === 1 ? '' : 's'}</span></div>
      <div className="tbl-wrap">
        <table className="tbl">
          <thead><tr>${headers.map(function (h) { return html`<th key=${h}>${h}</th>`; })}</tr></thead>
          <tbody>
            ${rows.length === 0 ? html`<tr><td colSpan=${headers.length}><${Empty} icon="chart" title="No data for this report" message="Try a different report type or class filter." /></td></tr>` : rows.map(function (r, i) {
              return html`<tr key=${i}>${r.map(function (c, j) { return html`<td key=${j} className=${j === 1 ? 'bold' : ''}>${c}</td>`; })}</tr>`;
            })}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;
}

  return { guardian: g, learners: learners, child: learners[0] };
}

function ParentPickup() {
