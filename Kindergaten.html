<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Little Steps Kindergarten — Communication &amp; Learner Safety System</title>
<meta name="description" content="Demo prototype: kindergarten school–parent communication, attendance and learner safety system." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --navy:#0e2a3a; --navy2:#153c52; --navy3:#1d4d68;
  --teal:#0d9488; --teal-d:#0f766e; --teal-l:#ccfbf1;
  --bg:#f5f7f9; --card:#ffffff; --bd:#e4e9ef; --tx:#0f172a; --mut:#64748b;
  --green:#15803d; --green-l:#dcfce7;
  --amber:#b45309; --amber-l:#fef3c7;
  --red:#b91c1c; --red-l:#fee2e2;
  --blue:#1d4ed8; --blue-l:#dbeafe;
  --purple:#6d28d9; --purple-l:#ede9fe;
  --r:14px; --r-sm:9px;
  --sh:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.08);
  --sh-lg:0 10px 30px rgba(16,24,40,.14);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--tx); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px} h4{font-size:13px}
p{margin:0}
a{color:var(--teal-d);text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
.mut{color:var(--mut)} .sm{font-size:12.5px} .xs{font-size:11.5px}
.bold{font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:16px}
.gap8{gap:8px}.gap12{gap:12px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.center{display:flex;align-items:center;justify-content:center}
.right{text-align:right}
.nowrap{white-space:nowrap}
.hr{height:1px;background:var(--bd);margin:14px 0}

/* ---------- App shell ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:248px;background:var(--navy);color:#c7d5df;display:flex;flex-direction:column;
  position:fixed;top:0;bottom:0;left:0;z-index:50;transition:transform .22s ease;
}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(140deg,var(--teal),#0891b2);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:none}
.brand-txt strong{display:block;color:#fff;font-size:13.5px;line-height:1.2}
.brand-txt span{font-size:11px;color:#7d97a8}
.nav{flex:1;overflow-y:auto;padding:6px 10px 20px}
.nav-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#688499;padding:14px 10px 6px}
.nav a{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:#c7d5df;
  font-size:13.5px;font-weight:500;margin-bottom:1px;
}
.nav a:hover{background:var(--navy2);color:#fff}
.nav a.active{background:var(--teal-d);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.nav a .badge-dot{margin-left:auto}
.side-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7d97a8}
.main{flex:1;margin-left:248px;display:flex;flex-direction:column;min-width:0}
.topbar{
  position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--bd);
  min-height:62px;display:flex;align-items:center;gap:10px;padding:8px 16px;
}
.content{padding:20px;width:100%;max-width:1440px;margin:0 auto}
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
@media (max-width:1020px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none}
  .main{margin-left:0}
  .content{padding:14px}
}

/* ---------- Components ---------- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.card-p{padding:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--bd)}
.card-h h3{font-size:14px}
.grid{display:grid;gap:14px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
.g-2-1{grid-template-columns:2fr 1fr}
@media (max-width:1100px){.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-2-1{grid-template-columns:1fr}.g-3{grid-template-columns:1fr}}
@media (max-width:720px){.g-2,.g-4{grid-template-columns:1fr}}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 13px;border-radius:9px;border:1px solid var(--bd);background:#fff;color:var(--tx);
  font-size:13px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s,box-shadow .15s;
}
.btn:hover{background:#f8fafc;border-color:#cbd5e1}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--teal-d);border-color:var(--teal-d);color:#fff}
.btn-primary:hover{background:#0b5f59;border-color:#0b5f59}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-danger:hover{background:#991b1b;border-color:#991b1b}
.btn-dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-dark:hover{background:var(--navy2)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:#f1f5f9}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--mut);cursor:pointer}
.icon-btn:hover{background:#f1f5f9;color:var(--tx)}
.icon-btn.on{background:var(--teal-l);color:var(--teal-d)}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:#334155}
.input,select.input,textarea.input{
  width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:9px;font-size:13.5px;
  background:#fff;color:var(--tx);font-family:inherit;
}
.input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,148,136,.14)}
textarea.input{min-height:96px;resize:vertical}
.input-search{position:relative;flex:1;max-width:340px}
.input-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mut)}
.input-search input{padding-left:34px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--teal-d)}

.badge{
  display:inline-flex;align-items:center;gap:5px;padding:2.5px 9px;border-radius:999px;
  font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent;
}
.b-green{background:var(--green-l);color:var(--green)}
.b-amber{background:var(--amber-l);color:var(--amber)}
.b-red{background:var(--red-l);color:var(--red)}
.b-blue{background:var(--blue-l);color:var(--blue)}
.b-teal{background:var(--teal-l);color:var(--teal-d)}
.b-purple{background:var(--purple-l);color:var(--purple)}
.b-muted{background:#f1f5f9;color:#475569}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);
  padding:10px 14px;border-bottom:1px solid var(--bd);background:#fafbfc;font-weight:600;white-space:nowrap;
}
table.tbl td{padding:11px 14px;border-bottom:1px solid #eef2f6;vertical-align:middle}
table.tbl tbody tr:hover{background:#fafcfd}
table.tbl tbody tr.clickable{cursor:pointer}
.tbl-wrap{overflow-x:auto}

.avatar{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  font-size:12.5px;font-weight:700;color:#fff;flex:none;letter-spacing:.02em;
}
.avatar.lg{width:56px;height:56px;font-size:18px}
.avatar.sm{width:28px;height:28px;font-size:11px}

.stat{display:flex;flex-direction:column;gap:6px;padding:14px 16px;background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.stat-top{display:flex;align-items:center;justify-content:space-between}
.stat-ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.stat-val{font-size:24px;font-weight:700;letter-spacing:-.02em}
.stat-lbl{font-size:12px;color:var(--mut);font-weight:500}

.chart{display:flex;align-items:flex-end;gap:8px;height:100%;padding:6px 0}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;min-width:0}
.chart-bar{width:100%;max-width:46px;border-radius:7px 7px 3px 3px;background:var(--teal);transition:height .3s}
.chart-val{font-size:11px;font-weight:600;color:#475569}
.chart-lbl{font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bar-line{display:flex;align-items:center;gap:10px;font-size:12.5px}
.bar-track{flex:1;height:8px;border-radius:999px;background:#eef2f6;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--teal)}

.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:11px;padding-bottom:14px;position:relative}
.tl-item:not(:last-child)::before{content:'';position:absolute;left:11px;top:26px;bottom:0;width:2px;background:#eef2f6}
.tl-ico{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;z-index:1;background:#f1f5f9;color:#475569}
.tl-body{flex:1;min-width:0;padding-top:1px}
.tl-title{font-size:13px;font-weight:500}
.tl-meta{font-size:11.5px;color:var(--mut);margin-top:1px}

.alert{display:flex;gap:11px;padding:12px 13px;border-radius:var(--r-sm);border:1px solid;font-size:13px;align-items:flex-start}
.alert-red{background:#fef2f2;border-color:#fecaca;color:#7f1d1d}
.alert-amber{background:#fffbeb;border-color:#fde68a;color:#78350f}
.alert-green{background:#f0fdf4;border-color:#bbf7d0;color:#14532d}
.alert-blue{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a}
.alert-teal{background:#f0fdfa;border-color:#99f6e4;color:#134e4a}
.alert strong{display:block;margin-bottom:2px}

.modal{background:#fff;border-radius:16px;box-shadow:var(--sh-lg);width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal-lg{max-width:840px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--bd)}
.modal-b{padding:18px;overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:9px;padding:14px 18px;border-top:1px solid var(--bd);background:#fafbfc}

.toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:340px}
.toast{
  background:#0f172a;color:#fff;padding:11px 14px;border-radius:11px;font-size:13px;
  box-shadow:var(--sh-lg);display:flex;gap:9px;align-items:flex-start;animation:slideIn .22s ease;
}
.toast.ok{background:#0f766e}.toast.warn{background:#b45309}.toast.err{background:#b91c1c}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.empty{padding:38px 18px;text-align:center;color:var(--mut)}
.empty-ico{width:44px;height:44px;border-radius:50%;background:#f1f5f9;display:grid;place-items:center;margin:0 auto 10px;color:#94a3b8}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);overflow-x:auto}
.tab{
  padding:9px 13px;border:none;background:none;font-size:13px;font-weight:500;color:var(--mut);
  cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;
}
.tab.active{color:var(--teal-d);border-bottom-color:var(--teal-d)}
.tab:hover{color:var(--tx)}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:70;box-shadow:var(--sh-lg);display:flex;flex-direction:column;animation:slideL .2s ease}
@keyframes slideL{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--bd)}
.drawer-b{flex:1;overflow-y:auto;padding:18px}

.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px dashed #eef2f6;font-size:13px}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--mut)}

.pin-box{display:flex;gap:8px}
.pin-input{
  width:100%;padding:13px;border:2px solid var(--bd);border-radius:11px;font-size:22px;
  letter-spacing:.4em;text-align:center;font-weight:700;font-family:inherit;
}
.pin-input:focus{outline:none;border-color:var(--teal)}
.qr-box{
  width:150px;height:150px;border-radius:12px;border:2px dashed #cbd5e1;display:grid;place-items:center;
  background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 8px,#f1f5f9 8px,#f1f5f9 16px);color:#64748b;margin:0 auto;
}

.demo-badge{
  display:inline-flex;align-items:center;gap:6px;background:#fef3c7;color:#92400e;
  border:1px solid #fde68a;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;
}
.role-pill{
  display:inline-flex;align-items:center;gap:7px;background:#f1f5f9;border:1px solid var(--bd);
  border-radius:999px;padding:4px 6px 4px 11px;font-size:12px;font-weight:600;
}

/* ---------- Landing ---------- */
.landing{min-height:100vh;background:radial-gradient(1100px 520px at 12% -10%,#0f3b4d 0%,var(--navy) 55%,#0a1f2c 100%);color:#e2e8f0;padding:38px 20px 60px}
.landing-inner{max-width:1120px;margin:0 auto}
.landing h1{font-size:clamp(26px,4.4vw,42px);color:#fff;line-height:1.15;letter-spacing:-.025em}
.landing .lede{color:#a8bccb;font-size:15.5px;max-width:660px;margin-top:14px}
.role-cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));margin-top:26px}
.role-card{
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.13);border-radius:16px;padding:18px;
  cursor:pointer;text-align:left;color:#e2e8f0;transition:transform .16s,background .16s,border-color .16s;
}
.role-card:hover{background:rgba(255,255,255,.1);border-color:rgba(45,212,191,.5);transform:translateY(-2px)}
.role-card h3{color:#fff;font-size:15.5px;margin-bottom:6px}
.role-card p{font-size:12.5px;color:#9db2c1;line-height:1.5}
.role-ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;margin-bottom:12px;background:rgba(13,148,136,.22);color:#5eead4}
.walkthrough{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;margin-top:22px}
.walkthrough ol{margin:10px 0 0;padding-left:20px;color:#a8bccb;font-size:13.5px;line-height:1.9}
.walkthrough ol strong{color:#fff}

/* ---------- Parent portal ---------- */
.parent-shell{min-height:100vh;background:#f6f9fb;display:flex;flex-direction:column}
.parent-top{
  background:linear-gradient(150deg,var(--navy2),var(--navy));color:#fff;padding:14px 16px 18px;
  border-radius:0 0 22px 22px;
}
.parent-body{flex:1;padding:16px;max-width:820px;width:100%;margin:0 auto;padding-bottom:96px}
.parent-nav{
  position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);
  display:flex;justify-content:space-around;padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:50;
}
.parent-nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;
  font-size:10.5px;color:var(--mut);cursor:pointer;padding:5px 2px;border-radius:9px;font-weight:500;
}
.parent-nav button.active{color:var(--teal-d)}
.parent-nav button.active svg{stroke-width:2.3}
.child-card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px}
.quick-btn{
  background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;flex-direction:column;
  gap:8px;align-items:flex-start;cursor:pointer;text-align:left;font-size:13px;font-weight:600;color:var(--tx);
  box-shadow:var(--sh);transition:transform .15s,border-color .15s;
}
.quick-btn:hover{transform:translateY(-2px);border-color:var(--teal)}
.quick-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}

.notice-card{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--teal);border-radius:12px;padding:13px 15px}
.notice-card.high{border-left-color:var(--red)}
.notice-card.med{border-left-color:var(--amber)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hide-sm{display:initial}
@media (max-width:720px){.hide-sm{display:none}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>

<div id="root"></div>

const P = (d) => ['path', { d }];
const ICONS = {

  cap: [P('M22 10 12 5 2 10l10 5z'), P('M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5')],
  calendar: [['rect',{x:3,y:4.5,width:18,height:16.5,rx:2}], P('M3 10h18M8 2.5v4M16 2.5v4'), P('m9 15 2 2 4-4')],
  login: [P('M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4'), P('m10 17 5-5-5-5M15 12H3')],
  logout: [P('M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4'), P('m16 17 5-5-5-5M21 12H9')],
  shield: [P('M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'), P('m9 12 2 2 4-4')],
  houseCheck: [P('M3 10.4 12 3l9 7.4V21a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z'), P('m9 14 2 2 4-4')],
  userCheck: [P('M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2'), ['circle',{cx:9,cy:7,r:4}], P('m16 11 2 2 4-4')],

const cls = (...a) => a.filter(Boolean).join(' ');
const uid = (p = 'X') => p + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
const initials = (n) => n.trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
const AV_COLORS = ['#0d9488','#2563eb','#7c3aed','#db2777','#ea580c','#0891b2','#65a30d','#9333ea','#c2410c','#0369a1'];
const avColor = (s) => AV_COLORS[Math.abs([...s].reduce((a, c) => a + c.charCodeAt(0), 0)) % AV_COLORS.length];
const fmtTime = (iso) => (iso ? new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—');
const fmtDate = (iso) => (iso ? new Date(iso).toLocaleDateString([], { day: '2-digit', month: 'short', year: 'numeric' }) : '—');
const fmtDT = (iso) => (iso ? `${fmtDate(iso)} · ${fmtTime(iso)}` : '—');
const dayKey = (iso) => new Date(iso).toDateString();
const isToday = (iso) => iso && dayKey(iso) === new Date().toDateString();
const relTime = (iso) => {
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m} min ago`;
  if (m < 1440) return `${Math.floor(m / 60)} hr ago`;
  return `${Math.floor(m / 1440)} d ago`;
};
const initialsAvatar = (name, size = '') => html`<div className=${cls('avatar', size)} style=${{ background: avColor(name) }} aria-hidden="true">${initials(name)}</div>`;

function exportCSV(filename, rows) {
  const csv = rows.map((r) => r.map((c) => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* =========================================================================
   4. STORE
   ========================================================================= */
const STORAGE_KEY = 'little-steps-demo-v1';
const clone = (o) => JSON.parse(JSON.stringify(o));

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return seed();
    const parsed = JSON.parse(raw);
    if (!parsed || parsed.version !== 1 || !parsed.learners) return seed();
    return parsed;
  } catch (e) { return seed(); }
}
function save(s) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) { /* ignore quota */ } }

let state = load();
const listeners = new Set();
function setState(updater) {
  state = typeof updater === 'function' ? updater(state) : { ...state, ...updater };
  save(state);
  listeners.forEach((l) => l());
}
function mutate(fn) { setState((s) => { const n = clone(s); fn(n); return n; }); }
function useStore() {
  const [, force] = useState(0);
  useEffect(() => {
    const l = () => force((x) => x + 1);
    listeners.add(l);
    return () => listeners.delete(l);
  }, []);
  return state;
}
function resetDemo() { localStorage.removeItem(STORAGE_KEY); state = seed(); save(state); listeners.forEach((l) => l()); }

/* toasts */
let toastList = [];
const toastListeners = new Set();
function toast(msg, tone = 'ok') {
  const id = uid('T');
  toastList = [...toastList, { id, msg, tone }];
  toastListeners.forEach((l) => l());
  setTimeout(() => { toastList = toastList.filter((t) => t.id !== id); toastListeners.forEach((l) => l()); }, 3600);
}
function useToasts() {
  const [, f] = useState(0);
  useEffect(() => { const l = () => f((x) => x + 1); toastListeners.add(l); return () => toastListeners.delete(l); }, []);
  return toastList;
}

/* ---------- derived helpers ---------- */
const isPresent = (l) => ['present', 'late', 'released', 'home_confirmed'].includes(l.status);
const awaitingHome = (l) => l.status === 'released' && !l.homeConfirmedAt;
const learnerById = (s, id) => s.learners.find((l) => l.id === id);
const classById = (s, id) => s.classes.find((c) => c.id === id);
const collectorsFor = (s, learnerId) => s.collectors.filter((c) => c.learnerId === learnerId);
const guardianById = (s, id) => s.guardians.find((g) => g.id === id);
const effectiveCollectorStatus = (c) => {
  if (c.status === 'revoked' || c.status === 'pending') return c.status;
  if (c.expiresAt && new Date(c.expiresAt).getTime() < Date.now()) return 'expired';
  return 'approved';
};
const isCollectorUsable = (c) => effectiveCollectorStatus(c) === 'approved';

function stats(s) {
  const active = s.learners.filter((l) => !l.archived);
  return {
    total: active.length,
    present: active.filter(isPresent).length,
    notArrived: active.filter((l) => l.status === 'not_arrived').length,
    atSchool: active.filter((l) => l.status === 'present' || l.status === 'late').length,
    collected: active.filter((l) => l.status === 'released' || l.status === 'home_confirmed').length,
    pendingVerification: s.collectors.filter((c) => c.status === 'pending').length,
    awaitingHome: active.filter(awaitingHome).length,
    incidents: s.incidents.filter((i) => i.status !== 'resolved').length,
    absent: active.filter((l) => l.status === 'absent').length,
    late: active.filter((l) => l.status === 'late').length,
  };
}

/* ---------- actions ---------- */
const STAFF_NAME = (s, id) => (s.staff.find((x) => x.id === id) || { name: 'Staff' }).name;

function addEvent(s, learnerId, type, staffName, detail) {
  s.events.unshift({ id: uid('EV'), learnerId, type, ts: new Date().toISOString(), staff: staffName, detail: detail || '' });
}
function addNotification(s, n) {
  s.notifications.unshift({ id: uid('NT'), ts: new Date().toISOString(), read: false, guardianId: null, learnerId: null, ...n });
}
function actionRecordArrival(learnerId, staffId) {
  const s = state; const l = learnerById(s, learnerId); if (!l) return;
  const late = new Date().toTimeString().slice(0, 5) > s.school.lateCutoff;
  const staff = STAFF_NAME(s, staffId);
  mutate((n) => {
    const le = n.learners.find((x) => x.id === learnerId);
    le.status = late ? 'late' : 'present';
    le.arrivalAt = new Date().toISOString();
    addEvent(n, learnerId, 'arrival', staff, late ? 'Recorded as late arrival' : 'Checked in at main gate');
    addNotification(n, { audience: 'admin', title: `${late ? 'Late arrival' : 'Arrival'} recorded`, body: `${le.name} ${late ? 'arrived late' : 'arrived'} at ${fmtTime(le.arrivalAt)}.`, category: 'attendance', learnerId });
    addNotification(n, { audience: 'teacher', title: `${le.name} checked in`, body: `Recorded by ${staff}.`, category: 'attendance', learnerId });
    le.guardianIds.forEach((gid) => addNotification(n, {
      audience: 'parent', guardianId: gid, title: `${le.name} arrived at school`,
      body: `${le.name} was checked in at ${fmtTime(le.arrivalAt)}.`, category: 'arrival', learnerId,
    }));
  });
  toast(`Arrival recorded for ${l.name}${late ? ' (late)' : ''}`);
}
function actionMarkAbsent(learnerId, reason) {
  mutate((n) => {
    const le = n.learners.find((x) => x.id === learnerId);
    le.status = 'absent';
    addEvent(n, learnerId, 'absent', 'Front office', reason || 'Marked absent');
    addNotification(n, { audience: 'admin', title: 'Absence recorded', body: `${le.name} marked absent today.`, category: 'attendance', learnerId });
  });
  toast('Absence recorded', 'warn');
}
function actionRecordDeparture(learnerId, collectorId, staffId) {
  const s = state;
  const c = s.collectors.find((x) => x.id === collectorId);
  const le = learnerById(s, learnerId);
  if (!c || !le) return;
  if (!isCollectorUsable(c)) { toast('Blocked: collector is not authorized', 'err'); return; }
  const staff = STAFF_NAME(s, staffId);
  mutate((n) => {
    const l2 = n.learners.find((x) => x.id === learnerId);
    l2.status = 'released'; l2.departureAt = new Date().toISOString(); l2.collectorId = collectorId; l2.homeConfirmedAt = null;
    addEvent(n, learnerId, 'departure', staff, `Released to ${c.name} (${c.relationship})`);
    addNotification(n, { audience: 'admin', title: 'Learner released', body: `${l2.name} released to ${c.name} (${c.relationship}) at ${fmtTime(l2.departureAt)}.`, category: 'pickup', learnerId });
    addNotification(n, { audience: 'gate', title: 'Handover recorded', body: `${l2.name} → ${c.name}.`, category: 'pickup', learnerId });
    l2.guardianIds.forEach((gid) => addNotification(n, {
      audience: 'parent', guardianId: gid, title: `${l2.name} has been collected`,
      body: `${l2.name} was released to ${c.name} (${c.relationship}) at ${fmtTime(l2.departureAt)}. Please confirm home arrival.`,
      category: 'pickup', learnerId,
    }));
  });
  toast(`Handover recorded — ${le.name} released to ${c.name}`);
}
function actionConfirmHome(learnerId, guardianId, method = 'Parent confirmation') {
  mutate((n) => {
    const le = n.learners.find((x) => x.id === learnerId);
    le.homeConfirmedAt = new Date().toISOString();
    le.status = 'home_confirmed';
    addEvent(n, learnerId, 'home_arrival', method, method === 'Parent confirmation' ? 'Confirmed by authorized guardian' : 'Confirmed via simulated school transport workflow');
    addNotification(n, { audience: 'admin', title: 'Home arrival confirmed', body: `${le.name} confirmed home at ${fmtTime(le.homeConfirmedAt)}.`, category: 'home', learnerId });
    addNotification(n, { audience: 'teacher', title: 'Home arrival confirmed', body: `${le.name} is safely home.`, category: 'home', learnerId });
    if (guardianId) addNotification(n, { audience: 'parent', guardianId, title: 'Home arrival confirmed', body: `Thank you — ${le.name}’s home arrival was confirmed at ${fmtTime(le.homeConfirmedAt)}.`, category: 'home', learnerId });
  });
  toast('Home arrival confirmed');
}

function StatCard({ label, value, icon, tone = 'teal', hint }) {
  const tones = {
    teal: ['var(--teal-l)', 'var(--teal-d)'], green: ['var(--green-l)', 'var(--green)'],
    amber: ['var(--amber-l)', 'var(--amber)'], red: ['var(--red-l)', 'var(--red)'],
    blue: ['var(--blue-l)', 'var(--blue)'], muted: ['#f1f5f9', '#475569'], purple: ['var(--purple-l)', 'var(--purple)'],
  };
  const [bg, fg] = tones[tone] || tones.teal;
  return html`<div className="stat">
    <div className="stat-top">
      <span className="stat-lbl">${label}</span>
      <span className="stat-ico" style=${{ background: bg, color: fg }}><${Icon} name=${icon} size=${16} /><//>
    </div>
    <div className="stat-val">${value}</div>
    ${hint && html`<div className="xs mut">${hint}</div>`}
  </div>`;
}

function Modal({ title, children, onClose, footer, wide }) {
  useEffect(() => {
    const k = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', k);
    return () => document.removeEventListener('keydown', k);
  }, [onClose]);
  return html`<div className="scrim" onMouseDown=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
    <div className=${cls('modal', wide && 'modal-lg')} role="dialog" aria-modal="true" aria-label=${title}>
      <div className="modal-h"><h3>${title}</h3>
        <button className="icon-btn" onClick=${onClose} aria-label="Close dialog"><${Icon} name="x" /><//></button>
      </div>
      <div className="modal-b">${children}</div>
      ${footer && html`<div className="modal-f">${footer}</div>`}
    </div>
  </div>`;
}

function ConfirmDialog({ title, message, confirmLabel = 'Confirm', tone = 'primary', onConfirm, onClose }) {
  return html`<${Modal} title=${title} onClose=${onClose}
    footer=${html`<${Fragment}>
      <button className="btn" onClick=${onClose}>Cancel</button>
      <button className=${cls('btn', tone === 'danger' ? 'btn-danger' : 'btn-primary')} onClick=${() => { onConfirm(); onClose(); }}>${confirmLabel}</button>
    <//>`}>
    <p className="mut">${message}</p>
  <//>`;
}

function Field({ label, children, hint }) {
  return html`<div className="field">
    <label>${label}</label>
    ${children}
    ${hint && html`<span className="xs mut">${hint}</span>`}
  </div>`;
}
function Empty({ icon = 'info', title, message, action }) {
  return html`<div className="empty">
    <div className="empty-ico"><${Icon} name=${icon} size=${20} /><//>
    <div className="bold" style=${{ color: 'var(--tx)' }}>${title}</div>

  </div>`;
}
function BarChart({ data, height = 150, color = 'var(--teal)' }) {
  const max = Math.max(...data.map((d) => d.value), 1);
  return html`<div className="chart" style=${{ height: height + 'px' }}>
    ${data.map((d, i) => html`<div className="chart-col" key=${i} title=${`${d.label}: ${d.value}`}>
      <div className="chart-val">${d.value}</div>
      <div className="chart-bar" style=${{ height: Math.max(3, (d.value / max) * (height - 42)) + 'px', background: d.color || color }}></div>
      <div className="chart-lbl">${d.label}</div>
    </div>`)}
  </div>`;
}
function ProgressRow({ label, value, total, color = 'var(--teal)' }) {
  const pct = total ? Math.round((value / total) * 100) : 0;
  return html`<div className="bar-line" style=${{ marginBottom: '10px' }}>
    <span style=${{ width: '118px', flex: 'none' }} className="sm">${label}</span>
    <span className="bar-track"><span className="bar-fill" style=${{ width: pct + '%', background: color }}></span></span>
    <span className="sm bold" style=${{ width: '54px', textAlign: 'right' }}>${value}/${total}</span>
  </div>`;
}

        <button className="btn" onClick=${() => setOpen(false)}>Close</button>
        <button className="btn btn-primary" disabled=${!unread} onClick=${() => { mutate((n) => { n.notifications.forEach((x) => { if (x.audience === role && (role !== 'parent' || x.guardianId === gid)) x.read = true; }); }); toast('All notifications marked as read'); }}>Mark all as read</button>

        <${Icon} name="info" size=${17} />

              ${!n.read && html`<button className="btn btn-sm btn-ghost" onClick=${() => mutate((st) => { const t = st.notifications.find((x) => x.id === n.id); if (t) t.read = true; })}>Mark as read</button>`}

  <//>`;

function PageOverview({ role }) {
  const s = useStore();
  const [drawer, setDrawer] = useState(null);
  const [quick, setQuick] = useState(null);
  const st = stats(s);
  const active = s.learners.filter((l) => !l.archived);

  const todayChart = s.history.map((h) => ({ label: new Date(h.date).toLocaleDateString([], { weekday: 'short' }), value: h.present }))
    .concat([{ label: 'Today', value: st.present, color: 'var(--teal-d)' }]);

  const arrivals = s.events.filter((e) => e.type === 'arrival' && isToday(e.ts));
  const departures = s.events.filter((e) => e.type === 'departure' && isToday(e.ts));
  const hours = ['7a', '8a', '9a', '10a', '1p', '2p', '3p'];
  const arrByHour = hours.map((h) => ({ label: h, value: 0 }));
  const depByHour = hours.map((h) => ({ label: h, value: 0 }));
  arrivals.forEach((e) => { const hr = new Date(e.ts).getHours(); const idx = hr <= 7 ? 0 : hr === 8 ? 1 : hr === 9 ? 2 : hr === 10 ? 3 : hr === 13 ? 4 : hr === 14 ? 5 : 6; arrByHour[idx].value++; });
  departures.forEach((e) => { const hr = new Date(e.ts).getHours(); const idx = hr <= 7 ? 0 : hr === 8 ? 1 : hr === 9 ? 2 : hr === 10 ? 3 : hr === 13 ? 4 : hr === 14 ? 5 : 6; depByHour[idx].value++; });

  const recentEvents = s.events.slice(0, 8);
  const recentPickups = s.events.filter((e) => e.type === 'departure').slice(0, 5);
  const attention = active.filter((l) => l.status === 'not_arrived' || awaitingHome(l) || l.status === 'late');
  const openIncidents = s.incidents.filter((i) => i.status !== 'resolved');

  const eventIcon = { arrival: 'login', departure: 'logout', home_arrival: 'houseCheck', absent: 'x' };
  const eventText = { arrival: 'Arrived at school', departure: 'Released to collector', home_arrival: 'Home arrival confirmed', absent: 'Marked absent' };

  return html`<div className="stack">
    ${openIncidents.length > 0 && html`<div className="alert alert-red">
      <${Icon} name="alert" size=${18} />
      <div style=${{ flex: 1 }}>
        <strong>${openIncidents.length} active safety incident${openIncidents.length > 1 ? 's' : ''}</strong>
        ${openIncidents.map((i) => html`<div key=${i.id} className="sm">${i.ref} · ${i.type} · ${(learnerById(s, i.learnerId) || {}).name} — <a href="#/${role}/safety">open Safety Centre</a></div>`)}
      </div>
    </div>`}

    <div className="grid g-auto">
      <${StatCard} label="Active learners" value=${st.total} icon="users" tone="blue" hint="Enrolled and not archived" />
      <${StatCard} label="Present today" value=${st.present} icon="check" tone="green" hint=${`${Math.round((st.present / st.total) * 100)}% attendance`} />
      <${StatCard} label="Not yet arrived" value=${st.notArrived} icon="clock" tone="amber" hint="No arrival recorded" />
      <${StatCard} label="Still at school" value=${st.atSchool} icon="cap" tone="purple" hint="Present, not yet released" />
      <${StatCard} label="Collected" value=${st.collected} icon="logout" tone="teal" hint="Handed over to a collector" />
      <${StatCard} label="Pending pickups" value=${st.pendingVerification} icon="shield" tone="amber" hint="Permissions awaiting review" />
      <${StatCard} label="Unconfirmed home" value=${st.awaitingHome} icon="houseCheck" tone="amber" hint="Released, not confirmed home" />
      <${StatCard} label="Active incidents" value=${st.incidents} icon="alert" tone=${st.incidents ? 'red' : 'green'} hint="Open safety cases" />
    </div>

    <div className="card">
      <div className="card-h"><h3>Quick actions</h3><span className="xs mut">Demo actions update all connected pages</span></div>
      <div className="card-p row wrap" style=${{ gap: '9px' }}>
        <button className="btn btn-primary" onClick=${() => setQuick('arrival')}><${Icon} name="login" size=${15} /> Record arrival</button>
        <button className="btn" onClick=${() => go('/' + role + '/pickup')}><${Icon} name="shield" size=${15} /> Verify pickup</button>
        <button className="btn" onClick=${() => go('/' + role + '/learners')}><${Icon} name="userPlus" size=${15} /> Register learner</button>
        <button className="btn" onClick=${() => go('/' + role + '/communication')}><${Icon} name="megaphone" size=${15} /> Send announcement</button>
        <button className="btn" onClick=${() => go('/' + role + '/safety')}><${Icon} name="alert" size=${15} /> Report incident</button>
      </div>
    </div>

    <div className="grid g-2">
      <div className="card">
        <div className="card-h"><h3>Daily attendance — last 7 days</h3><${Badge} tone="teal">Present<//></div>
        <div className="card-p"><${BarChart} data=${todayChart} /></div>
      </div>
      <div className="card">
        <div className="card-h"><h3>Arrivals vs departures today</h3>
          <div className="row xs mut" style=${{ gap: '10px' }}>
            <span className="row" style=${{ gap: '5px' }}><span className="dot" style=${{ color: 'var(--teal)' }}></span>Arrivals</span>
            <span className="row" style=${{ gap: '5px' }}><span className="dot" style=${{ color: 'var(--blue)' }}></span>Departures</span>
          </div>
        </div>
        <div className="card-p row" style=${{ gap: '14px' }}>
          <div style=${{ flex: 1 }}><${BarChart} data=${arrByHour} color="var(--teal)" height=${130} /></div>
          <div style=${{ flex: 1 }}><${BarChart} data=${depByHour} color="var(--blue)" height=${130} /></div>
        </div>
      </div>
    </div>

    <div className="grid g-2-1">
      <div className="card">
        <div className="card-h"><h3>Live learner activity</h3><span className="xs mut">Simulated event feed</span></div>
        <div className="card-p">
          ${recentEvents.length === 0 ? html`<${Empty} icon="clock" title="No activity yet today" />` : html`
            <div className="timeline">
              ${recentEvents.map((e) => {
                const l = learnerById(s, e.learnerId);
                return html`<div className="tl-item" key=${e.id}>
                  <div className="tl-ico"><${Icon} name=${eventIcon[e.type] || 'clock'} size=${13} /><//>
                  <div className="tl-body">
                    <div className="tl-title"><a href="#" onClick=${(ev) => { ev.preventDefault(); setDrawer(e.learnerId); }}>${l ? l.name : 'Unknown'}</a> — ${eventText[e.type] || e.type}</div>
                    <div className="tl-meta">${fmtTime(e.ts)} · ${e.staff}${e.detail ? ' · ' + e.detail : ''}</div>
                  </div>
                </div>`;
              })}
            </div>`}
        </div>
      </div>

      <div className="stack">
        <div className="card">
          <div className="card-h"><h3>Class attendance</h3></div>
          <div className="card-p">
            ${s.classes.map((c) => {
              const members = active.filter((l) => l.classId === c.id);
              const present = members.filter(isPresent).length;
              return html`<${ProgressRow} key=${c.id} label=${c.name} value=${present} total=${members.length} />`;
            })}
          </div>
        </div>
        <div className="card">
          <div className="card-h"><h3>Needs attention</h3><${Badge} tone=${attention.length ? 'amber' : 'green'}>${attention.length}<//></div>
          <div className="card-p stack" style=${{ gap: '8px', maxHeight: '280px', overflowY: 'auto' }}>
            ${attention.length === 0 ? html`<${Empty} icon="check" title="Nothing outstanding" message="All learners accounted for." />` : attention.map((l) => html`
              <button key=${l.id} className="btn btn-ghost" style=${{ justifyContent: 'flex-start', padding: '8px', width: '100%' }} onClick=${() => setDrawer(l.id)}>
                <${Avatar} name=${l.name} size="sm" />
                <span style=${{ flex: 1, textAlign: 'left' }}>
                  <span className="sm bold" style=${{ display: 'block' }}>${l.name}</span>
                  <span className="xs mut">${awaitingHome(l) ? 'Awaiting home confirmation' : l.status === 'late' ? 'Late arrival' : 'Not yet arrived'}</span>
                </span>
                <${Icon} name="chevR" size=${15} />
              </button>`)}
          </div>
        </div>
      </div>
    </div>

    <div className="card">
      <div className="card-h"><h3>Recent pickup records</h3><a href="#/${role}/pickup" className="sm">Open pickup verification →</a></div>
      <div className="tbl-wrap">
        <table className="tbl">
          <thead><tr><th>Learner</th><th>Collector</th><th>Relationship</th><th>Time</th><th>Recorded by</th><th>Home arrival</th></tr></thead>
          <tbody>
            ${recentPickups.length === 0 ? html`<tr><td colSpan="6"><${Empty} icon="logout" title="No pickups recorded today" /></td></tr>` : recentPickups.map((e) => {
              const l = learnerById(s, e.learnerId); const k = l && l.collectorId ? s.collectors.find((x) => x.id === l.collectorId) : null;
              return html`<tr key=${e.id} className="clickable" onClick=${() => setDrawer(e.learnerId)}>
                <td><div className="row"><${Avatar} name=${l ? l.name : '?'} size="sm" /><span className="bold">${l ? l.name : '—'}</span></div></td>
                <td>${k ? k.name : '—'}</td>
                <td>${k ? k.relationship : '—'}</td>
                <td>${fmtTime(e.ts)}</td>
                <td className="mut">${e.staff}</td>
                <td>${l && l.homeConfirmedAt ? html`<${Badge} tone="green" dot>Confirmed ${fmtTime(l.homeConfirmedAt)}<//>` : html`<${Badge} tone="amber" dot>Pending<//>`}</td>
              </tr>`;
            })}
          </tbody>
        </table>
      </div>
    </div>

    ${drawer && html`<${LearnerDrawer} learnerId=${drawer} onClose=${() => setDrawer(null)} role=${role} />`}
    ${quick === 'arrival' && html`<${ArrivalModal} onClose=${() => setQuick(null)} role=${role} />`}

function AddLearnerModal({ onClose }) {
  const s = useStore();
  const [form, setForm] = useState({ name: '', classId: s.classes[0].id, guardianName: '', relationship: 'Mother', phone: '', notes: '' });
  const [err, setErr] = useState({});
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

  function submit(e) {
    e.preventDefault();
    const errs = {};
    if (form.name.trim().length < 3) errs.name = 'Please enter the learner’s full name.';
    if (!form.guardianName.trim()) errs.guardianName = 'A parent or guardian contact is required.';
    if (!/^[+\d][\d\s-]{6,}$/.test(form.phone.trim())) errs.phone = 'Enter a fictional demo phone number, e.g. +254 700 000 123.';
    setErr(errs);
    if (Object.keys(errs).length) return;

    const newId = 'L-' + (1000 + s.learners.length + 1);
    const gId = 'G-' + String(s.guardians.length + 1).padStart(2, '0');
    mutate((n) => {
      n.guardians.push({ id: gId, name: form.guardianName, relationship: form.relationship, phone: form.phone, email: 'demo@example.com', learnerIds: [newId], verified: false, notify: { arrival: true, departure: true, home: true, announcements: true, safety: true } });
      n.learners.push({ id: newId, name: form.name, classId: form.classId, guardianIds: [gId], dob: '2021-01-01', gender: '—', status: 'not_arrived', arrivalAt: null, departureAt: null, collectorId: null, homeConfirmedAt: null, archived: false, notes: form.notes, allergies: 'None recorded' });
      n.collectors.push({ id: uid('K'), learnerId: newId, name: form.guardianName, relationship: form.relationship, type: 'Parent', status: 'approved', demoPin: String(1000 + Math.floor(Math.random() * 8999)), expiresAt: null, phone: form.phone });
    });
    toast(`${form.name} registered as ${newId}`);
    onClose();
  }

  return html`<${Modal} title="Register a new learner" onClose=${onClose}
    footer=${html`<${Fragment}>
      <button className="btn" onClick=${onClose}>Cancel</button>
      <button className="btn btn-primary" form="addLearner" type="submit">Register learner</button>
    <//>`}>
    <form id="addLearner" onSubmit=${submit} className="stack" style=${{ gap: '13px' }}>
      <div className="alert alert-amber"><${Icon} name="alert" size=${16} /><div>Use fictional details only. This prototype stores data in your browser.</div></div>
      <${Field} label="Learner full name" hint=${err.name}>
        <input className="input" value=${form.name} onInput=${set('name')} placeholder="e.g. Amani Wekesa" />
      <//>
      <${Field} label="Class">
        <select className="input" value=${form.classId} onChange=${set('classId')}>
          ${s.classes.map((c) => html`<option key=${c.id} value=${c.id}>${c.name} · ${c.level}</option>`)}
        </select>
      <//>
      <div className="grid g-2">
        <${Field} label="Parent / guardian name" hint=${err.guardianName}>
          <input className="input" value=${form.guardianName} onInput=${set('guardianName')} placeholder="e.g. Grace Omondi" />
        <//>
        <${Field} label="Relationship">
          <select className="input" value=${form.relationship} onChange=${set('relationship')}>
            ${['Mother', 'Father', 'Guardian', 'Grandparent', 'Nanny', 'Other'].map((r) => html`<option key=${r} value=${r}>${r}</option>`)}
          </select>
        <//>
      </div>
      <${Field} label="Contact phone (fictional)" hint=${err.phone}>
        <input className="input" value=${form.phone} onInput=${set('phone')} placeholder="+254 700 000 123" />
      <//>
      <${Field} label="Notes (optional)">
        <textarea className="input" value=${form.notes} onInput=${set('notes')} placeholder="Allergies, medical notes or safeguarding remarks"></textarea>
      <//>
    </form>
  <//>`;
}

function PagePickup({ role }) {
  const s = useStore();
  const [step, setStep] = useState(1);
  const [q, setQ] = useState('');
  const [learnerId, setLearnerId] = useState(null);
  const [collectorId, setCollectorId] = useState(null);
  const [pin, setPin] = useState('');
  const [result, setResult] = useState(null);
  const [staffId, setStaffId] = useState(s.staff[6].id);
  const [confirmOpen, setConfirmOpen] = useState(false);

  const candidates = s.learners.filter((l) => !l.archived && (l.name.toLowerCase().includes(q.toLowerCase()) || l.id.toLowerCase().includes(q.toLowerCase())));
  const learner = learnerId ? learnerById(s, learnerId) : null;
  const collectors = learner ? collectorsFor(s, learner.id) : [];
  const collector = collectorId ? s.collectors.find((c) => c.id === collectorId) : null;

  function reset() { setStep(1); setLearnerId(null); setCollectorId(null); setPin(''); setResult(null); setQ(''); }

  function verify() {
    if (!collector) return;
    const st = effectiveCollectorStatus(collector);
    if (st !== 'approved') {
      setResult({ ok: false, reason: st === 'pending' ? 'This collector’s authorization is still pending school approval.' : st === 'revoked' ? 'This collector’s permission has been revoked by the school.' : 'This collector’s temporary authorization has expired.' });
      return;
    }
    if (s.settings.requirePin && pin.trim() !== collector.demoPin) {
      setResult({ ok: false, reason: 'The demo PIN entered does not match the PIN on record for this collector.' });
      return;
    }
    setResult({ ok: true });
  }

  function simulateQr() {
    if (!collector) return;
    if (effectiveCollectorStatus(collector) !== 'approved') { verify(); return; }
    setPin(collector.demoPin);
    setResult({ ok: true });
    toast('Demo QR scan simulated — this is not real identity verification', 'warn');
  }

  function recordHandover() {
    actionRecordDeparture(learner.id, collector.id, staffId);
    reset();
  }

  return html`<div className="stack">
    <div className="alert alert-blue">
      <${Icon} name="shield" size=${18} />
      <div><strong>Gate verification workflow — simulated</strong>A learner is never released just because someone knows their name. Every handover requires a registered authorized collector and a matching demo PIN or simulated QR scan.</div>
    </div>

    <div className="card">
      <div className="card-h">
        <h3>Pickup verification</h3>
        <div className="row xs" style=${{ gap: '6px' }}>
          ${[1, 2, 3].map((n) => html`<span key=${n} className=${cls('badge', step >= n ? 'b-teal' : 'b-muted')}>Step ${n}<//>`)}
          <button className="btn btn-sm btn-ghost" onClick=${reset}><${Icon} name="refresh" size=${13} /> Reset</button>
        </div>
      </div>
      <div className="card-p">
        ${step === 1 && html`<div>
          <${Field} label="1 · Search for the learner">
            <input className="input" autoFocus placeholder="Type a learner name or learner ID…" value=${q} onInput=${(e) => setQ(e.target.value)} aria-label="Search learner for pickup" />
          <//>
          <div className="mt16 stack" style=${{ gap: '8px', maxHeight: '360px', overflowY: 'auto' }}>
            ${candidates.length === 0 ? html`<${Empty} icon="search" title="No learners found" message="Check the spelling or search using the learner ID." />` : candidates.map((l) => html`
              <button key=${l.id} className="btn" style=${{ justifyContent: 'flex-start', width: '100%', padding: '11px' }}
                onClick=${() => { setLearnerId(l.id); setStep(2); }}>
                <${Avatar} name=${l.name} size="sm" />
                <span style=${{ flex: 1, textAlign: 'left' }}>
                  <span className="bold" style=${{ display: 'block' }}>${l.name}</span>
                  <span className="xs mut">${l.id} · ${(classById(s, l.classId) || {}).name}</span>
                </span>
                <${StatusBadge} status=${l.status} />
                <${Icon} name="chevR" size=${15} />
              </button>`)}
          </div>
        </div>`}

        ${step >= 2 && learner && html`<div className="stack" style=${{ gap: '16px' }}>
          <div className="card card-p" style=${{ background: '#f8fafc' }}>
            <div className="row">
              <${Avatar} name=${learner.name} size="lg" />
              <div style=${{ flex: 1 }}>
                <h3>${learner.name}</h3>
                <div className="sm mut">${learner.id} · ${(classById(s, learner.classId) || {}).name} · ${(classById(s, learner.classId) || {}).level}</div>

function InviteParentModal({ onClose }) {
  const s = useStore();
  const [form, setForm] = useState({ name: '', relationship: 'Mother', phone: '', email: '', learnerId: s.learners[0].id });
  const [err, setErr] = useState({});
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  function submit(e) {
    e.preventDefault();
    const errs = {};
    if (form.name.trim().length < 3) errs.name = 'Enter the guardian’s full name.';
    if (!/^[+\d][\d\s-]{6,}$/.test(form.phone)) errs.phone = 'Enter a fictional phone number.';
    if (!/^\S+@\S+\.\S+$/.test(form.email)) errs.email = 'Enter a valid demo email address.';
    setErr(errs);
    if (Object.keys(errs).length) return;
    mutate((n) => {
      n.guardians.push({ id: 'G-' + String(n.guardians.length + 1).padStart(2, '0'), name: form.name, relationship: form.relationship, phone: form.phone, email: form.email, learnerIds: [form.learnerId], verified: false, notify: { arrival: true, departure: true, home: true, announcements: true, safety: true } });
      const l = n.learners.find((x) => x.id === form.learnerId);
      if (l) l.guardianIds.push('G-' + String(n.guardians.length).padStart(2, '0'));
    });
    toast(`Invitation prepared for ${form.name} (simulated — no email is sent)`, 'warn');
    onClose();
  }
  return html`<${Modal} title="Invite a parent or guardian" onClose=${onClose}
    footer=${html`<${Fragment}><button className="btn" onClick=${onClose}>Cancel</button><button className="btn btn-primary" type="submit" form="inviteForm">Send invitation</button><//>`}>
    <form id="inviteForm" onSubmit=${submit} className="stack" style=${{ gap: '13px' }}>
      <div className="alert alert-amber"><${Icon} name="info" size=${16} /><div>No real email or SMS is sent. This records a demo invitation in your browser only.</div></div>
      <${Field} label="Guardian name" hint=${err.name}><input className="input" value=${form.name} onInput=${set('name')} placeholder="e.g. Grace Omondi" /><//>
      <div className="grid g-2">
        <${Field} label="Relationship">
          <select className="input" value=${form.relationship} onChange=${set('relationship')}>
            ${['Mother', 'Father', 'Guardian', 'Grandparent', 'Nanny', 'Other'].map((r) => html`<option key=${r} value=${r}>${r}</option>`)}
          </select>
        <//>
        <${Field} label="Linked learner">
          <select className="input" value=${form.learnerId} onChange=${set('learnerId')}>
            ${s.learners.filter((l) => !l.archived).map((l) => html`<option key=${l.id} value=${l.id}>${l.name}</option>`)}
          </select>
        <//>
      </div>
      <${Field} label="Phone" hint=${err.phone}><input className="input" value=${form.phone} onInput=${set('phone')} placeholder="+254 700 000 123" /><//>
      <${Field} label="Email" hint=${err.email}><input className="input" value=${form.email} onInput=${set('email')} placeholder="parent@example.com" /><//>
    </form>
  <//>`;
}

function PageCommunication({ role }) {
  const s = useStore();
  const [tab, setTab] = useState('compose');
  const [form, setForm] = useState({ subject: '', body: '', audience: 'All school families', priority: 'normal' });
  const [published, setPublished] = useState(null);

  function publish(status) {
    if (!form.subject.trim() || !form.body.trim()) { toast('Subject and message body are required', 'err'); return; }
    const id = uid('AN');
    mutate((n) => {
      n.announcements.unshift({
        id, subject: form.subject, body: form.body, audience: form.audience, priority: form.priority,
        status, createdAt: new Date().toISOString(), publishAt: status === 'published' ? new Date().toISOString() : null,
        readBy: [], ackBy: [],
      });
      if (status === 'published') {
        const targets = form.audience === 'All school families'
          ? n.guardians
          : n.guardians.filter((g) => g.learnerIds.some((lid) => {
              const l = n.learners.find((x) => x.id === lid);
              return l && form.audience.includes((n.classes.find((c) => c.id === l.classId) || {}).name);
            }));
        targets.forEach((g) => addNotification(n, {
          audience: 'parent', guardianId: g.id, title: form.subject,
          body: form.body.slice(0, 130) + (form.body.length > 130 ? '…' : ''), category: 'announcement',
        }));
      }
    });
    if (status === 'published') toast(`Announcement published to ${form.audience}`);
    else toast('Draft saved');
    setForm({ subject: '', body: '', audience: 'All school families', priority: 'normal' });
  }

  return html`<div className="stack">
    <div className="alert alert-blue">
      <${Icon} name="info" size=${18} />
      <div><strong>Delivery is simulated</strong>Published announcements appear immediately in the demo parent portal and notification centre. No SMS, WhatsApp, email or push messages are actually sent.</div>
    </div>

    <div className="card">
      <div className="tabs">

function PageSafety({ role }) {

  const [reportOpen, setReportOpen] = useState(false);

      <div><strong>Active safety incident — ${active[0].ref}</strong>
        ${active.map((i) => html`<div key=${i.id} className="sm">${i.type} · ${(learnerById(s, i.learnerId) || {}).name} · assigned to ${i.assignedTo || 'unassigned'}</div>`)}

    <div className="grid g-3">

      <div className="card-h">
        <h3>Emergency actions</h3>
        <span className="xs mut">Restricted to authorized staff in a real deployment</span>
      </div>
      <div className="card-p row wrap" style=${{ gap: '10px' }}>
        <button className="btn btn-danger" onClick=${() => setMissingOpen(true)}><${Icon} name="alert" size=${15} /> Report missing learner</button>
        <button className="btn" onClick=${() => setReportOpen(true)}><${Icon} name="file" size=${15} /> Report an incident</button>

    <div className="card">
      <div className="card-h"><h3>Incident register</h3><span className="xs mut">${incidents.length} records</span></div>
      <div className="tbl-wrap"><table className="tbl">
        <thead><tr><th>Ref</th><th>Learner</th><th>Type</th><th>Severity</th><th>Status</th><th>Assigned to</th><th>Opened</th><th className="right"></th></tr></thead>

          return html`<tr key=${i.id}>
            <td className="bold">${i.ref}</td>
            <td>${l ? l.name : '—'}</td>
            <td>${i.type}</td>
            <td><${Badge} tone=${i.severity === 'high' ? 'red' : i.severity === 'medium' ? 'amber' : 'muted'}>${i.severity}<//></td>
            <td><${Badge} tone=${i.status === 'resolved' ? 'green' : 'red'} dot>${i.status}<//></td>
            <td className="mut">${i.assignedTo || 'Unassigned'}</td>
            <td className="mut xs">${fmtDT(i.openedAt)}</td>

          <${Badge} tone=${inc.severity === 'high' ? 'red' : 'amber'}>${inc.severity} severity<//>
        </div>
        <div className="kv"><span>Learner</span><span className="bold">${(learnerById(s, inc.learnerId) || {}).name} (${inc.learnerId})</span></div>
        <div className="kv"><span>Class</span><span>${(classById(s, (learnerById(s, inc.learnerId) || {}).classId) || {}).name}</span></div>

            ${inc.actions.map((a, i) => html`<div className="tl-item" key=${i}>
              <div className="tl-ico"><${Icon} name="check" size=${12} /><//>
              <div className="tl-body"><div className="tl-title">${a.text}</div><div className="tl-meta">${a.by} · ${fmtDT(a.ts)}</div></div>
            </div>`)}

        ${inc.status !== 'resolved' && html`<div>

            <textarea className="input" value=${update} onInput=${(e) => setUpdate(e.target.value)} placeholder="e.g. Checked the playground and art room with two staff members."></textarea>
          <//>
          <button className="btn btn-primary mt8" onClick=${() => { if (!update.trim()) return; mutate((n) => { const x = n.incidents.find((y) => y.id === inc.id); x.actions.push({ ts: new Date().toISOString(), by: STAFF_NAME(s, s.session.staffId), text: update }); }); setUpdate(''); toast('Incident update recorded'); }}>Add update</button>
        </div>`}
        <div>
          <h4 className="mut" style=${{ marginBottom: '8px' }}>Parent notification preview (simulated)</h4>
          <div className="card card-p" style=${{ background: '#f8fafc' }}>
            <div className="sm bold">To: ${(guardianById(s, (learnerById(s, inc.learnerId) || {}).guardianIds?.[0]) || {}).name || 'Registered guardian'}</div>
            <div className="sm mt8">${inc.type === 'Missing learner'
              ? `${(learnerById(s, inc.learnerId) || {}).name} has not been seen since the last recorded event. We have begun our safeguarding procedure and will call you on the number on file. Please do not come to the gate until we confirm.`

            <div className="xs mut mt8">This preview is not sent. In a real deployment the office would contact the guardian by phone first.</div>
          </div>
        </div>
      </div>
    <//>`}

    ${reportOpen && html`<${ReportIncidentModal} onClose=${() => setReportOpen(false)} />`}
    ${missingOpen && html`<${MissingLearnerModal} onClose=${() => setMissingOpen(false)} onCreated=${(id) => setSelected(id)} />`}
  </div>`;
}

function ReportIncidentModal({ onClose }) {
  const s = useStore();
  const [form, setForm] = useState({ learnerId: s.learners[0].id, type: 'Unauthorized pickup attempt', severity: 'medium', summary: '', assignedTo: s.staff[0].name });
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  return html`<${Modal} title="Report a safety incident" onClose=${onClose}
    footer=${html`<${Fragment}><button className="btn" onClick=${onClose}>Cancel</button><button className="btn btn-primary" form="incForm" type="submit">Create incident</button><//>`}>
    <form id="incForm" className="stack" style=${{ gap: '13px' }} onSubmit=${(e) => {
      e.preventDefault();
      if (form.summary.trim().length < 10) { toast('Please describe the incident in at least 10 characters', 'err'); return; }
      const ref = 'SAF-' + Math.floor(2100 + Math.random() * 800);
      mutate((n) => {
        n.incidents.unshift({
          id: 'INC-' + Math.floor(2100 + Math.random() * 800), ref, learnerId: form.learnerId, type: form.type,
          severity: form.severity, status: 'investigating', reportedBy: 'Demo staff member', assignedTo: form.assignedTo,
          openedAt: new Date().toISOString(), resolvedAt: null,
          locationInfo: 'No live location available — this prototype does not track learners by GPS.',
          summary: form.summary,
          actions: [{ ts: new Date().toISOString(), by: 'Demo staff member', text: 'Incident opened and logged in the safety register.' }],
        });
        addNotification(n, { audience: 'admin', title: 'New safety incident', body: `${form.type} involving ${(n.learners.find((l) => l.id === form.learnerId) || {}).name}.`, category: 'safety', learnerId: form.learnerId });
      });
      toast('Incident created and logged');
      onClose();
    }}>
      <div className="alert alert-amber"><${Icon} name="alert" size=${16} /><div>Creating an incident does <strong>not</strong> contact emergency services. Follow your school’s safeguarding procedure.</div></div>
      <${Field} label="Learner">
        <select className="input" value=${form.learnerId} onChange=${set('learnerId')}>
          ${s.learners.filter((l) => !l.archived).map((l) => html`<option key=${l.id} value=${l.id}>${l.name} — ${l.id}</option>`)}
        </select>
      <//>
      <div className="grid g-2">
        <${Field} label="Incident type">
          <select className="input" value=${form.type} onChange=${set('type')}>
            ${['Unauthorized pickup attempt', 'Missing learner', 'Late collection', 'Medical concern', 'Gate security concern', 'Other'].map((t) => html`<option key=${t}>${t}</option>`)}
          </select>
        <//>
        <${Field} label="Severity">
          <select className="input" value=${form.severity} onChange=${set('severity')}>
            ${['low', 'medium', 'high'].map((t) => html`<option key=${t} value=${t}>${t}</option>`)}
          </select>
        <//>
      </div>
      <${Field} label="Assigned incident lead">
        <select className="input" value=${form.assignedTo} onChange=${set('assignedTo')}>
          ${s.staff.map((x) => html`<option key=${x.id} value=${x.name}>${x.name} — ${x.title}</option>`)}
        </select>
      <//>
      <${Field} label="What happened?"><textarea className="input" value=${form.summary} onInput=${set('summary')} placeholder="Describe what happened, who was involved and what action was taken."></textarea><//>
    </form>
  <//>`;
}

      <div className="row"><${Avatar} name=${l.name} />

      </div>
      <div className="hr"></div>
      <div className="kv"><span>Last recorded event</span><span>${lastEvent ? `${lastEvent.type.replace('_', ' ')} at ${fmtTime(lastEvent.ts)}` : 'No event recorded today'}</span></div>
      <div className="kv"><span>Attendance status</span><span>${(LEARNER_STATUS[l.status] || {}).label}</span></div>
      <div className="kv"><span>Registered guardian</span><span>${(guardianById(s, l.guardianIds[0]) || {}).name} · ${(guardianById(s, l.guardianIds[0]) || {}).phone}</span></div>

/* ---------- REPORTS ---------- */
const REPORTS = {
  attendance: { label: 'Daily attendance', icon: 'calendar' },
  late: { label: 'Late arrivals', icon: 'clock' },
  absences: { label: 'Absences', icon: 'x' },
  early: { label: 'Early departures', icon: 'logout' },
  pickup: { label: 'Pickup verification', icon: 'shield' },
  unauthorised: { label: 'Unauthorized pickup attempts', icon: 'alert' },
  home: { label: 'Home-arrival confirmation', icon: 'houseCheck' },
  notifications: { label: 'Parent notification history', icon: 'bell' },
  incidents: { label: 'Safety incidents', icon: 'alert' },
};

function PageReports() {
  const s = useStore();
  const [type, setType] = useState('attendance');
  const [clsF, setClsF] = useState('all');
  const active = s.learners.filter((l) => !l.archived).filter((l) => clsF === 'all' || l.classId === clsF);

  const rows = useMemo(() => {
    switch (type) {
      case 'attendance': return active.map((l) => [l.id, l.name, (classById(s, l.classId) || {}).name, (LEARNER_STATUS[l.status] || {}).label, fmtTime(l.arrivalAt), fmtTime(l.departureAt)]);
      case 'late': return active.filter((l) => l.status === 'late').map((l) => [l.id, l.name, (classById(s, l.classId) || {}).name, fmtTime(l.arrivalAt), `After ${s.school.lateCutoff}`]);
      case 'absences': return active.filter((l) => l.status === 'absent').map((l) => [l.id, l.name, (classById(s, l.classId) || {}).name, 'Absent today', (guardianById(s, l.guardianIds[0]) || {}).name]);
      case 'early': return s.events.filter((e) => e.type === 'departure' && new Date(e.ts).getHours() < 15).map((e) => [(learnerById(s, e.learnerId) || {}).id, (learnerById(s, e.learnerId) || {}).name, fmtTime(e.ts), e.staff]);
      case 'pickup': return s.events.filter((e) => e.type === 'departure').map((e) => {
        const l = learnerById(s, e.learnerId) || {}; const k = s.collectors.find((x) => x.id === l.collectorId) || {};
        return [l.id, l.name, k.name || '—', k.relationship || '—', fmtTime(e.ts), e.staff];
      });
      case 'unauthorised': return s.incidents.filter((i) => i.type === 'Unauthorized pickup attempt').map((i) => [i.ref, (learnerById(s, i.learnerId) || {}).name, fmtDT(i.openedAt), i.status, i.assignedTo]);
      case 'home': return active.filter((l) => l.departureAt).map((l) => [l.id, l.name, fmtTime(l.departureAt), l.homeConfirmedAt ? fmtTime(l.homeConfirmedAt) : 'Not confirmed', l.homeConfirmedAt ? 'Confirmed' : 'Awaiting']);
      case 'notifications': return s.notifications.filter((n) => n.audience === 'parent').map((n) => [relTime(n.ts), (guardianById(s, n.guardianId) || {}).name || '—', n.title, n.category, n.read ? 'Read' : 'Unread']);
      case 'incidents': return s.incidents.map((i) => [i.ref, i.type, (learnerById(s, i.learnerId) || {}).name, i.severity, i.status, fmtDT(i.openedAt), i.assignedTo || 'Unassigned']);
      default: return [];
    }
  }, [type, clsF, s]);

  const HEADERS = {
    attendance: ['Learner ID', 'Name', 'Class', 'Status', 'Arrival', 'Departure'],
    late: ['Learner ID', 'Name', 'Class', 'Arrival time', 'Note'],
    absences: ['Learner ID', 'Name', 'Class', 'Reason', 'Guardian'],
    early: ['Learner ID', 'Name', 'Departure time', 'Recorded by'],
    pickup: ['Learner ID', 'Name', 'Collector', 'Relationship', 'Time', 'Recorded by'],
    unauthorised: ['Reference', 'Learner', 'Date/time', 'Status', 'Assigned to'],
    home: ['Learner ID', 'Name', 'Released at', 'Confirmed at', 'Status'],
    notifications: ['When', 'Guardian', 'Message', 'Category', 'Read state'],
    incidents: ['Reference', 'Type', 'Learner', 'Severity', 'Status', 'Opened', 'Assigned to'],
  };

  return html`<div className="stack">
    <div className="card">
      <div className="card-p row wrap" style=${{ gap: '10px' }}>
        <select className="input" style=${{ width: 'auto' }} value=${type} onChange=${(e) => setType(e.target.value)} aria-label="Select report">
          ${Object.entries(REPORTS).map(([k, v]) => html`<option key=${k} value=${k}>${v.label}</option>`)}
        </select>
        <select className="input" style=${{ width: 'auto' }} value=${clsF} onChange=${(e) => setClsF(e.target.value)} aria-label="Filter by class">
          <option value="all">All classes</option>${s.classes.map((c) => html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}
        </select>

  return html`<div className="stack">

      <div className="card-p stack" style=${{ gap: '9px' }}>
        ${collectors.length === 0 ? html`<${Empty} icon="shield" title="No collectors registered" />` : collectors.map((k) => html`<div key=${k.id} style=${{ border: '1px solid var(--bd)', borderRadius: '12px', padding: '12px' }}>
          <div className="row">
            <${Avatar} name=${k.name} />
            <div style=${{ flex: 1 }}>
              <div className="bold sm">${k.name}</div>

          </div>
        </div>`)}
      </div>
    </div>

    <div className="row wrap" style=${{ gap: '10px' }}>
      <button className="btn btn-primary" onClick=${() => setAddOpen(true)}><${Icon} name="userPlus" size=${15} /> Propose a new collector</button>

    </div>

    ${addOpen && html`<${Modal} title="Propose a new collector" onClose=${() => setAddOpen(false)}
      footer=${html`<${Fragment}><button className="btn" onClick=${() => setAddOpen(false)}>Cancel</button><button className="btn btn-primary" form="propForm" type="submit">Submit for approval</button><//>`}>
      <form id="propForm" className="stack" style=${{ gap: '12px' }} onSubmit=${(e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const name = String(fd.get('name') || '').trim();
        if (name.length < 3) { toast('Please enter the collector’s full name', 'err'); return; }
        mutate((n) => {
          n.collectors.push({ id: uid('K'), learnerId: child.id, name, relationship: fd.get('relationship'), type: 'Other', status: 'pending', demoPin: String(1000 + Math.floor(Math.random() * 8999)), expiresAt: new Date(Date.now() + s.settings.tempExpiryDays * 86400000).toISOString(), phone: String(fd.get('phone') || '') });
          addNotification(n, { audience: 'admin', title: 'New collector proposed', body: `${guardian.name} proposed ${name} as a collector for ${child.name}.`, category: 'pickup', learnerId: child.id });
        });
        toast('Collector submitted for school approval');
        setAddOpen(false);
      }}>
        <div className="alert alert-amber"><${Icon} name="info" size=${16} /><div>The school office reviews every request. A proposed collector cannot collect your child until it is approved.</div></div>
        <${Field} label="Collector’s full name"><input className="input" name="name" placeholder="e.g. Mary Wanjala" /><//>
        <${Field} label="Relationship to the child">
          <select className="input" name="relationship">
            ${['Grandparent', 'Nanny', 'Uncle', 'Aunt', 'Family friend', 'School transport', 'Other'].map((r) => html`<option key=${r}>${r}</option>`)}
          </select>
        <//>
        <${Field} label="Contact phone (fictional)"><input className="input" name="phone" placeholder="+254 700 000 123" /><//>
      </form>
    <//>`}

    ${tempOpen && html`<${Modal} title="Request temporary pickup permission" onClose=${() => setTempOpen(false)}
      footer=${html`<${Fragment}><button className="btn" onClick=${() => setTempOpen(false)}>Cancel</button><button className="btn btn-primary" form="tempForm" type="submit">Send request</button><//>`}>
      <form id="tempForm" className="stack" style=${{ gap: '12px' }} onSubmit=${(e) => {

        const date = String(fd.get('date') || '');
        if (name.length < 3 || !date) { toast('Please provide a name and an expiry date', 'err'); return; }
        mutate((n) => {
          n.collectors.push({ id: uid('K'), learnerId: child.id, name, relationship: fd.get('relationship'), type: 'Temporary', status: 'pending', demoPin: String(1000 + Math.floor(Math.random() * 8999)), expiresAt: new Date(date).toISOString(), phone: String(fd.get('phone') || '') });
          addNotification(n, { audience: 'admin', title: 'Temporary pickup requested', body: `${guardian.name} requested temporary pickup for ${child.name} by ${name}.`, category: 'pickup', learnerId: child.id });

        toast('Temporary pickup request submitted');
        setTempOpen(false);

        <div className="alert alert-amber"><${Icon} name="info" size=${16} /><div>Temporary authorization is valid only until the expiry date and must be approved by the school office.</div></div>

        <${Field} label="Relationship">
          <select className="input" name="relationship">${['Grandparent', 'Nanny', 'Uncle', 'Aunt', 'Family friend', 'Other'].map((r) => html`<option key=${r}>${r}</option>`)}</select>

        <${Field} label="Valid until"><input className="input" type="date" name="date" /><//>
        <${Field} label="Contact phone (fictional)"><input className="input" name="phone" /><//>
      </form>
    <//>`}

    ${revoke && html`<${ConfirmDialog} title="Request collector removal" tone="danger" confirmLabel="Send request"

      onConfirm=${() => {

              ${it.id === 'safety' && st.incidents > 0 && html`<span className="badge b-red badge-dot" style=${{ marginLeft: 'auto', padding: '1px 7px' }}>${st.incidents}</span>`}
              ${it.id === 'home' && st.awaitingHome > 0 && html`<span className="badge b-amber badge-dot" style=${{ marginLeft: 'auto', padding: '1px 7px' }}>${st.awaitingHome}</span>`}
            </a>`)}
      </nav>
      <div className="side-foot">
        <div className="row" style=${{ gap: '8px', marginBottom: '6px' }}><span className="demo-badge"><${Icon} name="info" size=${11} /> Demo</span></div>
        Simulated data in your browser only. No messages, calls or tracking are real.
      </div>
    </aside>
    <div className="main">
      <${Topbar} title=${t} subtitle=${sub} onMenu=${() => setOpen(!open)} />
      <main className="content">${children}</main>
    </div>
  </div>`;
}

function App() {
  const s = useStore();
  const toasts = useToasts();
  const path = useHashRoute();
  const { role, page } = routeInfo(path);

  useEffect(() => {
    if (!role) return;
    if (s.session.role !== role) mutate((n) => { n.session.role = role; });
  }, [role]);

  let content;
  if (!role) content = html`<${Landing} />`;
  else if (role === 'parent') content = html`<${ParentShell} page=${page}>
    ${page === 'home' && html`<${ParentHome} />`}
    ${page === 'child' && html`<${ParentChild} />`}
    ${page === 'pickup' && html`<${ParentPickup} />`}
    ${page === 'messages' && html`<${ParentMessages} />`}
    ${page === 'alerts' && html`<${ParentAlerts} />`}
    ${page === 'home-arrival' && html`<${ParentHomeArrival} />`}
    ${page === 'absence' && html`<${ParentAbsence} />`}
    ${page === 'emergency' && html`<${ParentEmergency} />`}
  <//>`;
  else {
    const pages = {
      overview: html`<${PageOverview} role=${role} />`,
      learners: html`<${PageLearners} role=${role} />`,
      classes: html`<${PageClasses} role=${role} />`,
      attendance: html`<${PageAttendance} role=${role} />`,
      movement: html`<${PageMovement} role=${role} />`,
      pickup: html`<${PagePickup} role=${role} />`,
      home: html`<${PageHomeArrival} role=${role} />`,
      parents: html`<${PageParents} role=${role} />`,
      communication: html`<${PageCommunication} role=${role} />`,
      safety: html`<${PageSafety} role=${role} />`,
      reports: html`<${PageReports} role=${role} />`,
      settings: html`<${PageSettings} role=${role} />`,
    };
    content = html`<${AdminShell} role=${role} page=${page}>
      ${pages[page] || html`<div className="card card-p"><${Empty} icon="info" title="Page not found"
        message=${`The route “${path}” does not exist in this prototype.`}
        action=${html`<button className="btn btn-primary" onClick=${() => go('/' + role + '/overview')}>Back to overview</button>`} /></div>`}
    <//>`;
  }

  return html`<${Fragment}>
    ${content}
    <div className="toasts" aria-live="polite">
      ${toasts.map((t) => html`<div key=${t.id} className=${cls('toast', t.tone)}>
        <${Icon} name=${t.tone === 'err' ? 'alert' : t.tone === 'warn' ? 'info' : 'check'} size=${16} />
        <span>${t.msg}</span>
      </div>`)}
    </div>
  <//>`;
}

createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
